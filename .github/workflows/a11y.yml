name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  a11y-scan:
    name: WCAG 2.2 AA scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Tenant org-id used for the dev-header auth bypass. Override in repo
      # variables (Settings → Secrets and variables → Actions → Variables) if
      # the dev-seed default is no longer valid.
      A11Y_ORG_ID: ${{ vars.A11Y_ORG_ID || 'org-t272-55abafb4-dis' }}
      # Base URL the scanner targets. When unset, defaults to the locally
      # started services proxied at http://localhost:80. Override via repo
      # variables to point at a deployed preview environment.
      A11Y_BASE_URL: ${{ vars.A11Y_BASE_URL || 'http://localhost:80' }}
      # Force Playwright to use its bundled Chromium (the Nix discovery in
      # playwright.a11y.config.ts is a no-op outside the Replit container).
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start application stack
        env:
          # Both services hard-fail when these env vars are missing. In Replit
          # they are injected by the artifact runner; in CI we set them
          # explicitly here. They must match the proxy targets below and the
          # ports declared in each artifact.toml.
          API_PORT: "8080"
          WEB_PORT: "23748"
          WEB_BASE_PATH: "/"
        run: |
          # Start the API server and Command Center in the background.
          # The global proxy on :80 (started below) routes to these ports.
          PORT="$API_PORT" \
            pnpm --filter @workspace/api-server run dev > /tmp/api-server.log 2>&1 &
          echo $! > /tmp/api-server.pid
          PORT="$WEB_PORT" BASE_PATH="$WEB_BASE_PATH" \
            pnpm --filter @workspace/command-center run dev > /tmp/command-center.log 2>&1 &
          echo $! > /tmp/command-center.pid

          # Lightweight path-based reverse proxy on :80 that mirrors the
          # Replit dev proxy: `/api/*` → API server, everything else → web.
          # This lets the scan use a single base URL just like local dev.
          sudo --preserve-env=API_PORT,WEB_PORT node -e '
            const http = require("http");
            const apiPort = Number(process.env.API_PORT);
            const webPort = Number(process.env.WEB_PORT);
            const proxy = (target) => (req, res) => {
              const opts = {
                hostname: "127.0.0.1",
                port: target,
                path: req.url,
                method: req.method,
                headers: req.headers,
              };
              const upstream = http.request(opts, (up) => {
                res.writeHead(up.statusCode || 502, up.headers);
                up.pipe(res);
              });
              upstream.on("error", (e) => {
                res.writeHead(502);
                res.end("proxy error: " + e.message);
              });
              req.pipe(upstream);
            };
            http.createServer((req, res) => {
              const target = req.url.startsWith("/api") ? apiPort : webPort;
              proxy(target)(req, res);
            }).listen(80, () => console.log("proxy listening on :80"));
          ' > /tmp/proxy.log 2>&1 &
          echo $! | sudo tee /tmp/proxy.pid > /dev/null

      - name: Wait for application to be ready
        run: |
          set -e
          # Wait up to 120s for both upstreams to respond via the proxy.
          for attempt in $(seq 1 60); do
            api_ok=$(curl -fsS -o /dev/null -w "%{http_code}" http://localhost:80/api/healthz || echo "000")
            web_ok=$(curl -fsS -o /dev/null -w "%{http_code}" http://localhost:80/ || echo "000")
            echo "attempt $attempt: api=$api_ok web=$web_ok"
            if [ "$api_ok" = "200" ] && { [ "$web_ok" = "200" ] || [ "$web_ok" = "304" ]; }; then
              echo "stack ready"
              exit 0
            fi
            sleep 2
          done
          echo "::group::api-server log"; cat /tmp/api-server.log || true; echo "::endgroup::"
          echo "::group::command-center log"; cat /tmp/command-center.log || true; echo "::endgroup::"
          echo "::group::proxy log"; cat /tmp/proxy.log || true; echo "::endgroup::"
          echo "stack failed to become ready" >&2
          exit 1

      - name: Run WCAG 2.2 AA accessibility scan
        run: pnpm run test:a11y

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            test-results/a11y-html
            test-results/a11y-report.json
            test-results/a11y-violations.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop background services
        if: always()
        run: |
          for f in /tmp/api-server.pid /tmp/command-center.pid; do
            [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null || true
          done
          [ -f /tmp/proxy.pid ] && sudo kill "$(cat /tmp/proxy.pid)" 2>/dev/null || true
