name: Scripts test suite

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts-test:
    name: Unit tests for @workspace/scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run scripts test suite
        run: pnpm --filter @workspace/scripts run test
