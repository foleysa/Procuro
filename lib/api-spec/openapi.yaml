          application/json:
            schema:
              $ref: "#/components/schemas/CsvIngestRequest"
      responses:
        "200":
          description: Synchronous sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResultResponse"
        "202":
          description: Job enqueued for async execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"

  /ingest/csv-stream:
    post:
      operationId: ingestCsvStream
      tags: [ingest]
      summary: Stream a single-entity CSV file (bounded-memory ingest)
      description: |
        Streams a single-entity CSV file directly into the database without
        buffering it in memory. Use for very large files (millions of rows)
        that cannot fit in a JSON request body. Memory stays bounded
        regardless of file size.

        The endpoint accepts either:
          * `multipart/form-data` with a single file part named `file`
            (preferred — what the generated client and browser uploads use), or
          * `text/csv` raw body (convenient for `curl --data-binary` and back-compat).

        Hard limit: 1 GB per upload.

        **Response is NDJSON streamed live as the server processes the
        upload.** Once pre-flight validation passes (entity name, declared
        Content-Length under 1 GB), the response Content-Type switches to
        `application/x-ndjson` and the server writes one JSON object per
        line, terminated by `\n`:

          * `{"type":"progress","rowsParsed":N,"rowsInserted":M,"bytesProcessed":B}` —
            emitted after batch flushes, throttled to ~4/sec server-side so
            multi-million-row files don't flood the wire. `bytesProcessed`
            is optional and reports how many request-body bytes the server
            has consumed so far; the client uses it (plus the file size) to
            render a server-side progress bar and a rows/sec ETA.
          * `{"type":"result","entity":"...","rowsParsed":N,"rowsInserted":M,"durationMs":D}` —
            exactly one terminal success event whose payload matches
            `StreamCsvResult`.
          * `{"type":"error","error":"..."}` — exactly one terminal failure
            event for errors that occurred mid-stream after headers were
            sent. (Pre-flight failures still surface as conventional 4xx
            JSON responses with an `error` body.)

        Clients should read the response body incrementally (browser XHR
        `onprogress` + `responseText`, or fetch `body.getReader()`),
        split on `\n`, and parse each non-empty line as JSON. The same
        approach used by the Data Ingest page's `uploadCsvStream` helper
        works in any modern browser without extra dependencies.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: entity
          required: true
          description: Which entity the CSV rows describe.
          schema:
            type: string
            enum:
              - suppliers
              - categories
              - items
              - purchase_orders
              - po_lines
              - invoices
              - payments
              - shipments
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The CSV file to stream-ingest.
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: |
            NDJSON stream. Each line is a JSON object whose `type` field
            discriminates between `progress` (zero or more, throttled),
            `result` (exactly one, terminal success), or `error` (exactly
            one, terminal mid-stream failure).
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/StreamCsvEvent"
        "400":
          description: Invalid entity name (pre-flight rejection, JSON body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: |
            Pre-flight rejection: declared Content-Length exceeds the 1 GB
            per-request size limit. Mid-stream limit hits surface as an
            in-stream `{"type":"error",...}` NDJSON event on a 200 response
            instead, since the response headers have already been sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/mock-erp:
    post:
      operationId: ingestMockErp
      tags: [ingest]
      summary: Run the Mock ERP adapter (proves the abstraction)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: async
          required: false
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockErpIngestRequest"
      responses:
        "200":
          description: Synchronous sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResultResponse"
        "202":
          description: Job enqueued for async execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"

  /intelligence/signals:
    get:
      operationId: listIntelligenceSignals
      tags: [intelligence]
      summary: Tenant-scoped signal browser
      description: |
        Returns market_signals filtered by the active tenant and the
        tenant's `disclosurePolicy`. T3/T4 signals are stripped before
        the wire for non-analyst policies. Optional facet filters narrow
        by signal-type, supplier, country, time window and free-text
        search over scope columns.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: signalType
          schema: { type: string }
        - in: query
          name: supplierId
          schema: { type: string }
        - in: query
          name: country
          schema: { type: string }
          description: ISO-3166 alpha-2 country code (matches scope_lane_key).
        - in: query
          name: q
          schema: { type: string }
          description: Free-text search over supplier / material / lane scope columns.
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Filtered signal list with citations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceSignalListResponse"

  /intelligence/entity/{kind}/{id}:
    get:
      operationId: getIntelligenceEntity360
      tags: [intelligence]
      summary: Entity 360 — recent signals + composite risk for one entity
      description: |
        Identifies an entity by `kind` and `id`. `kind` ∈ {`supplier`,
        `material`, `category`, `lane`, `contract`, `site`}.

        - `supplier`/`contract`: `id` is the database UUID.
        - `material`: `id` is the SKU code.
        - `category`: `id` is the category code.
        - `lane`: `id` is the ISO-2 country code (or any lane key).
        - `site`: `id` is `<supplierId>` (v1 supplier-as-site proxy);
          response is enriched with the supplier's HQ coordinates and
          biased toward facility-level / climate / hazard signals.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [supplier, material, category, lane, contract, site]
        - in: path
          name: id
          required: true
          schema: { type: string }
          example: "01HZ7..."
      responses:
        "200":
          description: Entity profile, recent signals, and per-dimension risk scores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceEntity360Response"
        "404":
          $ref: "#/components/responses/NotFound"

  /intelligence/risk/heatmap:
    get:
      operationId: getIntelligenceRiskHeatmap
      tags: [intelligence]
      summary: Tenant risk heatmap by country and dimension
      description: |
        Composite risk scores per country across the six risk dimensions
        (geo, financial, cyber, esg, climate, sanctions). The aggregator
        groups signals by `scope_lane_key` (country) and runs the
        documented composite scorer; tooltips include the top-3
        contributing signals for each cell so the UI can show the
        "why" with disclosure-tier badges.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: lookbackDays
          schema: { type: integer, minimum: 1, maximum: 730, default: 90 }
      responses:
        "200":
          description: Country × dimension matrix of composite scores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRiskHeatmapResponse"

  /intelligence/events:
    get:
      operationId: listIntelligenceEvents
      tags: [intelligence]
      summary: War-room event stream with geocoordinates and impact paths
      description: |
        Risk events suitable for the War Room map / live feed.
        Currently sourced from:
          - `event_geocoded` (GDELT global event firehose)
          - `natural_hazard` (USGS / NOAA / NASA EONET / GDACS)
          - `sanctions_match` (OFAC / EU / UN / OpenSanctions hits)
          - `corporate_filing` (SEC EDGAR / Companies House material
            filings) — only high-severity rows surface in the war room
            (`severityMin` ≥ 0.7 by default).
        Each item includes an optional `impactPath` propagating the event
        down to tenant spend: event → site → supplier → contract →
        category → spend.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: hours
          schema: { type: integer, minimum: 1, maximum: 720, default: 72 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - in: query
          name: severityMin
          schema: { type: number, minimum: 0, maximum: 1, default: 0.7 }
          description: |
            Minimum severity (0-1, sourced from the signal's confidence)
            below which `corporate_filing` events are filtered out. Other
            event types ignore this filter.
        - in: query
          name: cycleId
          schema: { type: string }
          description: |
            Optional OODA cycle id used by the war-room cross-link to
            preload the cycle's lookback window (`hours` is overridden
            to span the cycle's start → now if cycle is in-flight, or
            cycle.start → cycle.end if completed).
      responses:
        "200":
          description: Recent geocoded events for the war-room view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceEventStreamResponse"

  /intelligence/coverage-gaps:
    get:
      operationId: getIntelligenceCoverageGaps
      tags: [intelligence]
      summary: Spend-weighted coverage gaps
      description: |
        Categories and suppliers ranked by recent spend with little or
        no signal coverage in the last `lookbackDays`. Helps analysts
        find "blind spots" — high-value scopes the collectors aren't
        watching yet.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: lookbackDays
          schema: { type: integer, minimum: 1, maximum: 365, default: 90 }
      responses:
        "200":
          description: Spend-weighted coverage gap list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceCoverageGapsResponse"

  /billing/summary:
    get:
      operationId: getBillingSummary
      tags: [opportunities]
      summary: Realized savings + success-fee summary
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Billing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSummary"

  /contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: List contracts (search + filters + cursor pagination)
      description: |
        Returns contracts owned by the active tenant. Each row carries a
        derived `derivedStatus` field (`active` / `expiring` / `expired`)
        computed from `endDate` and the tenant's
        `contractRenewalAlertDays` threshold so the list and renewal
        calendar can colour-code uniformly without recomputing on the
        client.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: search
          description: Substring match on `contractNumber` or `title`.
          schema: { type: string }
        - in: query
          name: status
          description: |
            Filter by stored `status` (`active` / `pending` / `expired` /
            `cancelled`) or by the derived bucket `expiring` (active
            contracts where days-to-expiry <= the tenant's renewal
            threshold).
          schema:
            type: string
            enum: [active, pending, expired, cancelled, expiring]
        - in: query
          name: supplierId
          schema: { type: string }
        - in: query
          name: categoryId
          schema: { type: string }
        - in: query
          name: currency
          description: Filter by `billingCurrency` (ISO 4217).
          schema: { type: string }
        - in: query
          name: owner
          description: Substring match on `owner`.
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Contracts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractListResponse"

  /contracts/{id}:
    get:
      operationId: getContract
      tags: [contracts]
      summary: Contract detail (header + items + linked opportunities + signals)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Contract detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchContract
      tags: [contracts]
      summary: Inline-edit contract operator fields
      description: |
        Update a small set of operator-controlled fields on a contract:
        `owner`, `internalNotes`, `renewalTargetDate`, and
        `renewalTargetAction`. Every changed field is recorded in the
        contract audit log so reviewers can answer "who set this and
        when?". Returns the refreshed `ContractDetail` shape so the UI
        re-renders in one round-trip.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchContractRequest"
      responses:
        "200":
          description: Updated contract detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /watched-issuers:
    get:
      operationId: listWatchedIssuers
      tags: [watched-issuers]
      summary: List the tenant's watched corporate filers
      description: |
        Returns the rows the active tenant has added to the watched-issuer
        registry. Each row names one company (by SEC CIK or UK Companies
        House number) the corporate-filing collectors should poll on this
        tenant's behalf. When the union of all tenants' rows is empty for
        a given source, that collector falls back to its built-in default
        list.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: source
          required: false
          schema:
            $ref: "#/components/schemas/WatchedIssuerSource"
      responses:
        "200":
          description: Watched issuers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchedIssuerListResponse"
    post:
      operationId: addWatchedIssuer
      tags: [watched-issuers]
      summary: Add one company to the tenant's watch list
      description: |
        Identifiers are normalised on the way in (SEC CIK is zero-padded
        to 10 digits, Companies House numbers are zero-padded to 8 chars
        with prefix upper-cased). Re-posting the same `(source, identifier)`
        for the active tenant returns 409.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWatchedIssuerRequest"
      responses:
        "201":
          description: Watched issuer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchedIssuer"
        "400":
          description: Invalid identifier shape or supplier link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Identifier is already on the tenant's watch list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /watched-issuers/{id}:
    delete:
      operationId: removeWatchedIssuer
      tags: [watched-issuers]
      summary: Remove a watched issuer from the tenant's list
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"

  /system/cleanup/status:
    get:
      operationId: getSystemCleanupStatus
      tags: [system]
      summary: Most-recent prune-jobs run + retention windows
      description: |
        Returns the most recent `prune_jobs` row (regardless of status)
        and the configured retention windows. Used by the System page to
        show "Last cleanup at" and the next-eligible window. Cross-tenant
        endpoint — gated by the platform-admin token.
      responses:
        "200":
          description: Cleanup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemCleanupStatus"

  /system/cleanup/run:
    post:
      operationId: runSystemCleanup
      tags: [system]
      summary: Enqueue a prune_jobs run on demand
      description: |
        Enqueues a `prune_jobs` job (or returns the in-flight one if a
        prune is already pending or running). Always returns 202 with
        the job id so the caller can poll progress. Cross-tenant
        endpoint — gated by the platform-admin token.
      responses:
        "202":
          description: Cleanup enqueued (or already in-flight)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemCleanupRunAccepted"

components:
  parameters:
    OrgIdHeader:
      in: header
      name: x-org-id
      required: false
      schema: { type: string }
      description: |
        Tenant ID hint. In production, requests MUST present
        `Authorization: Bearer <token>` and `x-org-id` (if supplied) must
        match the org bound to that token. In development, this header is
        accepted standalone.
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: string }

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Per-tenant API token. The plaintext token is sha256-hashed server-side
        and matched against `org_api_tokens.token_hash` to derive the active
        tenant scope. Required in production; optional in development.

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        details: {}

    Org:
      type: object
      required:
        [id, slug, name, createdAt, disclosurePolicy, contractRenewalAlertDays]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        successFeePct:
          type: number
          description: Default contingency fee on realized savings
        disclosurePolicy:
          $ref: "#/components/schemas/DisclosurePolicy"
        contractRenewalAlertDays:
          type: integer
          minimum: 1
          description: |
            Days-to-expiry threshold used by the renewal-alert worker.
            Defaults to 90 when not explicitly set in `orgs.settings`.
        createdAt: { type: string, format: date-time }

    DisclosurePolicy:
      type: string
      description: |
        Per-tenant insight-citation disclosure policy. Controls which
        intelligence-source tiers are surfaced when rendering an insight
        via the disclosure-tier renderer. `conservative` only shows T1+T2
        attributions, `standard` adds T3 (class label + confidence) and
        `analyst` shows full provenance for every tier including T4.
      enum: [conservative, standard, analyst]

    MeResponse:
      type: object
      required: [org]
      properties:
        org:
          $ref: "#/components/schemas/Org"
        actorEmail: { type: string }

    PatchMeSettingsRequest:
      type: object
      description: |
        Partial update for `orgs.settings`. Every property is optional;
        unspecified keys are left untouched on the stored JSONB.
      properties:
        disclosurePolicy:
          $ref: "#/components/schemas/DisclosurePolicy"
        contractRenewalAlertDays:
          type: integer
          minimum: 1
          maximum: 365
          description: |
            Days-to-expiry threshold the daily renewal-alert worker uses
            to surface a contract as a renewal alert. Default 90.

    LeverId:
      type: string
      enum:
        - sku_price_benchmark
        - maverick_spend
        - contract_leakage
        - duplicate_payment
        - missed_volume_threshold
        - payment_term_extension
        - tail_spend_rationalization
        - supplier_consolidation
        - contract_renegotiation_trigger
        - supplier_fx_exposure

    RejectionReasonCode:
      type: string
      enum:
        - supplier_strategic_do_not_consolidate
        - supplier_dei_or_diverse_program
        - compliance_or_legal_block
        - quality_risk_too_high
        - timing_blocked_by_business
        - savings_overstated
        - already_actioned
        - other

    SpendOverview:
      type: object
      required:
        [
          totalSpendUsd,
          byClass,
          byCategory,
          bySupplier,
          byBusinessUnit,
          concentration,
        ]
      properties:
        totalSpendUsd: { type: number }
        byClass:
          type: array
          items:
            type: object
            required: [spendClass, spendUsd]
            properties:
              spendClass: { type: string }
              spendUsd: { type: number }
        byCategory:
          type: array
          items:
            type: object
            required: [categoryId, categoryName, categoryClass, spendUsd]
            properties:
              categoryId: { type: string }
              categoryName: { type: string }
              categoryClass: { type: string }
              spendUsd: { type: number }
        bySupplier:
          type: array
          items:
            type: object
            required: [supplierId, supplierName, spendUsd, poCount]
            properties:
              supplierId: { type: string }
              supplierName: { type: string }
              spendUsd: { type: number }
              poCount: { type: number }
        byBusinessUnit:
          type: array
          items:
            type: object
            required: [businessUnit, spendUsd]
            properties:
              businessUnit: { type: string }
              spendUsd: { type: number }
        concentration:
          type: object
          required:
            [
              top10SupplierShare,
              activeSupplierCount,
              tailSupplierCount,
              tailSpendUsd,
            ]
          properties:
            top10SupplierShare: { type: number }
            activeSupplierCount: { type: number }
            tailSupplierCount: { type: number }
            tailSpendUsd: { type: number }

    Supplier:
      type: object
      required: [id, name, isStrategic, isPreferred]
      properties:
        id: { type: string }
        name: { type: string }
        countryCode: { type: string, nullable: true }
        paymentTermsDays: { type: string, nullable: true }
        isStrategic: { type: boolean }
        isPreferred: { type: boolean }
        tags:
          type: array
          items: { type: string }

    SupplierListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Supplier"
        nextCursor:
          type: string
          nullable: true

    SupplierIntelligenceSignalType:
      type: string
      description: |
        Subset of `MarketSignal.signalType` that the supplier-intelligence
        endpoint surfaces. These are exactly the signal types emitted by
        the Phase-2 public-API collectors (sanctions, corporate filings,
        entity registry, facility emissions, natural hazard, geocoded
        events, OpenSanctions risk screening).
      enum:
        - sanctions_match
        - risk_screening_match
        - corporate_filing
        - entity_registry
        - facility_emissions
        - natural_hazard
        - event_geocoded

    SupplierIntelligenceMatchKind:
      type: string
      description: |
        How this signal was matched to the supplier — `entity_uid` is the
        canonical cross-collector join, `supplier_name` is the
        case-insensitive name fallback used when no resolved entity uid
        is available (or when the row predates resolution).
      enum: [entity_uid, supplier_name]

    SupplierIntelligenceSignal:
      type: object
      required:
        [
          id,
          signalType,
          observedAt,
          matchKind,
          collectorId,
          collectorName,
          sourceUrl,
          contract,
        ]
      properties:
        id: { type: string }
        signalType:
          $ref: "#/components/schemas/SupplierIntelligenceSignalType"
        observedAt: { type: string, format: date-time }
        matchKind:
          $ref: "#/components/schemas/SupplierIntelligenceMatchKind"
        collectorId: { type: string }
        collectorName: { type: string }
        sourceUrl: { type: string }
        contract:
          type: object
          required:
            [
              postureClass,
              disclosureTier,
              jurisdiction,
              retentionDays,
              tenantOptInDefault,
            ]
          properties:
            postureClass:
              type: string
              enum: [public_api, tos_restricted, gray_hat]
            disclosureTier:
              type: string
              enum: [T1, T2, T3, T4]
            jurisdiction: { type: string }
            retentionDays: { type: integer }
            tenantOptInDefault: { type: boolean }
        scopeSupplierName: { type: string, nullable: true }
        scopeCategoryCode: { type: string, nullable: true }
        scopeSku: { type: string, nullable: true }
        scopeLaneKey: { type: string, nullable: true }
        value: { type: number }
        unit: { type: string }
        currency: { type: string }
        confidence: { type: number }
        entityUid: { type: string, nullable: true }
        headline:
          type: string
          description: |
            Short human-readable summary derived from the signal — used as
            the row title in the supplier risk timeline. The server picks
            the right field from the metadata blob per signal type so the
            client can render every row uniformly.
        detail:
          type: string
          nullable: true
          description: |
            Optional secondary line surfaced under the headline (e.g. the
            sanctions list name, the EDGAR form code, or the natural-hazard
            magnitude). May be null when the signal carries no useful
            sub-headline.

    SupplierIntelligenceResponse:
      type: object
      required:
        [supplierId, supplierName, resolvedEntityUid, totalCount, items]
      properties:
        supplierId: { type: string }
        supplierName: { type: string }
        countryCode: { type: string, nullable: true }
        resolvedEntityUid:
          type: string
          nullable: true
          description: |
            Canonical entity uid the resolver returned for this supplier —
            null when neither identifier nor BQ-name match was found, in
            which case only the `supplier_name` fallback contributed
            signals to `items`.
        resolvedMatchType:
          type: string
          nullable: true
          enum: [identifier, deterministic_name, fuzzy_gemini, unresolved]
        countsByType:
          type: object
          description: |
            Map from `SupplierIntelligenceSignalType` to the number of
            items in this response with that type. Empty when no signals
            matched.
          additionalProperties: { type: integer }
        totalCount:
          type: integer
          description: Total number of items returned (`items.length`).
        items:
          type: array
          items:
            $ref: "#/components/schemas/SupplierIntelligenceSignal"

    Opportunity:
      type: object
      required:
        [
          id,
          orgId,
          cycleId,
          leverId,
          tier,
          status,
          title,
          rationale,
          recommendedAction,
          rawProjectedSavingsUsd,
          projectedSavingsUsd,
          confidence,
          createdAt,
        ]
      properties:
        id: { type: string }
        orgId: { type: string }
        cycleId: { type: string }
        leverId:
          $ref: "#/components/schemas/LeverId"
        tier: { type: integer }
        status:
          type: string
          enum:
            [proposed, approved, rejected, executing, realized, expired]
        title: { type: string }
        rationale: { type: string }
        recommendedAction: { type: string }
        supplierId: { type: string, nullable: true }
        supplierName: { type: string, nullable: true }
        categoryId: { type: string, nullable: true }
        categoryName: { type: string, nullable: true }
        rawProjectedSavingsUsd: { type: number }
        projectedSavingsUsd: { type: number }
        confidence: { type: number }
        realizedSavingsUsd: { type: number, nullable: true }
        rejectedReasonCode:
          allOf:
            - $ref: "#/components/schemas/RejectionReasonCode"
          nullable: true
        rejectedReasonText: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        rejectedAt: { type: string, format: date-time, nullable: true }
        executingAt: { type: string, format: date-time, nullable: true }
        realizedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    OpportunityDetail:
      allOf:
        - $ref: "#/components/schemas/Opportunity"
        - type: object
          required: [sources]
          properties:
            inputs:
              type: object
              additionalProperties: true
            sources:
              type: array
              description: |
                Raw signal-source descriptors that backed this opportunity.
                The Command Center calls `renderInsight()` from
                `@workspace/intelligence/tier` on these and the active
                tenant's `disclosurePolicy` to derive a tier-appropriate
                citation list for display.
              items:
                $ref: "#/components/schemas/InsightSource"
            decisions:
              type: array
              items:
                $ref: "#/components/schemas/Decision"

    InsightSource:
      type: object
      description: |
        A single signal-source descriptor backing an insight. Mirrors the
        `SignalSource` shape consumed by the disclosure-tier renderer in
        `@workspace/intelligence/tier`. The `contract` block carries the
        collector's posture + disclosure metadata so the renderer can
        decide what (if anything) to surface to the user.
      required: [collectorId, collectorName, sourceUrl, observedAt, contract]
      properties:
        collectorId: { type: string }
        collectorName: { type: string }
        sourceUrl: { type: string }
        observedAt: { type: string, format: date-time }
        contract:
          type: object
          required:
            [
              postureClass,
              disclosureTier,
              jurisdiction,
              retentionDays,
              tenantOptInDefault,
            ]
          properties:
            postureClass:
              type: string
              enum: [public_api, tos_restricted, gray_hat]
            disclosureTier:
              type: string
              enum: [T1, T2, T3, T4]
            jurisdiction: { type: string }
            retentionDays: { type: integer }
            tenantOptInDefault: { type: boolean }

    OpportunityListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Opportunity"
        nextCursor:
          type: string
          nullable: true

    Decision:
      type: object
      required: [id, opportunityId, eventType, actorEmail, createdAt]
      properties:
        id: { type: string }
        opportunityId: { type: string }
        eventType:
          type: string
          enum: [approve, reject, execute, realize]
        actorEmail: { type: string }
        rejectedReasonCode:
          allOf:
            - $ref: "#/components/schemas/RejectionReasonCode"
          nullable: true
        rejectedReasonText: { type: string, nullable: true }
        realizedSavingsUsd: { type: number, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ApproveOpportunityRequest:
      type: object
      properties:
        notes: { type: string }

    RejectOpportunityRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          $ref: "#/components/schemas/RejectionReasonCode"
        reasonText: { type: string }

    RealizeOpportunityRequest:
      type: object
      required: [realizedSavingsUsd]
      properties:
        realizedSavingsUsd: { type: number }
        notes: { type: string }

    Cycle:
      type: object
      required:
        [
          id,
          orgId,
          generation,
          status,
          opportunitiesCreated,
          totalProjectedUsd,
          startedAt,
        ]
      properties:
        id: { type: string }
        orgId: { type: string }
        generation: { type: integer }
        status:
          type: string
          enum: [running, completed, failed]
        triggeredBy: { type: string }
        opportunitiesCreated: { type: integer }
        totalProjectedUsd: { type: number }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    CycleDetail:
      allOf:
        - $ref: "#/components/schemas/Cycle"
        - type: object
          required: [sources]
          properties:
            observePayload: { type: object, additionalProperties: true }
            orientPayload: { type: object, additionalProperties: true }
            decidePayload: { type: object, additionalProperties: true }
            actPayload: { type: object, additionalProperties: true }
            learnPayload: { type: object, additionalProperties: true }
            sources:
              type: array
              description: |
                De-duplicated union of every signal source backing the
                opportunities created in this cycle. The Command Center
                renders these through `renderInsight()` from
                `@workspace/intelligence/tier` to produce a cycle-level
                citation block respecting the tenant's `disclosurePolicy`.
              items:
                $ref: "#/components/schemas/InsightSource"

    RunCycleResponse:
      type: object
      required:
        [cycleId, generation, opportunitiesCreated, totalProjectedUsd]
      properties:
        cycleId: { type: string }
        generation: { type: integer }
        opportunitiesCreated: { type: integer }
        totalProjectedUsd: { type: number }
        priorDeltas:
          type: array
          items:
            $ref: "#/components/schemas/PriorDelta"

    LearnedPrior:
      type: object
      required:
        [
          leverId,
          projectionMultiplier,
          confidenceWeight,
          evidenceCount,
          approvalCount,
          rejectionCount,
          realizationCount,
        ]
      properties:
        leverId:
          $ref: "#/components/schemas/LeverId"
        projectionMultiplier: { type: number }
        confidenceWeight: { type: number }
        evidenceCount: { type: integer }
        approvalCount: { type: integer }
        rejectionCount: { type: integer }
        realizationCount: { type: integer }
        updatedAtCycle: { type: integer, nullable: true }

    PriorDelta:
      type: object
      required:
        [
          leverId,
          prevProjectionMultiplier,
          newProjectionMultiplier,
          prevConfidenceWeight,
          newConfidenceWeight,
          rationale,
        ]
      properties:
        leverId:
          $ref: "#/components/schemas/LeverId"
        prevProjectionMultiplier: { type: number }
        newProjectionMultiplier: { type: number }
        prevConfidenceWeight: { type: number }
        newConfidenceWeight: { type: number }
        approvals: { type: integer }
        rejections: { type: integer }
        realizations: { type: integer }
        rationale: { type: string }

    Collector:
      type: object
      required: [id, name, posture, status]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        posture:
          type: string
          enum:
            [public-api, published-data, respect-robots-crawl, aggressive-crawl]
        status:
          type: string
          enum: [enabled, disabled, killed]
        sourceUrl: { type: string, nullable: true }
        defaultRateLimitRpm: { type: integer, nullable: true }
        defaultScheduleCron: { type: string, nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastSignalCount: { type: integer, nullable: true }
        postureClass:
          type: string
          enum: [public_api, tos_restricted, gray_hat]
          description: |
            Canonical posture classification used by the disclosure tier
            renderer (`public-api`/`published-data` map to `public_api`,
            `respect-robots-crawl` maps to `tos_restricted`,
            `aggressive-crawl` maps to `gray_hat`).
        disclosureTier:
          type: string
          enum: [T1, T2, T3, T4]
          description: |
            Tier at which this source can be cited downstream. T1 = full
            attribution, T4 = invisible / confidence boost only.
        jurisdiction:
          type: string
          description: ISO-3166 alpha-2 code or "GLOBAL".
        flagEmoji: { type: string, nullable: true }
        retentionDays: { type: integer, nullable: true }
        tenantOptInDefault: { type: boolean, nullable: true }
        tenantOptedIn:
          type: boolean
          nullable: true
          description: |
            Resolved opt-in state for the active tenant. Falls back to
            `tenantOptInDefault` when the tenant has no explicit override
            in `collector_tenant_opt_ins`.

    CollectorRunResult:
      type: object
      required: [collectorId, signalsWritten, durationMs]
      properties:
        collectorId: { type: string }
        signalsWritten: { type: integer }
        durationMs: { type: integer }
        skipped: { type: boolean }
        skipReason: { type: string }

    CollectorBackfillResult:
      type: object
      required:
        - collectorId
        - daysWritten
        - signalsInserted
        - signalsSkipped
        - durationMs
      properties:
        collectorId: { type: string }
        daysWritten:
          type: integer
          description: Distinct calendar days covered by the backfill.
        signalsInserted:
          type: integer
          description: New `market_signals` rows written by this run.
        signalsSkipped:
          type: integer
          description: |
            Drafts that matched an existing
            `(scope_material_code, observed_at)` row and were not re-inserted.
        durationMs: { type: integer }

    MarketSignal:
      type: object
      required: [id, signalType, value, observedAt, createdAt]
      properties:
        id: { type: string }
        collectorId: { type: string, nullable: true }
        signalType: { type: string }
        scopeMaterialCode: { type: string, nullable: true }
        scopeCategoryCode: { type: string, nullable: true }
        scopeCategoryId: { type: string, nullable: true }
        scopeSupplierId: { type: string, nullable: true }
        value: { type: number }
        unit: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        observedAt: { type: string, format: date-time }
        sourceUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ContractDerivedStatus:
      type: string
      description: |
        Bucketed view of a contract's expiration state:
          - `active` — `endDate > now + tenant renewal threshold`
          - `expiring` — `0 < daysToExpiry <= tenant renewal threshold`
          - `expired` — `endDate <= now`
        Computed server-side so the renewal calendar / list / colour
        coding stays consistent across surfaces.
      enum: [active, expiring, expired, pending, cancelled]

    Contract:
      type: object
      required:
        [
          id,
          orgId,
          supplierId,
          contractNumber,
          title,
          status,
          derivedStatus,
          startDate,
          endDate,
          createdAt,
          renewalAlertedThresholds,
        ]
      properties:
        id: { type: string }
        orgId: { type: string }
        supplierId: { type: string }
        supplierName: { type: string, nullable: true }
        categoryId: { type: string, nullable: true }
        categoryName: { type: string, nullable: true }
        contractNumber: { type: string }
        title: { type: string }
        status:
          type: string
          enum: [active, pending, expired, cancelled]
        derivedStatus:
          $ref: "#/components/schemas/ContractDerivedStatus"
        daysToExpiry:
          type: integer
          nullable: true
          description: |
            Whole days from now to `endDate`. Negative if already
            expired. Null when `endDate` is somehow missing.
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        paymentTermsDays: { type: integer, nullable: true }
        referenceIndex: { type: string, nullable: true }
        billingCurrency: { type: string, nullable: true }
        annualBaselineUsd: { type: number, nullable: true }
        owner: { type: string, nullable: true }
        internalNotes: { type: string, nullable: true }
        renewalTargetDate:
          type: string
          format: date-time
          nullable: true
        renewalTargetAction: { type: string, nullable: true }
        renewalAlertedThresholds:
          type: array
          items: { type: integer }
        sourceSystem: { type: string }
        sourceExternalId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ContractListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Contract"
        nextCursor:
          type: string
          nullable: true

    ContractItem:
      type: object
      required: [id, sku, contractedUnitPriceUsd]
      properties:
        id: { type: string }
        sku: { type: string }
        itemId: { type: string, nullable: true }
        contractedUnitPriceUsd: { type: number }
        tiers:
          type: array
          items:
            type: object
            required: [minQty, unitPriceUsd]
            properties:
              minQty: { type: number }
              unitPriceUsd: { type: number }

    ContractLinkedOpportunity:
      type: object
      required: [id, leverId, status, title, projectedSavingsUsd]
      properties:
        id: { type: string }
        leverId: { type: string }
        status: { type: string }
        title: { type: string }
        projectedSavingsUsd: { type: number }
        createdAt: { type: string, format: date-time }

    ContractAuditEntry:
      type: object
      required: [id, field, actorEmail, createdAt]
      properties:
        id: { type: string }
        field: { type: string }
        actorEmail: { type: string }
        oldValue: {}
        newValue: {}
        createdAt: { type: string, format: date-time }

    ContractDetail:
      allOf:
        - $ref: "#/components/schemas/Contract"
        - type: object
          required:
            [items, linkedOpportunities, marketSignals, sources, auditLog]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ContractItem"
            linkedOpportunities:
              type: array
              items:
                $ref: "#/components/schemas/ContractLinkedOpportunity"
            marketSignals:
              type: array
              description: |
                Most-recent FX rate observations for the contract's
                billing currency pair (when set) and category-scoped
                PPI/economic-index observations. The Command Center
                renders these in the FX exposure / PPI benchmark cards.
              items:
                $ref: "#/components/schemas/MarketSignal"
            sources:
              type: array
              description: |
                De-duplicated `InsightSource[]` backing the linked
                opportunities. Render through `renderInsight()`.
              items:
                $ref: "#/components/schemas/InsightSource"
            auditLog:
              type: array
              items:
                $ref: "#/components/schemas/ContractAuditEntry"

    PatchContractRequest:
      type: object
      description: |
        Partial update for the operator-controlled fields on a contract.
        Every property is optional. Sending `null` for a nullable field
        clears it; omitting a field leaves the stored value unchanged.
      properties:
        owner:
          type: string
          nullable: true
          maxLength: 200
        internalNotes:
          type: string
          nullable: true
          maxLength: 5000
        renewalTargetDate:
          type: string
          format: date-time
          nullable: true
        renewalTargetAction:
          type: string
          nullable: true
          maxLength: 1000

    IntelligenceSignal:
      type: object
      description: |
        Signal Browser row. Includes the resolved scope label and a
        single `InsightSource` citation per row so the renderer can
        decide whether to surface it (T1/T2) or summarise it
        (T3/T4) in conservative tenants.
      required:
        [
          id,
          signalType,
          value,
          observedAt,
          tier,
          scope,
          source,
        ]
      properties:
        id: { type: string }
        signalType: { type: string }
        value: { type: number }
        unit: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        observedAt: { type: string, format: date-time }
        sourceUrl: { type: string, nullable: true }
        tier:
          type: string
          enum: [T1, T2, T3, T4]
        scope:
          type: object
          required: [kind, label]
          properties:
            kind:
              type: string
              enum: [material, category, supplier, sku, lane, none]
            label: { type: string }
            materialCode: { type: string, nullable: true }
            categoryCode: { type: string, nullable: true }
            supplierName: { type: string, nullable: true }
            supplierId: { type: string, nullable: true }
            laneKey: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        source:
          $ref: "#/components/schemas/InsightSource"

    IntelligenceSignalListResponse:
      type: object
      required: [items, totalCount, policy, droppedByPolicy]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceSignal" }
        nextCursor: { type: string, nullable: true }
        totalCount:
          type: integer
          description: Total signals matching the filter (post-policy).
        droppedByPolicy:
          type: integer
          description: |
            How many T3/T4 signals were stripped from this response by
            the active disclosure policy. Lets the UI tell analysts
            "5 hidden" without leaking the rows themselves.
        policy:
          type: string
          enum: [conservative, standard, analyst]

    IntelligenceRiskScore:
      type: object
      required: [dimension, score, band, signalCount, topContributors]
      properties:
        dimension:
          type: string
          enum: [geo, financial, cyber, esg, climate, sanctions]
        score:
          type: integer
          minimum: 0
          maximum: 100
        band:
          type: string
          enum: [low, moderate, elevated, high]
        signalCount: { type: integer }
        topContributors:
          type: array
          items:
            type: object
            required: [signalId, signalType, tier, weighted, observedAt]
            properties:
              signalId: { type: string }
              signalType: { type: string }
              tier:
                type: string
                enum: [T1, T2, T3, T4]
              collectorId: { type: string, nullable: true }
              collectorName: { type: string, nullable: true }
              weighted: { type: number }
              observedAt: { type: string, format: date-time }

    IntelligenceEntity360Response:
      type: object
      required: [kind, id, label, signals, risk, policy]
      properties:
        kind:
          type: string
          enum: [supplier, material, category, lane, contract, site]
        id: { type: string }
        label: { type: string }
        country: { type: string, nullable: true }
        recentSpend:
          type: number
          nullable: true
          description: Spend in the lookback window in tenant currency.
        risk:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceRiskScore" }
        signals:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceSignal" }
        policy:
          type: string
          enum: [conservative, standard, analyst]
        droppedByPolicy: { type: integer }
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Kind-specific enrichment payload. Examples:
            - `contract`: { contractNumber, title, status, supplierId,
              supplierName, categoryCode, startDate, endDate,
              annualBaselineUsd }
            - `site`: { supplierId, supplierName, lat, lng, country,
              proxiedAs: "supplier" }

    IntelligenceRiskHeatmapCell:
      type: object
      required: [country, dimension, score, band, signalCount]
      properties:
        country: { type: string }
        dimension:
          type: string
          enum: [geo, financial, cyber, esg, climate, sanctions]
        score: { type: integer, minimum: 0, maximum: 100 }
        band:
          type: string
          enum: [low, moderate, elevated, high]
        signalCount: { type: integer }
        topContributors:
          type: array
          items:
            type: object
            required: [signalId, signalType, tier, weighted, observedAt]
            properties:
              signalId: { type: string }
              signalType: { type: string }
              tier:
                type: string
                enum: [T1, T2, T3, T4]
              collectorName: { type: string, nullable: true }
              weighted: { type: number }
              observedAt: { type: string, format: date-time }

    IntelligenceRiskHeatmapResponse:
      type: object
      required: [dimensions, countries, cells, generatedAt, policy]
      properties:
        dimensions:
          type: array
          items: { type: string }
        countries:
          type: array
          items: { type: string }
        cells:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceRiskHeatmapCell" }
        sites:
          type: array
          description: |
            Site-level risk points used by the map view. v1 emits one
            point per supplier (supplier-as-site proxy) located at the
            supplier's headquarters country centroid; future versions
            will read from a dedicated `sites` table. `riskScore` is the
            max composite score for the site across all dimensions for
            the active disclosure policy.
          items:
            type: object
            required: [siteId, label, country, riskScore, signalCount]
            properties:
              siteId: { type: string }
              supplierId: { type: string, nullable: true }
              label: { type: string }
              country: { type: string }
              lat: { type: number, nullable: true }
              lng: { type: number, nullable: true }
              riskScore: { type: integer, minimum: 0, maximum: 100 }
              band:
                type: string
                enum: [low, moderate, elevated, high]
              signalCount: { type: integer }
              recentSpend: { type: number, nullable: true }
        generatedAt: { type: string, format: date-time }
        policy:
          type: string
          enum: [conservative, standard, analyst]

    IntelligenceEvent:
      type: object
      required: [id, signalType, observedAt, tier, source]
      properties:
        id: { type: string }
        signalType: { type: string }
        observedAt: { type: string, format: date-time }
        title: { type: string, nullable: true }
        country: { type: string, nullable: true }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        severity: { type: number, nullable: true }
        actor: { type: string, nullable: true }
        eventCode: { type: string, nullable: true }
        tier:
          type: string
          enum: [T1, T2, T3, T4]
        source:
          $ref: "#/components/schemas/InsightSource"
        impactPath:
          type: array
          nullable: true
          description: |
            Propagation chain from the event down to tenant spend:
            event → site → supplier → contract → category → spend.
            Each step is a typed link the UI can render as a breadcrumb
            and use to deep-link into Entity 360. Exposure is the spend
            amount (USD, lookback window) attached to the leaf when known.
          items:
            type: object
            required: [step, kind, label]
            properties:
              step:
                type: string
                enum: [event, site, supplier, contract, category, spend]
              kind:
                type: string
                description: |
                  Entity-360-compatible kind for this link, or `spend`
                  for the terminal node.
                enum: [event, site, supplier, contract, category, spend]
              id: { type: string, nullable: true }
              label: { type: string }
              exposureUsd: { type: number, nullable: true }

    IntelligenceEventStreamResponse:
      type: object
      required: [items, generatedAt, policy, droppedByPolicy]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceEvent" }
        generatedAt: { type: string, format: date-time }
        policy:
          type: string
          enum: [conservative, standard, analyst]
        droppedByPolicy: { type: integer }

    IntelligenceCoverageGap:
      type: object
      required: [scopeKind, scopeLabel, recentSpend, signalCount, severity]
      properties:
        scopeKind:
          type: string
          enum: [supplier, category, material]
        scopeId: { type: string, nullable: true }
        scopeLabel: { type: string }
        scopeCode: { type: string, nullable: true }
        country: { type: string, nullable: true }
        recentSpend:
          type: number
          description: Spend in tenant currency over the lookback window.
        signalCount:
          type: integer
          description: Number of signals attached to this scope in the window.
        lastSignalAt:
          type: string
          format: date-time
          nullable: true
        severity:
          type: string
          enum: [critical, high, medium, low]
          description: |
            Coverage gap severity bucket. Critical = high spend + zero
            signals; low = high signal coverage already.
        recommendedCollectors:
          type: array
          description: |
            Collector ids the operator should consider enabling to close
            this gap (heuristic — based on `scopeKinds` of catalogued
            collectors).
          items: { type: string }

    IntelligenceCoverageGapsResponse:
      type: object
      required: [items, lookbackDays, generatedAt]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceCoverageGap" }
        lookbackDays: { type: integer }
        generatedAt: { type: string, format: date-time }

    Job:
      type: object
      required: [id, kind, status, attempts, maxAttempts, enqueuedAt]
      properties:
        id: { type: string }
        orgId: { type: string, nullable: true }
        kind: { type: string }
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
          description: |
            `cancelled` is a distinct terminal state from `failed` and is
            only used for operator-initiated cancellations (it never
            results from infrastructure errors or exhausted retries).
        attempts: { type: integer }
        maxAttempts:
          type: integer
          description: |
            Total automatic-attempt budget (initial run + auto-retries).
            When `attempts` reaches this value the worker stops retrying
            and marks the job `failed`.
        progress: { type: integer }
        result: { type: object, additionalProperties: true, nullable: true }
        error: { type: string, nullable: true }
        cancelRequested:
          type: boolean
          description: |
            True once an operator has requested cancellation. For `running`
            jobs the worker will rewrite the terminal state to `cancelled`
            with error "Cancelled by operator" once the handler returns.
        enqueuedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        scheduledFor:
          type: string
          format: date-time
          nullable: true
          description: |
            Earliest time the worker is allowed to claim this job again.
            Set to a future timestamp while a job is in retry-backoff
            after a transient failure; `null` means the job is ready to
            run immediately (the common case).

    JobKindSetting:
      type: object
      required: [kind, maxAttempts, defaultMaxAttempts, isOverride]
      properties:
        kind:
          type: string
          enum: [ingest_csv, ingest_mock_erp, run_analysis_cycle, run_collector]
        maxAttempts:
          type: integer
          minimum: 1
          description: |
            Effective auto-retry budget for this kind: operator override if
            one is set, otherwise the in-code default.
        defaultMaxAttempts:
          type: integer
          minimum: 1
          description: |
            The in-code default for this kind. Shown in the UI so operators
            can see what value the system would fall back to if the
            override were removed.
        isOverride:
          type: boolean
          description: |
            True when `maxAttempts` comes from the `job_kind_settings`
            table; false when it falls back to `defaultMaxAttempts`.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the override was last written. Null when there is no override.
        lastChangedBy:
          type: string
          nullable: true
          description: |
            Email/identifier of the operator who most recently wrote this
            override. Null when no override exists, or when the override
            was created before audit columns were introduced.
        lastChangedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Wall-clock timestamp of the most recent override write.
            Mirrors `updatedAt` for new writes but is set explicitly so
            it stays accurate across upsert paths.

    UpdateJobKindSettingRequest:
      type: object
      required: [maxAttempts]
      properties:
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 100

    JobCancelled:
      type: object
      required: [jobId, status, cancelRequested, cancelledImmediately]
      properties:
        jobId: { type: string }
        status:
          type: string
          enum: [running, cancelled]
          description: |
            `cancelled` when the job was `pending` and was transitioned
            immediately, `running` when the cancel flag was set on a
            running job (the worker will mark it cancelled when the
            handler returns).
        cancelRequested:
          type: boolean
          description: Always true on a successful response.
        cancelledImmediately:
          type: boolean
          description: |
            True if the job was pending and is now marked cancelled;
            false if the job was running and the cancel flag was set
            (the worker will finalize the cancellation on the next safe
            checkpoint).

    SystemCleanupStatus:
      type: object
      required: [lastJob, activeJobId, retention]
      properties:
        lastJob:
          nullable: true
          type: object
          required: [id, status, enqueuedAt]
          properties:
            id: { type: string }
            status:
              type: string
              enum: [pending, running, succeeded, failed, cancelled]
            enqueuedAt: { type: string, format: date-time }
            startedAt: { type: string, format: date-time, nullable: true }
            completedAt: { type: string, format: date-time, nullable: true }
            result:
              type: object
              additionalProperties: true
              nullable: true
            error: { type: string, nullable: true }
        activeJobId:
          type: string
          nullable: true
          description: |
            ID of an in-flight `prune_jobs` row (status pending or
            running), or null when no prune is scheduled. The UI uses
            this to disable the "Run cleanup now" button while a prune
            is already queued.
        retention:
          type: object
          required: [succeededOlderThanMs, failedOlderThanMs]
          properties:
            succeededOlderThanMs: { type: integer }
            failedOlderThanMs:
              type: integer
              description: |
                Retention window for both `failed` and `cancelled` jobs.
                Operator-cancelled jobs share the failed window because
                they're equivalent "did not succeed" terminal rows for
                review purposes.

    SystemCleanupRunAccepted:
      type: object
      required: [jobId, status, reused]
      properties:
        jobId:
          type: string
          nullable: true
          description: |
            ID of the `prune_jobs` row that will (or already does)
            handle this request. Null only in the rare race where the
            in-flight job completed between the two queries.
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
        reused:
          type: boolean
          description: |
            True when an existing in-flight prune job satisfied the
            request; false when a new job was enqueued.

    SyncResultResponse:
      type: object
      required: [recordsProcessed, recordsCreated, recordsUpdated, durationMs]
      properties:
        recordsProcessed: { type: integer }
        recordsCreated: { type: integer }
        recordsUpdated: { type: integer }
        recordsDeleted: { type: integer }
        cursor: { type: string, nullable: true }
        durationMs: { type: integer }

    StreamCsvResult:
      type: object
      required: [entity, rowsParsed, rowsInserted, durationMs]
      properties:
        entity:
          type: string
          enum:
            - suppliers
            - categories
            - items
            - purchase_orders
            - po_lines
            - invoices
            - payments
            - shipments
        rowsParsed: { type: integer }
        rowsInserted: { type: integer }
        durationMs: { type: integer }

    StreamCsvProgressEvent:
      type: object
      description: |
        Intermediate progress event emitted (throttled to ~4/sec) while the
        server is still parsing and inserting rows.

        `bytesProcessed` is the running count of bytes the server has read
        off the upload stream so far. Combined with the file's total size
        (known to the client), it lets the UI render a server-side progress
        bar and derive an ETA from the rows-per-second rate. It is optional
        because not every transport surfaces a meaningful byte count.
      required: [type, rowsParsed, rowsInserted]
      properties:
        type:
          type: string
          enum: [progress]
        rowsParsed: { type: integer }
        rowsInserted: { type: integer }
        bytesProcessed: { type: integer }

    StreamCsvResultEvent:
      type: object
      description: |
        Terminal success event emitted exactly once at the end of a
        successful stream. Carries the rolled-up counts.
      required: [type, entity, rowsParsed, rowsInserted, durationMs]
      properties:
        type:
          type: string
          enum: [result]
        entity:
          type: string
          enum:
            - suppliers
            - categories
            - items
            - purchase_orders
            - po_lines
            - invoices
            - payments
            - shipments
        rowsParsed: { type: integer }
        rowsInserted: { type: integer }
        durationMs: { type: integer }

    StreamCsvErrorEvent:
      type: object
      description: |
        Terminal failure event emitted exactly once when an error occurs
        after response headers have already been flushed (so the HTTP
        status cannot change). The HTTP status is still 200 in this case.
      required: [type, error]
      properties:
        type:
          type: string
          enum: [error]
        error:
          type: string

    StreamCsvCancelledEvent:
      type: object
      description: |
        Terminal cancellation event emitted exactly once when the client
        cancels the upload mid-flight (typically via `xhr.abort()`). The
        server detects the abort, stops flushing further batches to the
        database, and reports the partial counts that *did* commit.
        Distinct from `error` so clients can render a "Cancelled" state
        instead of a failure. The HTTP status remains 200.
      required: [type, entity, rowsParsed, rowsInserted]
      properties:
        type:
          type: string
          enum: [cancelled]
        entity:
          type: string
          enum:
            - suppliers
            - categories
            - items
            - purchase_orders
            - po_lines
            - invoices
            - payments
            - shipments
        rowsParsed: { type: integer }
        rowsInserted: { type: integer }

    StreamCsvEvent:
      description: |
        One NDJSON line emitted by `POST /ingest/csv-stream`.
        Use the `type` field to discriminate.
      oneOf:
        - $ref: "#/components/schemas/StreamCsvProgressEvent"
        - $ref: "#/components/schemas/StreamCsvResultEvent"
        - $ref: "#/components/schemas/StreamCsvErrorEvent"
        - $ref: "#/components/schemas/StreamCsvCancelledEvent"
      discriminator:
        propertyName: type
        mapping:
          progress: "#/components/schemas/StreamCsvProgressEvent"
          result: "#/components/schemas/StreamCsvResultEvent"
          error: "#/components/schemas/StreamCsvErrorEvent"
          cancelled: "#/components/schemas/StreamCsvCancelledEvent"

    CsvIngestRequest:
      type: object
      properties:
        suppliers:
          type: array
          items:
            type: object
            additionalProperties: true
        categories:
          type: array
          items:
            type: object
            additionalProperties: true
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        contracts:
          type: array
          items:
            type: object
            additionalProperties: true
        purchaseOrders:
          type: array
          items:
            type: object
            additionalProperties: true
        invoices:
          type: array
          items:
            type: object
            additionalProperties: true
        payments:
          type: array
          items:
            type: object
            additionalProperties: true
        shipments:
          type: array
          items:
            type: object
            additionalProperties: true

    MockErpIngestRequest:
      type: object
      required: [feed]
      properties:
        feed:
          type: array
          items:
            type: object
            required: [type, externalId, updatedAt, payload]
            properties:
              type:
                type: string
                enum: [supplier, purchase_order, invoice]
              externalId: { type: string }
              updatedAt: { type: string, format: date-time }
              payload:
                type: object
                additionalProperties: true
              deleted: { type: boolean }
        cursor: { type: string }

    BillingSummary:
      type: object
      required:
        [
          successFeePct,
          totalRealizedUsd,
          totalProjectedUsd,
          successFeeUsd,
          byLever,
        ]
      properties:
        successFeePct: { type: number }
        totalRealizedUsd: { type: number }
        totalProjectedUsd: { type: number }
        successFeeUsd: { type: number }
        byLever:
          type: array
          items:
            type: object
            required: [leverId, realizedUsd, opportunityCount]
            properties:
              leverId:
                $ref: "#/components/schemas/LeverId"
              realizedUsd: { type: number }
              projectedUsd: { type: number }
              opportunityCount: { type: integer }

    JobAccepted:
      type: object
      required: [jobId, status]
      properties:
        jobId: { type: string }
        status: { type: string, enum: [pending, running] }

    RegisterCollectorRequest:
      type: object
      required: [id, name, description, posture, owner, sourceUrl]
      properties:
        id: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        posture:
          type: string
          enum: [public-api, published-data, respect-robots-crawl, aggressive-crawl]
        owner: { type: string, minLength: 1, maxLength: 200 }
        sourceUrl: { type: string, format: uri }
        rateLimitRpm: { type: integer, minimum: 1, maximum: 10000 }
        scheduleCron: { type: string, nullable: true, maxLength: 120 }
        notes: { type: string, nullable: true, maxLength: 5000 }

    PatchCollectorRequest:
      type: object
      properties:
        status:
          type: string
          enum: [draft, approved, killed, rejected]
        rateLimitRpm: { type: integer, minimum: 1, maximum: 10000 }
        scheduleCron: { type: string, nullable: true, maxLength: 120 }

    CollectorMutationResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string }
        killSwitch: { type: boolean }
        rateLimitRpm: { type: integer }

    CollectorKillResult:
      type: object
      required: [id, killSwitch]
      properties:
        id: { type: string }
        killSwitch: { type: boolean }

    CollectorAuditEntry:
      type: object
      required: [id, collectorId, event, createdAt]
      properties:
        id: { type: string }
        collectorId: { type: string }
        event: { type: string }
        targetUrl: { type: string, nullable: true }
        statusCode: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    PatchCollectorPostureRequest:
      type: object
      properties:
        notes:
          type: string
          nullable: true
          maxLength: 5000
          description: |
            Free-form operator notes. Doubles as the ToS link snapshot
            store; the workbench renders the contract's static `tosUrl`
            unless `notes` contains a `tos:` line that overrides it.
        tenantOptedIn:
          type: boolean
          nullable: true
          description: |
            Per-tenant opt-in toggle for the active tenant. Setting
            null deletes the override and restores the default.

    BroadcastCollectorPostureRequest:
      type: object
      required: [tenantOptedIn]
      properties:
        tenantOptedIn:
          type: boolean
          nullable: true
          description: |
            Opt-in value to apply uniformly to every org for this
            collector. `null` deletes any per-tenant overrides and
            restores the default. `true`/`false` upserts an explicit
            override row per tenant.
        reason:
          type: string
          maxLength: 1000
          description: |
            Optional human-readable explanation captured in every
            audit row so reviewers can reconstruct the why later.

    BroadcastCollectorPostureResult:
      type: object
      required: [id, tenantsAffected, tenantOptedIn]
      properties:
        id: { type: string }
        tenantOptedIn:
          type: boolean
          nullable: true
        tenantsAffected:
          type: integer
          description: Number of orgs whose opt-in row was upserted/deleted.

    BroadcastCollectorPosturePreview:
      type: object
      required:
        [
          id,
          tenantsTotal,
          currentOptedIn,
          currentOptedOut,
          currentNoOverride,
          registryDefault,
        ]
      properties:
        id: { type: string }
        tenantsTotal:
          type: integer
          description: Total number of orgs the broadcast will iterate.
        currentOptedIn:
          type: integer
          description: Orgs that currently have an explicit opt-in row.
        currentOptedOut:
          type: integer
          description: Orgs that currently have an explicit opt-out row.
        currentNoOverride:
          type: integer
          description: |
            Orgs with no per-tenant override; they currently resolve to
            the registry default.
        registryDefault:
          type: boolean
          nullable: true
          description: |
            The collector's `tenantOptInDefault` from the registry; what
            orgs in `currentNoOverride` resolve to today.

    CollectorPostureResult:
      type: object
      required: [id, postureClass, disclosureTier, jurisdiction]
      properties:
        id: { type: string }
        notes: { type: string, nullable: true }
        postureClass:
          type: string
          enum: [public_api, tos_restricted, gray_hat]
        disclosureTier:
          type: string
          enum: [T1, T2, T3, T4]
        jurisdiction: { type: string }
        retentionDays: { type: integer, nullable: true }
        tenantOptInDefault: { type: boolean, nullable: true }
        tenantOptedIn: { type: boolean, nullable: true }

    CollectorCatalogEntry:
      type: object
      required:
        [
          id,
          name,
          description,
          status,
          posture,
          postureClass,
          disclosureTier,
          jurisdiction,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [enabled, disabled, killed]
        posture:
          type: string
          enum:
            [public-api, published-data, respect-robots-crawl, aggressive-crawl]
        postureClass:
          type: string
          enum: [public_api, tos_restricted, gray_hat]
        disclosureTier:
          type: string
          enum: [T1, T2, T3, T4]
        jurisdiction: { type: string }
        flagEmoji: { type: string }
        sourceUrl: { type: string, nullable: true }
        tosUrl: { type: string }
        licenseNote: { type: string }
        logoUrl: { type: string }
        cadenceLabel: { type: string }
        retentionDays: { type: integer, nullable: true }
        piiClassification:
          type: string
          enum: [none, low, medium, high]
        outputSignalTypes:
          type: array
          items: { type: string }
        scopeKinds:
          type: array
          items:
            type: string
            enum: [material, category, supplier, sku, lane]
        rateLimitRpm: { type: integer, nullable: true }
        scheduleCron: { type: string, nullable: true }
        tenantOptInDefault: { type: boolean, nullable: true }
        tenantOptedIn: { type: boolean, nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastSignalCount: { type: integer, nullable: true }

    CollectorSourceHealthEntry:
      type: object
      required: [collectorId, name, status, runs, failures, fetchErrors]
      properties:
        collectorId: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [enabled, disabled, killed]
        runs: { type: integer }
        failures: { type: integer }
        fetchErrors: { type: integer }
        schemaDriftEvents: { type: integer }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastFailureAt: { type: string, format: date-time, nullable: true }
        lastSchemaDriftAt: { type: string, format: date-time, nullable: true }
        lastNonEmptyRunAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Timestamp of the most recent successful run whose
            `metadata.inserted` was greater than zero. Null when no
            run in the lookback window landed any rows.
        staleEmptyRuns:
          type: boolean
          description: |
            True when the collector is still running (recent
            success_at) but has not produced any new rows for ≥ 48h.
            The Source Health tab surfaces this as a yellow chip so
            operators can investigate silent upstream stalls before
            they become outages.
        recentDrifts:
          type: array
          items:
            type: object
            required: [signalType, observedAt]
            properties:
              signalType: { type: string }
              observedAt: { type: string, format: date-time }
              addedKeysCount: { type: integer }
              removedKeysCount: { type: integer }
              changedKeys:
                type: array
                items: { type: string }
        healthScore:
          type: integer
          description: 0-100 (100 = clean, 0 = all runs failing).

    CollectorLineageGraph:
      type: object
      required: [collectors, bqTables, marts, consumers, edges]
      properties:
        collectors:
          type: array
          items:
            type: object
            required: [id, name, postureClass, disclosureTier]
            properties:
              id: { type: string }
              name: { type: string }
              postureClass:
                type: string
                enum: [public_api, tos_restricted, gray_hat]
              disclosureTier:
                type: string
                enum: [T1, T2, T3, T4]
        bqTables:
          type: array
          items: { type: string }
        marts:
          type: array
          items: { type: string }
        consumers:
          type: array
          items: { type: string }
        edges:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: string }
              to: { type: string }
              kind:
                type: string
                enum: [collector_to_table, table_to_mart, mart_to_consumer]

    CollectorCoverageMatrix:
      type: object
      required: [materials, jurisdictions, supplierCountryCounts, rows]
      properties:
        materials:
          type: array
          items:
            type: object
            required: [code]
            properties:
              code: { type: string }
              label: { type: string, nullable: true }
        jurisdictions:
          type: array
          items: { type: string }
        supplierCountryCounts:
          type: array
          items:
            type: object
            required: [countryCode, supplierCount]
            properties:
              countryCode: { type: string, nullable: true }
              supplierCount: { type: integer }
        rows:
          type: array
          description: |
            One row per material code. `coveredBy` is the list of
            collector IDs that have written at least one signal for
            that material in the lookback window.
          items:
            type: object
            required: [materialCode, signalCount, coveredBy]
            properties:
              materialCode: { type: string }
              signalCount: { type: integer }
              coveredBy:
                type: array
                items: { type: string }

    CollectorCostEntry:
      type: object
      required: [collectorId, name, runs, rowsWritten, estimateUsd]
      properties:
        collectorId: { type: string }
        name: { type: string }
        runs: { type: integer }
        rowsWritten: { type: integer }
        estimateUsd: { type: number }
        queryUsd:
          type: number
          nullable: true
          description: |
            BigQuery query/analysis cost in USD for the lookback window.
            Populated only when `source=billing`; null otherwise.
        storageUsd:
          type: number
          nullable: true
          description: |
            Cloud Storage cost in USD for the lookback window. Populated
            only when `source=billing`; null otherwise.
        notes: { type: string, nullable: true }

    ClientDataSource:
      type: object
      required:
        [id, name, jurisdiction, disclosureTier, cadenceLabel, licenseNote]
      properties:
        id: { type: string }
        name: { type: string }
        logoUrl: { type: string }
        jurisdiction: { type: string }
        flagEmoji: { type: string }
        disclosureTier:
          type: string
          enum: [T1, T2, T3, T4]
        cadenceLabel: { type: string }
        licenseNote: { type: string }
        tosUrl: { type: string }
        lastRefreshedAt: { type: string, format: date-time, nullable: true }

    ErpAdapterDescriptor:
      type: object
      required:
        [
          key,
          label,
          description,
          postureClass,
          disclosureTier,
          jurisdiction,
          retentionDays,
        ]
      properties:
        key: { type: string, enum: [coupa] }
        label: { type: string }
        description: { type: string }
        postureClass: { type: string }
        disclosureTier:
          type: string
          enum: [T1, T2, T3, T4]
        jurisdiction: { type: string }
        retentionDays: { type: integer }

    ErpAdapterListResponse:
      type: object
      required: [adapters]
      properties:
        adapters:
          type: array
          items: { $ref: "#/components/schemas/ErpAdapterDescriptor" }

    ErpConnection:
      type: object
      required:
        [
          id,
          orgId,
          label,
          adapterKey,
          status,
          settings,
          watermarks,
          credentialFields,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        orgId: { type: string }
        label: { type: string }
        adapterKey: { type: string, enum: [coupa] }
        status:
          type: string
          enum: [active, paused, error]
        settings:
          type: object
          additionalProperties: true
        watermarks:
          type: object
          additionalProperties: { type: string }
        credentialFields:
          type: array
          items: { type: string }
          description: |
            Names of the credential fields stored encrypted at rest. The
            values are never returned.
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ErpConnectionResponse:
      type: object
      required: [connection]
      properties:
        connection: { $ref: "#/components/schemas/ErpConnection" }

    ErpConnectionListResponse:
      type: object
      required: [connections]
      properties:
        connections:
          type: array
          items: { $ref: "#/components/schemas/ErpConnection" }

    CreateErpConnectionRequest:
      type: object
      required: [label, adapterKey, credentials]
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        adapterKey: { type: string, enum: [coupa] }
        credentials:
          type: object
          additionalProperties: true
          description: |
            Adapter-specific credentials. For Coupa: `clientId` and
            `clientSecret` (both required, non-empty strings).
        settings:
          type: object
          additionalProperties: true
          description: |
            Adapter-specific settings. For Coupa: `instanceUrl`
            (required, https URL), optional `pageSize` (1-1000,
            default 200), optional `scope` (defaults to all read
            scopes).

    UpdateErpConnectionRequest:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        status:
          type: string
          enum: [active, paused, error]
        credentials:
          type: object
          additionalProperties: true
        settings:
          type: object
          additionalProperties: true

    TestErpConnectionRequest:
      type: object
      required: [adapterKey, credentials]
      properties:
        adapterKey: { type: string, enum: [coupa] }
        credentials:
          type: object
          additionalProperties: true
        settings:
          type: object
          additionalProperties: true

    TestErpConnectionResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
        details: {}

    WatchedIssuerSource:
      type: string
      description: |
        Upstream feed for this watched-issuer row.
        - `sec_edgar`        — SEC EDGAR (US issuers, identifier = CIK)
        - `companies_house`  — UK Companies House (identifier = company number)
      enum: [sec_edgar, companies_house]

    WatchedIssuer:
      type: object
      required: [id, source, identifier, name, createdAt]
      properties:
        id: { type: string }
        source:
          $ref: "#/components/schemas/WatchedIssuerSource"
        identifier:
          type: string
          description: |
            Source-native identifier as stored after normalisation. SEC
            CIK is zero-padded to 10 digits; Companies House numbers are
            zero-padded to 8 chars with the prefix upper-cased.
        name: { type: string }
        lei: { type: string, nullable: true }
        ticker: { type: string, nullable: true }
        supplierUid:
          type: string
          nullable: true
          description: |
            Optional foreign key into the tenant's supplier master.
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, nullable: true }

    WatchedIssuerListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WatchedIssuer"

    AddWatchedIssuerRequest:
      type: object
      required: [source, identifier, name]
      properties:
        source:
          $ref: "#/components/schemas/WatchedIssuerSource"
        identifier:
          type: string
          minLength: 1
          maxLength: 40
          description: |
            Source-native identifier. The server normalises on the way in
            (SEC CIK zero-padded to 10 digits; Companies House numbers
            zero-padded to 8 chars).
        name:
          type: string
          minLength: 1
          maxLength: 200
        lei: { type: string, minLength: 1, maxLength: 40 }
        ticker: { type: string, minLength: 1, maxLength: 20 }
        supplierUid:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            Optional supplier ID to link this issuer to. Must belong to
            the active tenant; the server returns 400 otherwise.
        notes: { type: string, maxLength: 2000 }
