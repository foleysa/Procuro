          description: 'Propagation chain from the event down to tenant spend:

            event → site → supplier → contract → category → spend.

            Each step is a typed link the UI can render as a breadcrumb

            and use to deep-link into Entity 360. Exposure is the spend

            amount (USD, lookback window) attached to the leaf when known.

            '
          items:
            type: object
            required:
            - step
            - kind
            - label
            properties:
              step:
                type: string
                enum:
                - event
                - site
                - supplier
                - contract
                - category
                - spend
              kind:
                type: string
                description: 'Entity-360-compatible kind for this link, or `spend`

                  for the terminal node.

                  '
                enum:
                - event
                - site
                - supplier
                - contract
                - category
                - spend
              id:
                type: string
                nullable: true
              label:
                type: string
              exposureUsd:
                type: number
                nullable: true
    IntelligenceEventStreamResponse:
