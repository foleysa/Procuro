        entities:
          type: array
          description: 'Per-entity throughput rollups across the trend window,
            busiest pipeline first. Each entry has a `days` array of
            length `windowDays`, oldest → newest, suitable for direct
            sparkline rendering.

            '
          items:
            $ref: '#/components/schemas/CsvIngestEntityTrend'
    CsvIngestRecentRun:
