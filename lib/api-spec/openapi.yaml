openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    Procurement RaaS API.

    Multi-tenant: every request is scoped to the active org via the
    `x-org-id` header. The development server defaults to the seeded
    SCIS Procurement org if the header is absent, but production callers
    must supply it. All list endpoints return only rows owned by that org.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orgs
    description: Tenants the active user belongs to
  - name: spend
    description: Aggregated spend overview
  - name: suppliers
    description: Supplier directory
  - name: opportunities
    description: Procurement opportunities (Tier-1+ levers)
  - name: cycles
    description: OODA analysis cycles
  - name: collectors
    description: External-intelligence collector registry
  - name: market-signals
    description: External market signals
  - name: jobs
    description: Async job runner
  - name: ingest
    description: Ingestion endpoints (CSV / mock-ERP)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /orgs:
    get:
      operationId: listOrgs
      tags: [orgs]
      summary: List tenants available to the active user
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Org"

  /me:
    get:
      operationId: getMe
      tags: [orgs]
      summary: Active tenant context
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Current tenant + actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

  /spend/overview:
    get:
      operationId: getSpendOverview
      tags: [spend]
      summary: Spend overview (last 12 months)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Aggregated spend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendOverview"

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List suppliers
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Suppliers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierListResponse"

  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: List opportunities, optionally filtered
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: status
          schema:
            type: string
            enum:
              [proposed, approved, rejected, executing, realized, expired]
        - in: query
          name: leverId
          schema:
            $ref: "#/components/schemas/LeverId"
        - in: query
          name: cycleId
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityListResponse"

  /opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [opportunities]
      summary: Opportunity detail
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /opportunities/{id}/approve:
    post:
      operationId: approveOpportunity
      tags: [opportunities]
      summary: Approve a pending opportunity
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveOpportunityRequest"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /opportunities/{id}/reject:
    post:
      operationId: rejectOpportunity
      tags: [opportunities]
      summary: Reject a pending opportunity (with structured reason)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectOpportunityRequest"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /opportunities/{id}/execute:
    post:
      operationId: executeOpportunity
      tags: [opportunities]
      summary: Mark an approved opportunity as executing
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /opportunities/{id}/realize:
    post:
      operationId: realizeOpportunity
      tags: [opportunities]
      summary: Record realized savings on an executing opportunity
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealizeOpportunityRequest"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /cycles:
    get:
      operationId: listCycles
      tags: [cycles]
      summary: List OODA analysis cycles (newest first)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cycle"

  /cycles/{id}:
    get:
      operationId: getCycle
      tags: [cycles]
      summary: Cycle detail incl. observe/orient/decide/act/learn payloads
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Cycle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /cycles/run:
    post:
      operationId: runNextCycle
      tags: [cycles]
      summary: Trigger the next OODA cycle
      description: |
        Runs synchronously by default for the demo dataset. For F500-scale
        runs, pass `async=true` to enqueue the cycle on the background job
        queue and poll `/jobs/{id}` for progress and result.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: async
          required: false
          schema: { type: boolean, default: false }
          description: Enqueue as a background job and return a jobId.
      responses:
        "200":
          description: Synchronous cycle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCycleResponse"
        "202":
          description: Job enqueued for async execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"

  /priors:
    get:
      operationId: listLearnedPriors
      tags: [cycles]
      summary: Learned priors per lever for the active tenant
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Priors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearnedPrior"

  /collectors:
    get:
      operationId: listCollectors
      tags: [collectors]
      summary: List registered intelligence collectors
      responses:
        "200":
          description: Collectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collector"
    post:
      operationId: registerCollector
      tags: [collectors]
      summary: Register a new collector (or upsert an existing one)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCollectorRequest"
      responses:
        "201":
          description: Collector registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorMutationResult"

  /collectors/{id}:
    patch:
      operationId: patchCollector
      tags: [collectors]
      summary: Approve, disable, or rate-limit a collector
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCollectorRequest"
      responses:
        "200":
          description: Updated collector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorMutationResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /collectors/{id}/kill:
    post:
      operationId: killCollector
      tags: [collectors]
      summary: Activate the kill switch for a collector
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Killed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorKillResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /collectors/{id}/unkill:
    post:
      operationId: unkillCollector
      tags: [collectors]
      summary: Release the kill switch for a collector
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Unkilled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorKillResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /collectors/{id}/audit:
    get:
      operationId: listCollectorAudit
      tags: [collectors]
      summary: Audit log for a collector (most-recent first, capped at 100)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectorAuditEntry"

  /collectors/{id}/run:
    post:
      operationId: runCollector
      tags: [collectors]
      summary: Run a collector once for the active tenant
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Collector run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorRunResult"

  /collectors/ecb-fx-rates/backfill:
    post:
      operationId: backfillEcbFxRates
      tags: [collectors]
      summary: |
        Backfill historical ECB FX reference rates (one-shot, idempotent).
      description: |
        Fetches the ECB historical archive (`eurofxref-hist.xml`, ~5 years
        back) and writes one `fx_rate` MarketSignal per (day × tracked
        currency × EUR/USD base). Re-running is safe: rows that already
        exist for the same `(scope_material_code, observed_at)` are skipped.
      responses:
        "200":
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorBackfillResult"
        "409":
          description: Collector is killed or not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /collectors/fred-economic-index/backfill:
    post:
      operationId: backfillFredEconomicIndex
      tags: [collectors]
      summary: |
        Backfill historical FRED PPI economic-index observations
        (one-shot, idempotent).
      description: |
        Walks every series in the curated FRED PPI list, fetches the last
        ~5 years of observations from the FRED API, and writes one
        `economic_index` MarketSignal per (series × observed_at).
        Re-running is safe: rows that already exist for the same
        `(signal_type, scope_*, observed_at)` are skipped. The regular
        daily collector cron is unaffected — it still fetches latest only.
      responses:
        "200":
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorBackfillResult"
        "409":
          description: |
            Collector is killed, not approved, or the `FRED_API_KEY` env
            var is not set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market-signals:
    get:
      operationId: listMarketSignals
      tags: [market-signals]
      summary: Recent market signals
      description: |
        Returns market signals scoped to the active tenant plus any
        platform-wide (orgId IS NULL) signals. Supports filtering by signal
        type and scope so callers can pull a focused time-series — e.g.
        `signalType=fx_rate&scopeMaterialCode=EUR/USD` for an FX trend chart.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000, default: 50 }
        - in: query
          name: signalType
          description: |
            Filter by signal type (e.g. `fx_rate`, `commodity_index`,
            `economic_index`).
          schema: { type: string }
        - in: query
          name: scopeMaterialCode
          description: |
            Filter by scope material code. For FX rates this is the currency
            pair (e.g. `EUR/USD`, `USD/JPY`).
          schema: { type: string }
        - in: query
          name: observedAfter
          description: |
            Lower bound (inclusive) on `observedAt`. ISO-8601 datetime.
          schema: { type: string, format: date-time }
        - in: query
          name: observedBefore
          description: |
            Upper bound (inclusive) on `observedAt`. ISO-8601 datetime.
          schema: { type: string, format: date-time }
        - in: query
          name: order
          description: |
            Sort direction on `observedAt`. Defaults to `desc` so callers
            that just want "latest 50" keep working unchanged. Use `asc`
            when fetching a chart-friendly time-series.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketSignal"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List background jobs for the active tenant
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: status
          schema: { type: string, enum: [pending, running, succeeded, failed] }
        - in: query
          name: kind
          schema: { type: string }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /jobs/settings:
    get:
      operationId: listJobKindSettings
      tags: [jobs]
      summary: List effective per-kind retry budgets
      description: |
        Returns one row per configurable job kind. `maxAttempts` is the
        effective retry budget (operator override if present, otherwise the
        in-code default). `isOverride` is `true` when the value comes from
        the `job_kind_settings` table, `false` when it falls back to the
        default. The pruner is intentionally excluded — it has no upstream
        API calls and does not benefit from operator tuning.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Per-kind retry-budget settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobKindSetting"

  /jobs/settings/{kind}:
    put:
      operationId: updateJobKindSetting
      tags: [jobs]
      summary: Override the auto-retry budget for a single job kind
      description: |
        Upserts an operator override into `job_kind_settings`. Takes effect
        on the next `enqueueJob` call; in-flight jobs keep the
        `max_attempts` value they were enqueued with so a mid-flight tweak
        does not change the budget of a job that is already retrying.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [ingest_csv, ingest_mock_erp, run_analysis_cycle, run_collector]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobKindSettingRequest"
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobKindSetting"
        "400":
          description: Invalid kind or maxAttempts value

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get an async job's status + result
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}/retry:
    post:
      operationId: retryJob
      tags: [jobs]
      summary: Re-enqueue a failed job as a new pending job
      description: |
        Enqueues a fresh job of the same kind and payload as the original.
        Only jobs in the `failed` state may be retried.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "202":
          description: Retry job enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "404":
          description: Job not found
        "409":
          description: Job is not in a retryable state

  /jobs/{id}/cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a pending or running job
      description: |
        Cancels a job that is still `pending` or `running`.

        - `pending` jobs are immediately marked `failed` with the error
          "Cancelled by operator".
        - `running` jobs have a cancellation flag set; the worker rewrites
          the terminal state to `failed` once the handler returns at its
          next safe checkpoint.

        Already-terminal jobs (`succeeded` / `failed`) return 409.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCancelled"
        "404":
          description: Job not found
        "409":
          description: Job is already in a terminal state

  /ingest/csv:
    post:
      operationId: ingestCsvBatch
      tags: [ingest]
      summary: Run the CSV adapter against an inline payload
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: async
          required: false
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvIngestRequest"
      responses:
        "200":
          description: Synchronous sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResultResponse"
        "202":
          description: Job enqueued for async execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"

  /ingest/csv-stream:
    post:
      operationId: ingestCsvStream
      tags: [ingest]
      summary: Stream a single-entity CSV file (bounded-memory ingest)
      description: |
        Streams a single-entity CSV file directly into the database without
        buffering it in memory. Use for very large files (millions of rows)
        that cannot fit in a JSON request body. Memory stays bounded
        regardless of file size.

        The endpoint accepts either:
          * `multipart/form-data` with a single file part named `file`
            (preferred — what the generated client and browser uploads use), or
          * `text/csv` raw body (convenient for `curl --data-binary` and back-compat).

        Hard limit: 1 GB per upload.

        **Response is NDJSON streamed live as the server processes the
        upload.** Once pre-flight validation passes (entity name, declared
        Content-Length under 1 GB), the response Content-Type switches to
        `application/x-ndjson` and the server writes one JSON object per
        line, terminated by `\n`:

          * `{"type":"progress","rowsParsed":N,"rowsInserted":M,"bytesProcessed":B}` —
            emitted after batch flushes, throttled to ~4/sec server-side so
            multi-million-row files don't flood the wire. `bytesProcessed`
            is optional and reports how many request-body bytes the server
            has consumed so far; the client uses it (plus the file size) to
            render a server-side progress bar and a rows/sec ETA.
          * `{"type":"result","entity":"...","rowsParsed":N,"rowsInserted":M,"durationMs":D}` —
            exactly one terminal success event whose payload matches
            `StreamCsvResult`.
          * `{"type":"error","error":"..."}` — exactly one terminal failure
            event for errors that occurred mid-stream after headers were
            sent. (Pre-flight failures still surface as conventional 4xx
            JSON responses with an `error` body.)

        Clients should read the response body incrementally (browser XHR
        `onprogress` + `responseText`, or fetch `body.getReader()`),
        split on `\n`, and parse each non-empty line as JSON. The same
        approach used by the Data Ingest page's `uploadCsvStream` helper
        works in any modern browser without extra dependencies.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: entity
          required: true
          description: Which entity the CSV rows describe.
          schema:
            type: string
            enum:
              - suppliers
              - categories
              - items
              - purchase_orders
              - po_lines
              - invoices
              - payments
              - shipments
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The CSV file to stream-ingest.
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: |
            NDJSON stream. Each line is a JSON object whose `type` field
            discriminates between `progress` (zero or more, throttled),
            `result` (exactly one, terminal success), or `error` (exactly
            one, terminal mid-stream failure).
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/StreamCsvEvent"
        "400":
          description: Invalid entity name (pre-flight rejection, JSON body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: |
            Pre-flight rejection: declared Content-Length exceeds the 1 GB
            per-request size limit. Mid-stream limit hits surface as an
            in-stream `{"type":"error",...}` NDJSON event on a 200 response
            instead, since the response headers have already been sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/mock-erp:
    post:
      operationId: ingestMockErp
      tags: [ingest]
      summary: Run the Mock ERP adapter (proves the abstraction)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: async
          required: false
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockErpIngestRequest"
      responses:
        "200":
          description: Synchronous sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResultResponse"
        "202":
          description: Job enqueued for async execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"

  /billing/summary:
    get:
      operationId: getBillingSummary
      tags: [opportunities]
      summary: Realized savings + success-fee summary
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Billing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSummary"

components:
  parameters:
    OrgIdHeader:
      in: header
      name: x-org-id
      required: false
      schema: { type: string }
      description: |
        Tenant ID hint. In production, requests MUST present
        `Authorization: Bearer <token>` and `x-org-id` (if supplied) must
        match the org bound to that token. In development, this header is
        accepted standalone.
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: string }

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Per-tenant API token. The plaintext token is sha256-hashed server-side
        and matched against `org_api_tokens.token_hash` to derive the active
        tenant scope. Required in production; optional in development.

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        details: {}

    Org:
      type: object
      required: [id, slug, name, createdAt, disclosurePolicy]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        successFeePct:
          type: number
          description: Default contingency fee on realized savings
        disclosurePolicy:
          $ref: "#/components/schemas/DisclosurePolicy"
        createdAt: { type: string, format: date-time }

    DisclosurePolicy:
      type: string
      description: |
        Per-tenant insight-citation disclosure policy. Controls which
        intelligence-source tiers are surfaced when rendering an insight
        via the disclosure-tier renderer. `conservative` only shows T1+T2
        attributions, `standard` adds T3 (class label + confidence) and
        `analyst` shows full provenance for every tier including T4.
      enum: [conservative, standard, analyst]

    MeResponse:
      type: object
      required: [org]
      properties:
        org:
          $ref: "#/components/schemas/Org"
        actorEmail: { type: string }

    LeverId:
      type: string
      enum:
        - sku_price_benchmark
        - maverick_spend
        - contract_leakage
        - duplicate_payment
        - missed_volume_threshold
        - payment_term_extension
        - tail_spend_rationalization
        - supplier_consolidation
        - contract_renegotiation_trigger
        - supplier_fx_exposure

    RejectionReasonCode:
      type: string
      enum:
        - supplier_strategic_do_not_consolidate
        - supplier_dei_or_diverse_program
        - compliance_or_legal_block
        - quality_risk_too_high
        - timing_blocked_by_business
        - savings_overstated
        - already_actioned
        - other

    SpendOverview:
      type: object
      required:
        [
          totalSpendUsd,
          byClass,
          byCategory,
          bySupplier,
          byBusinessUnit,
          concentration,
        ]
      properties:
        totalSpendUsd: { type: number }
        byClass:
          type: array
          items:
            type: object
            required: [spendClass, spendUsd]
            properties:
              spendClass: { type: string }
              spendUsd: { type: number }
        byCategory:
          type: array
          items:
            type: object
            required: [categoryId, categoryName, categoryClass, spendUsd]
            properties:
              categoryId: { type: string }
              categoryName: { type: string }
              categoryClass: { type: string }
              spendUsd: { type: number }
        bySupplier:
          type: array
          items:
            type: object
            required: [supplierId, supplierName, spendUsd, poCount]
            properties:
              supplierId: { type: string }
              supplierName: { type: string }
              spendUsd: { type: number }
              poCount: { type: number }
        byBusinessUnit:
          type: array
          items:
            type: object
            required: [businessUnit, spendUsd]
            properties:
              businessUnit: { type: string }
              spendUsd: { type: number }
        concentration:
          type: object
          required:
            [
              top10SupplierShare,
              activeSupplierCount,
              tailSupplierCount,
              tailSpendUsd,
            ]
          properties:
            top10SupplierShare: { type: number }
            activeSupplierCount: { type: number }
            tailSupplierCount: { type: number }
            tailSpendUsd: { type: number }

    Supplier:
      type: object
      required: [id, name, isStrategic, isPreferred]
      properties:
        id: { type: string }
        name: { type: string }
        countryCode: { type: string, nullable: true }
        paymentTermsDays: { type: string, nullable: true }
        isStrategic: { type: boolean }
        isPreferred: { type: boolean }
        tags:
          type: array
          items: { type: string }

    SupplierListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Supplier"
        nextCursor:
          type: string
          nullable: true

    Opportunity:
      type: object
      required:
        [
          id,
          orgId,
          cycleId,
          leverId,
          tier,
          status,
          title,
          rationale,
          recommendedAction,
          rawProjectedSavingsUsd,
          projectedSavingsUsd,
          confidence,
          createdAt,
        ]
      properties:
        id: { type: string }
        orgId: { type: string }
        cycleId: { type: string }
        leverId:
          $ref: "#/components/schemas/LeverId"
        tier: { type: integer }
        status:
          type: string
          enum:
            [proposed, approved, rejected, executing, realized, expired]
        title: { type: string }
        rationale: { type: string }
        recommendedAction: { type: string }
        supplierId: { type: string, nullable: true }
        supplierName: { type: string, nullable: true }
        categoryId: { type: string, nullable: true }
        categoryName: { type: string, nullable: true }
        rawProjectedSavingsUsd: { type: number }
        projectedSavingsUsd: { type: number }
        confidence: { type: number }
        realizedSavingsUsd: { type: number, nullable: true }
        rejectedReasonCode:
          allOf:
            - $ref: "#/components/schemas/RejectionReasonCode"
          nullable: true
        rejectedReasonText: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        rejectedAt: { type: string, format: date-time, nullable: true }
        executingAt: { type: string, format: date-time, nullable: true }
        realizedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    OpportunityDetail:
      allOf:
        - $ref: "#/components/schemas/Opportunity"
        - type: object
          required: [sources]
          properties:
            inputs:
              type: object
              additionalProperties: true
            sources:
              type: array
              description: |
                Raw signal-source descriptors that backed this opportunity.
                The Command Center calls `renderInsight()` from
                `@workspace/intelligence/tier` on these and the active
                tenant's `disclosurePolicy` to derive a tier-appropriate
                citation list for display.
              items:
                $ref: "#/components/schemas/InsightSource"
            decisions:
              type: array
              items:
                $ref: "#/components/schemas/Decision"

    InsightSource:
      type: object
      description: |
        A single signal-source descriptor backing an insight. Mirrors the
        `SignalSource` shape consumed by the disclosure-tier renderer in
        `@workspace/intelligence/tier`. The `contract` block carries the
        collector's posture + disclosure metadata so the renderer can
        decide what (if anything) to surface to the user.
      required: [collectorId, collectorName, sourceUrl, observedAt, contract]
      properties:
        collectorId: { type: string }
        collectorName: { type: string }
        sourceUrl: { type: string }
        observedAt: { type: string, format: date-time }
        contract:
          type: object
          required:
            [
              postureClass,
              disclosureTier,
              jurisdiction,
              retentionDays,
              tenantOptInDefault,
            ]
          properties:
            postureClass:
              type: string
              enum: [public_api, tos_restricted, gray_hat]
            disclosureTier:
              type: string
              enum: [T1, T2, T3, T4]
            jurisdiction: { type: string }
            retentionDays: { type: integer }
            tenantOptInDefault: { type: boolean }

    OpportunityListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Opportunity"
        nextCursor:
          type: string
          nullable: true

    Decision:
      type: object
      required: [id, opportunityId, eventType, actorEmail, createdAt]
      properties:
        id: { type: string }
        opportunityId: { type: string }
        eventType:
          type: string
          enum: [approve, reject, execute, realize]
        actorEmail: { type: string }
        rejectedReasonCode:
          allOf:
            - $ref: "#/components/schemas/RejectionReasonCode"
          nullable: true
        rejectedReasonText: { type: string, nullable: true }
        realizedSavingsUsd: { type: number, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ApproveOpportunityRequest:
      type: object
      properties:
        notes: { type: string }

    RejectOpportunityRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          $ref: "#/components/schemas/RejectionReasonCode"
        reasonText: { type: string }

    RealizeOpportunityRequest:
      type: object
      required: [realizedSavingsUsd]
      properties:
        realizedSavingsUsd: { type: number }
        notes: { type: string }

    Cycle:
      type: object
      required:
        [
          id,
          orgId,
          generation,
          status,
          opportunitiesCreated,
          totalProjectedUsd,
          startedAt,
        ]
      properties:
        id: { type: string }
        orgId: { type: string }
        generation: { type: integer }
        status:
          type: string
          enum: [running, completed, failed]
        triggeredBy: { type: string }
        opportunitiesCreated: { type: integer }
        totalProjectedUsd: { type: number }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    CycleDetail:
      allOf:
        - $ref: "#/components/schemas/Cycle"
        - type: object
          required: [sources]
          properties:
            observePayload: { type: object, additionalProperties: true }
            orientPayload: { type: object, additionalProperties: true }
            decidePayload: { type: object, additionalProperties: true }
            actPayload: { type: object, additionalProperties: true }
            learnPayload: { type: object, additionalProperties: true }
            sources:
              type: array
              description: |
                De-duplicated union of every signal source backing the
                opportunities created in this cycle. The Command Center
                renders these through `renderInsight()` from
                `@workspace/intelligence/tier` to produce a cycle-level
                citation block respecting the tenant's `disclosurePolicy`.
              items:
                $ref: "#/components/schemas/InsightSource"

    RunCycleResponse:
      type: object
      required:
        [cycleId, generation, opportunitiesCreated, totalProjectedUsd]
      properties:
        cycleId: { type: string }
        generation: { type: integer }
        opportunitiesCreated: { type: integer }
        totalProjectedUsd: { type: number }
        priorDeltas:
          type: array
          items:
            $ref: "#/components/schemas/PriorDelta"

    LearnedPrior:
      type: object
      required:
        [
          leverId,
          projectionMultiplier,
          confidenceWeight,
          evidenceCount,
          approvalCount,
          rejectionCount,
          realizationCount,
        ]
      properties:
        leverId:
          $ref: "#/components/schemas/LeverId"
        projectionMultiplier: { type: number }
        confidenceWeight: { type: number }
        evidenceCount: { type: integer }
        approvalCount: { type: integer }
        rejectionCount: { type: integer }
        realizationCount: { type: integer }
        updatedAtCycle: { type: integer, nullable: true }

    PriorDelta:
      type: object
      required:
        [
          leverId,
          prevProjectionMultiplier,
          newProjectionMultiplier,
          prevConfidenceWeight,
          newConfidenceWeight,
          rationale,
        ]
      properties:
        leverId:
          $ref: "#/components/schemas/LeverId"
        prevProjectionMultiplier: { type: number }
        newProjectionMultiplier: { type: number }
        prevConfidenceWeight: { type: number }
        newConfidenceWeight: { type: number }
        approvals: { type: integer }
        rejections: { type: integer }
        realizations: { type: integer }
        rationale: { type: string }

    Collector:
      type: object
      required: [id, name, posture, status]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        posture:
          type: string
          enum:
            [public-api, published-data, respect-robots-crawl, aggressive-crawl]
        status:
          type: string
          enum: [enabled, disabled, killed]
        sourceUrl: { type: string, nullable: true }
        defaultRateLimitRpm: { type: integer, nullable: true }
        defaultScheduleCron: { type: string, nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastSignalCount: { type: integer, nullable: true }

    CollectorRunResult:
      type: object
      required: [collectorId, signalsWritten, durationMs]
      properties:
        collectorId: { type: string }
        signalsWritten: { type: integer }
        durationMs: { type: integer }
        skipped: { type: boolean }
        skipReason: { type: string }

    CollectorBackfillResult:
      type: object
      required:
        - collectorId
        - daysWritten
        - signalsInserted
        - signalsSkipped
        - durationMs
      properties:
        collectorId: { type: string }
        daysWritten:
          type: integer
          description: Distinct calendar days covered by the backfill.
        signalsInserted:
          type: integer
          description: New `market_signals` rows written by this run.
        signalsSkipped:
          type: integer
          description: |
            Drafts that matched an existing
            `(scope_material_code, observed_at)` row and were not re-inserted.
        durationMs: { type: integer }

    MarketSignal:
      type: object
      required: [id, signalType, value, observedAt, createdAt]
      properties:
        id: { type: string }
        collectorId: { type: string, nullable: true }
        signalType: { type: string }
        scopeMaterialCode: { type: string, nullable: true }
        scopeCategoryId: { type: string, nullable: true }
        scopeSupplierId: { type: string, nullable: true }
        value: { type: number }
        unit: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        observedAt: { type: string, format: date-time }
        sourceUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Job:
      type: object
      required: [id, kind, status, attempts, maxAttempts, enqueuedAt]
      properties:
        id: { type: string }
        orgId: { type: string, nullable: true }
        kind: { type: string }
        status:
          type: string
          enum: [pending, running, succeeded, failed]
        attempts: { type: integer }
        maxAttempts:
          type: integer
          description: |
            Total automatic-attempt budget (initial run + auto-retries).
            When `attempts` reaches this value the worker stops retrying
            and marks the job `failed`.
        progress: { type: integer }
        result: { type: object, additionalProperties: true, nullable: true }
        error: { type: string, nullable: true }
        cancelRequested:
          type: boolean
          description: |
            True once an operator has requested cancellation. For `running`
            jobs the worker will rewrite the terminal state to `failed`
            with error "Cancelled by operator" once the handler returns.
        enqueuedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        scheduledFor:
          type: string
          format: date-time
          nullable: true
          description: |
            Earliest time the worker is allowed to claim this job again.
            Set to a future timestamp while a job is in retry-backoff
            after a transient failure; `null` means the job is ready to
            run immediately (the common case).

    JobKindSetting:
      type: object
      required: [kind, maxAttempts, defaultMaxAttempts, isOverride]
      properties:
        kind:
          type: string
          enum: [ingest_csv, ingest_mock_erp, run_analysis_cycle, run_collector]
        maxAttempts:
          type: integer
          minimum: 1
          description: |
            Effective auto-retry budget for this kind: operator override if
            one is set, otherwise the in-code default.
        defaultMaxAttempts:
          type: integer
          minimum: 1
          description: |
            The in-code default for this kind. Shown in the UI so operators
            can see what value the system would fall back to if the
            override were removed.
        isOverride:
          type: boolean
          description: |
            True when `maxAttempts` comes from the `job_kind_settings`
            table; false when it falls back to `defaultMaxAttempts`.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the override was last written. Null when there is no override.

    UpdateJobKindSettingRequest:
      type: object
      required: [maxAttempts]
      properties:
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 100

    JobCancelled:
      type: object
      required: [jobId, status, cancelRequested, cancelledImmediately]
      properties:
        jobId: { type: string }
        status:
          type: string
          enum: [running, failed]
          description: |
            `failed` when the job was `pending` and was transitioned
            immediately, `running` when the cancel flag was set on a
            running job (the worker will mark it failed when the
            handler returns).
        cancelRequested:
          type: boolean
          description: Always true on a successful response.
        cancelledImmediately:
          type: boolean
          description: |
            True if the job was pending and is now marked failed; false
            if the job was running and the cancel flag was set.

    SyncResultResponse:
      type: object
      required: [recordsProcessed, recordsCreated, recordsUpdated, durationMs]
      properties:
        recordsProcessed: { type: integer }
        recordsCreated: { type: integer }
        recordsUpdated: { type: integer }
        recordsDeleted: { type: integer }
        cursor: { type: string, nullable: true }
        durationMs: { type: integer }

    StreamCsvResult:
      type: object
      required: [entity, rowsParsed, rowsInserted, durationMs]
      properties:
        entity:
          type: string
          enum:
            - suppliers
            - categories
            - items
            - purchase_orders
            - po_lines
            - invoices
            - payments
            - shipments
        rowsParsed: { type: integer }
        rowsInserted: { type: integer }
        durationMs: { type: integer }

    StreamCsvProgressEvent:
      type: object
      description: |
        Intermediate progress event emitted (throttled to ~4/sec) while the
        server is still parsing and inserting rows.

        `bytesProcessed` is the running count of bytes the server has read
        off the upload stream so far. Combined with the file's total size
        (known to the client), it lets the UI render a server-side progress
        bar and derive an ETA from the rows-per-second rate. It is optional
        because not every transport surfaces a meaningful byte count.
      required: [type, rowsParsed, rowsInserted]
      properties:
        type:
          type: string
          enum: [progress]
        rowsParsed: { type: integer }
        rowsInserted: { type: integer }
        bytesProcessed: { type: integer }

    StreamCsvResultEvent:
      type: object
      description: |
        Terminal success event emitted exactly once at the end of a
        successful stream. Carries the rolled-up counts.
      required: [type, entity, rowsParsed, rowsInserted, durationMs]
      properties:
        type:
          type: string
          enum: [result]
        entity:
          type: string
          enum:
            - suppliers
            - categories
            - items
            - purchase_orders
            - po_lines
            - invoices
            - payments
            - shipments
        rowsParsed: { type: integer }
        rowsInserted: { type: integer }
        durationMs: { type: integer }

    StreamCsvErrorEvent:
      type: object
      description: |
        Terminal failure event emitted exactly once when an error occurs
        after response headers have already been flushed (so the HTTP
        status cannot change). The HTTP status is still 200 in this case.
      required: [type, error]
      properties:
        type:
          type: string
          enum: [error]
        error:
          type: string

    StreamCsvCancelledEvent:
      type: object
      description: |
        Terminal cancellation event emitted exactly once when the client
        cancels the upload mid-flight (typically via `xhr.abort()`). The
        server detects the abort, stops flushing further batches to the
        database, and reports the partial counts that *did* commit.
        Distinct from `error` so clients can render a "Cancelled" state
        instead of a failure. The HTTP status remains 200.
      required: [type, entity, rowsParsed, rowsInserted]
      properties:
        type:
          type: string
          enum: [cancelled]
        entity:
          type: string
          enum:
            - suppliers
            - categories
            - items
            - purchase_orders
            - po_lines
            - invoices
            - payments
            - shipments
        rowsParsed: { type: integer }
        rowsInserted: { type: integer }

    StreamCsvEvent:
      description: |
        One NDJSON line emitted by `POST /ingest/csv-stream`.
        Use the `type` field to discriminate.
      oneOf:
        - $ref: "#/components/schemas/StreamCsvProgressEvent"
        - $ref: "#/components/schemas/StreamCsvResultEvent"
        - $ref: "#/components/schemas/StreamCsvErrorEvent"
        - $ref: "#/components/schemas/StreamCsvCancelledEvent"
      discriminator:
        propertyName: type
        mapping:
          progress: "#/components/schemas/StreamCsvProgressEvent"
          result: "#/components/schemas/StreamCsvResultEvent"
          error: "#/components/schemas/StreamCsvErrorEvent"
          cancelled: "#/components/schemas/StreamCsvCancelledEvent"

    CsvIngestRequest:
      type: object
      properties:
        suppliers:
          type: array
          items:
            type: object
            additionalProperties: true
        categories:
          type: array
          items:
            type: object
            additionalProperties: true
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        contracts:
          type: array
          items:
            type: object
            additionalProperties: true
        purchaseOrders:
          type: array
          items:
            type: object
            additionalProperties: true
        invoices:
          type: array
          items:
            type: object
            additionalProperties: true
        payments:
          type: array
          items:
            type: object
            additionalProperties: true
        shipments:
          type: array
          items:
            type: object
            additionalProperties: true

    MockErpIngestRequest:
      type: object
      required: [feed]
      properties:
        feed:
          type: array
          items:
            type: object
            required: [type, externalId, updatedAt, payload]
            properties:
              type:
                type: string
                enum: [supplier, purchase_order, invoice]
              externalId: { type: string }
              updatedAt: { type: string, format: date-time }
              payload:
                type: object
                additionalProperties: true
              deleted: { type: boolean }
        cursor: { type: string }

    BillingSummary:
      type: object
      required:
        [
          successFeePct,
          totalRealizedUsd,
          totalProjectedUsd,
          successFeeUsd,
          byLever,
        ]
      properties:
        successFeePct: { type: number }
        totalRealizedUsd: { type: number }
        totalProjectedUsd: { type: number }
        successFeeUsd: { type: number }
        byLever:
          type: array
          items:
            type: object
            required: [leverId, realizedUsd, opportunityCount]
            properties:
              leverId:
                $ref: "#/components/schemas/LeverId"
              realizedUsd: { type: number }
              projectedUsd: { type: number }
              opportunityCount: { type: integer }

    JobAccepted:
      type: object
      required: [jobId, status]
      properties:
        jobId: { type: string }
        status: { type: string, enum: [pending, running] }

    RegisterCollectorRequest:
      type: object
      required: [id, name, description, posture, owner, sourceUrl]
      properties:
        id: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        posture:
          type: string
          enum: [public-api, published-data, respect-robots-crawl, aggressive-crawl]
        owner: { type: string, minLength: 1, maxLength: 200 }
        sourceUrl: { type: string, format: uri }
        rateLimitRpm: { type: integer, minimum: 1, maximum: 10000 }
        scheduleCron: { type: string, nullable: true, maxLength: 120 }
