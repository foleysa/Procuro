    ErpConnection:
      type: object
      required:
      - id
      - orgId
      - label
      - adapterKey
      - status
      - settings
      - watermarks
      - credentialFields
      - syncIntervalMinutes
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        orgId:
          type: string
        label:
          type: string
        adapterKey:
          type: string
          enum:
          - coupa
          - netsuite
          - ariba
        status:
          type: string
          enum:
          - active
          - paused
          - error
        settings:
          type: object
          additionalProperties: true
        watermarks:
          type: object
          additionalProperties:
            type: string
        credentialFields:
          type: array
          items:
            type: string
          description: 'Names of the credential fields stored encrypted at rest. The

            values are never returned.

            '
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        syncIntervalMinutes:
          type: integer
          minimum: 5
          maximum: 10080
          description: 'How often the recurring sync scheduler enqueues a job for
            this connection, in minutes. Defaults to 120 (every 2 hours). Pausing
            the connection halts scheduling regardless of the cadence.

            '
        nextScheduledSyncAt:
          type: string
          format: date-time
          nullable: true
          description: 'Earliest wall-clock time at which the recurring scheduler
            will enqueue the next sync. NULL when the connection has never been
            scheduled. Bumped each time the scheduler enqueues, the cadence
            changes, or the connection resumes from paused.

            '
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErpConnectionResponse:
      type: object
      required:
      - connection
      properties:
        connection:
          $ref: '#/components/schemas/ErpConnection'
    ErpConnectionRun:
      type: object
      required:
      - id
      - connectionId
      - status
      - startedAt
      - finishedAt
      - durationMs
      - recordsByEntity
      - pagesByEntity
      - droppedByEntity
      - recordsProcessed
      - recordsSkipped
      - createdAt
      properties:
        id:
          type: string
        connectionId:
          type: string
        jobId:
          type: string
          nullable: true
          description: 'The `jobs.id` that produced this run, if the job row
            still exists. Null after the row has been pruned by the
            jobs housekeeping sweep.

            '
        status:
          type: string
          enum:
          - succeeded
          - failed
          - skipped
          description: '`skipped` is recorded when the worker picked the
            job up but the connection was paused at run time (no
            upstream call was made).

            '
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          description: Wall-clock duration (`finishedAt − startedAt`).
        recordsByEntity:
          type: object
          additionalProperties:
            type: integer
          description: 'Per-entity rows ingested. Keys match the connector''s
            `ErpEntity` enum (`suppliers`, `contracts`, `purchase_orders`,
            `invoices`, `payments`).

            '
        pagesByEntity:
          type: object
          additionalProperties:
            type: integer
          description: Per-entity upstream pages fetched in this run.
        droppedByEntity:
          type: object
          additionalProperties:
            type: integer
          description: 'Per-entity rows the writer intentionally dropped
            (e.g. orphan SOWs without a parent contract). Aggregated
            from the writer warnings so the UI can show "X rows
            dropped" without re-parsing the full warnings array.

            '
        recordsProcessed:
          type: integer
          description: Total rows the writer reported as successfully processed.
        recordsSkipped:
          type: integer
          description: Total rows the writer reported as intentionally skipped.
        error:
          type: string
          nullable: true
          description: Truncated failure message; null on success / skip.
        createdAt:
          type: string
          format: date-time
    ErpConnectionRunListResponse:
      type: object
      required:
