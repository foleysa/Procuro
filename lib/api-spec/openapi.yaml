          - analyst
    IntelligenceEvent:
      type: object
      required:
      - id
      - signalType
      - observedAt
      - tier
      - source
      properties:
        id:
          type: string
        signalType:
          type: string
        observedAt:
          type: string
          format: date-time
        title:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        severity:
          type: number
          nullable: true
        actor:
          type: string
          nullable: true
        eventCode:
          type: string
          nullable: true
        tier:
          type: string
