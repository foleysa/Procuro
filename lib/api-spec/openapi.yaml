      - status
      - derivedStatus
      - startDate
      - endDate
      - createdAt
      - renewalAlertedThresholds
      properties:
        id:
          type: string
        orgId:
          type: string
        supplierId:
          type: string
        supplierName:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
