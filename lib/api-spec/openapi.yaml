    Collector:
      type: object
      required:
      - id
      - name
      - posture
      - status
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        posture:
          type: string
          enum:
          - public-api
          - published-data
          - respect-robots-crawl
          - aggressive-crawl
        status:
          type: string
          enum:
          - enabled
          - disabled
          - killed
        sourceUrl:
          type: string
          nullable: true
        defaultRateLimitRpm:
          type: integer
          nullable: true
        defaultScheduleCron:
          type: string
          nullable: true
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        lastSignalCount:
          type: integer
          nullable: true
          description: 'Legacy alias for `lastInsertedCount`. Kept so older clients
            still rendering "rows landed last run" don''t silently break;
            new code should read `lastInsertedCount` and `lastDuplicateCount`
            for the explicit new-vs-duplicate split.

            '
        lastInsertedCount:
          type: integer
          nullable: true
          description: 'Number of genuinely new market-signal rows the most recent
            successful run wrote, as recorded by the runtime in
            `collector_audit_log.metadata.inserted`. Null when the
            collector has never had a `fetch_succeeded` audit row yet.

            '
        lastDuplicateCount:
          type: integer
          nullable: true
          description: 'Number of rows the most recent successful run skipped because
            they were already present, as recorded by the runtime in
            `collector_audit_log.metadata.duplicates`. Pair with
            `lastInsertedCount` to surface stalled feeds (always 0 new,
            non-zero duplicates).

            '
        staleEmptyRuns:
          type: boolean
          description: 'True when the last 3 successful runs all inserted zero new
            rows — a strong signal that the upstream feed is stalled
            even though the collector itself is running cleanly.
            Computed server-side from `collector_audit_log` so the UI
            can render a single warning chip without re-deriving the
            window per render.

            '
        postureClass:
          type: string
          enum:
          - public_api
          - tos_restricted
          - gray_hat
          description: 'Canonical posture classification used by the disclosure tier

            renderer (`public-api`/`published-data` map to `public_api`,

            `respect-robots-crawl` maps to `tos_restricted`,

            `aggressive-crawl` maps to `gray_hat`).

            '
        disclosureTier:
          type: string
          enum:
          - T1
          - T2
          - T3
          - T4
          description: 'Tier at which this source can be cited downstream. T1 = full

            attribution, T4 = invisible / confidence boost only.

            '
        jurisdiction:
          type: string
          description: ISO-3166 alpha-2 code or "GLOBAL".
        flagEmoji:
          type: string
          nullable: true
        retentionDays:
          type: integer
          nullable: true
        tenantOptInDefault:
          type: boolean
          nullable: true
        tenantOptedIn:
          type: boolean
          nullable: true
          description: 'Resolved opt-in state for the active tenant. Falls back to

            `tenantOptInDefault` when the tenant has no explicit override

            in `collector_tenant_opt_ins`.

            '
    CollectorRunResult:
      type: object
      required:
      - collectorId
      - signalsWritten
      - durationMs
      properties:
        collectorId:
          type: string
        signalsWritten:
          type: integer
        durationMs:
          type: integer
        skipped:
          type: boolean
        skipReason:
          type: string
    CollectorBackfillResult:
      type: object
      required:
      - collectorId
      - daysWritten
      - signalsInserted
      - signalsSkipped
      - durationMs
      properties:
        collectorId:
          type: string
        daysWritten:
          type: integer
          description: Distinct calendar days covered by the backfill.
        signalsInserted:
          type: integer
          description: New `market_signals` rows written by this run.
        signalsSkipped:
          type: integer
          description: 'Drafts that matched an existing

            `(scope_material_code, observed_at)` row and were not re-inserted.

            '
        durationMs:
          type: integer
        alreadyUpToDate:
          type: boolean
          description: 'True when the run short-circuited because the database
            was already in sync with the upstream archive — either via
            the cheap DB pre-check (no HTTP at all) or via the HEAD-probe
            watermark (single HEAD, no GET). Lets the UI surface a clear
            "already up to date" indicator instead of just
            `signalsInserted: 0`, which is otherwise indistinguishable
            from "ran the full pipeline and every row was a duplicate".

            '
    MarketSignal:
      type: object
      required:
      - id
      - signalType
      - value
      - observedAt
      - createdAt
      properties:
        id:
          type: string
        collectorId:
          type: string
          nullable: true
