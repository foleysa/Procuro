      tags:
      - defense-packs
      summary: List recent Defense Packs for the active tenant
      description: 'Returns the most recent Defense Packs created in the tenant,

        newest first. Pack `sections` and `evidenceSnapshot` are

        omitted from list rows for payload size — fetch

        `/defense-packs/{id}` for the full memo + frozen evidence.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Recent Defense Packs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefensePackListResponse'
    post:
      operationId: createDefensePack
      tags:
      - defense-packs
      summary: Generate a Defense Pack
      description: "Synchronously generates a buyer-ready procurement memo backed\nby Gemini 2.5 Flash. The pipeline:\n\n  1. Assembles a frozen evidence pool from the tenant's recent\n     T1/T2 `marketSignalsTable`\
        \ rows that match the target.\n  2. Calls Gemini with a sanitised prompt (prompt-injection\n     defences applied to all user-supplied text).\n  3. Verifies every emitted claim against the evidence\n\
        \     snapshot — claims that fail are dropped.\n  4. Regenerates ONCE if a section ends up without any\n     verified claims.\n\nThe pack is persisted with the frozen evidence snapshot. When\nthe\
        \ evidence pool is too thin to back the memo, returns a\npack with `status='insufficient_evidence'` and a human-readable\n`statusReason`.\n\nPer-tenant cap: 50 packs per UTC day. Exceeding the cap\
        \ returns\nHTTP 429.\n"
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDefensePackRequest'
      responses:
        '201':
          description: Generated pack (success or insufficient_evidence).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefensePack'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Per-tenant daily cap exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /defense-packs/{id}:
    get:
      operationId: getDefensePack
      tags:
      - defense-packs
      summary: Read a Defense Pack (frozen view + Evidence Room)
      description: 'Returns the pack with the full `sections` array and the frozen

        `evidenceSnapshot` so the Evidence Room view replays the

        cited signals exactly as they were at generation time, even

        after the live values move.

        '
