      summary: List alert rules
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleList'
    post:
      operationId: createAlertRule
      tags:
      - alerts
      summary: Create an alert rule
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRuleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
  /alert-rules/{id}:
    patch:
      operationId: patchAlertRule
      tags:
      - alerts
      summary: Update an alert rule
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAlertRuleRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAlertRule
      tags:
      - alerts
      summary: Delete an alert rule
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /escalation-policies:
    get:
      operationId: listEscalationPolicies
      tags:
      - alerts
      summary: List escalation policies
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationPolicyList'
    post:
      operationId: createEscalationPolicy
      tags:
      - alerts
      summary: Create an escalation policy
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEscalationPolicyRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationPolicy'
  /escalation-policies/{id}:
    patch:
      operationId: patchEscalationPolicy
      tags:
      - alerts
      summary: Update an escalation policy
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEscalationPolicyRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationPolicy'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteEscalationPolicy
      tags:
      - alerts
      summary: Delete an escalation policy
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /readiness:
    get:
      operationId: getReadiness
      tags: [onboarding]
      summary: Lever-by-lever data readiness for the active tenant
      description: |
        Runs the data-readiness rules engine: for each lever it reports a
        `score` (0-100) and any `blockers` describing what data is missing
        or unmapped, with a `fixUrl` deep-link the operator can follow to
        repair it. Cheap to call (one COUNT per check); the wizard and the
        dashboard "Data readiness" card both poll it.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Readiness snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /onboarding/state:
    get:
      operationId: getOnboardingState
      tags: [onboarding]
      summary: Get the wizard state for the current actor
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Wizard state (a fresh row is materialised on first call)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
    patch:
      operationId: patchOnboardingState
      tags: [onboarding]
      summary: Update the wizard state (current step / completed steps / dismissal)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchOnboardingStateRequest"
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"

  /onboarding/sample-data:
    post:
      operationId: installSampleData
      tags: [onboarding]
      summary: Install a curated synthetic dataset (Org Admin only)
      description: |
        Idempotent. Tags every inserted row with `source_system =
        'sample_data'` so DELETE can remove them cleanly without touching
        any operator-supplied data.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Sample data installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleDataResult"
    delete:
      operationId: removeSampleData
      tags: [onboarding]
      summary: Remove the sample dataset previously installed (Org Admin only)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Sample data removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleDataResult"

  /today/feed:
    get:
      operationId: getTodayFeed
      tags: [today]
      summary: Aggregated landing feed for the operator's morning triage
      description: |
        Composes alerts summary, proposed-bucket opportunities, recently-failed
        jobs, and pending-approval counts into a single fail-soft feed. Per-source
        failures populate `errors[]` and set `partial=true` rather than failing
        the response. No persistence; per-request cache only.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Today feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayFeed"
  /operations/health:
    get:
      operationId: getOperationsHealth
      tags: [operations]
      summary: Cross-cutting operations health rollup
      description: |
        Composes collectors, jobs (last 24h), data sources, integrations, and
        funnel snapshot failures into a single fail-soft rollup. Per-source
        failures populate `errors[]` and set `partial=true` rather than failing
        the response. No persistence; per-request cache only.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Operations health rollup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsHealth"
  /admin/whoami:
    get:
      operationId: getAdminWhoami
      tags:
      - admin
      summary: Resolved RBAC context for the current request
      description: 'Returns the orgId, email, and resolved role list for the current

        actor so the command-center UI can decide whether to render the

        Admin sidebar entry without round-tripping a 403.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: RBAC context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWhoamiResponse'
  /admin/users:
    get:
      operationId: listAdminUsers
      tags:
      - admin
      summary: Members of the active tenant
      description: 'Lists every `user_roles` row for the active org, including

        revoked rows so the UI can render history. Requires the

        `users:manage` permission.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: User role rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserRow'
  /admin/users/invite:
    post:
      operationId: inviteAdminUser
      tags:
      - admin
      summary: Invite a teammate with a pre-assigned role
      description: 'Provisions a `user_roles` row keyed on `pending:<email>` so the

        invitee picks up their role on first Clerk sign-in. Returns 409

        if the email already has a pending invite.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteAdminUserRequest'
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInviteResult'
        '409':
          description: Invite already pending for this email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/users/{id}:
    patch:
      operationId: changeAdminUserRole
      tags:
      - admin
      summary: Change the role of an existing member
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAdminUserRoleRequest'
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoleChangeResult'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: revokeAdminUser
      tags:
      - admin
      summary: Revoke a member's role
      description: 'Soft-revoke: sets `revokedAt` so the audit history is preserved.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRevokeResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/api-keys:
    get:
      operationId: listAdminApiKeys
      tags:
      - admin
      summary: List tenant API keys
      description: 'Returns every API key issued for the active tenant, including

        revoked keys. The plaintext token is never returned by this

        endpoint — only the prefix.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: API key rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminApiKeyRow'
    post:
      operationId: issueAdminApiKey
      tags:
      - admin
      summary: Issue a new tenant API key
      description: 'Generates a fresh token and returns the plaintext bearer ONCE in

        the `secret` field — the UI must surface it immediately and warn

        the operator they cannot retrieve it again. Cannot be scoped to

        `platform_admin`.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueAdminApiKeyRequest'
      responses:
        '201':
          description: Issued key (with one-shot plaintext secret)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiKeyIssued'
  /admin/api-keys/{id}:
    delete:
      operationId: revokeAdminApiKey
      tags:
      - admin
      summary: Revoke a tenant API key
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRevokeResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/api-keys/{id}/rotate:
    post:
      operationId: rotateAdminApiKey
      tags:
      - admin
      summary: Rotate a tenant API key
      description: 'Issues a replacement key with the same scope and revokes the old

        one in the same transaction. The plaintext secret is returned

        ONCE on the new key.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '201':
          description: Replacement key (with one-shot plaintext secret)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiKeyIssued'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot rotate a revoked key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/audit-log:
    get:
      operationId: listAdminAuditLog
      tags:
      - admin
      summary: List admin audit log entries
      description: 'Append-only record of every admin / RBAC mutation. Newest first,

        capped at 200. Filterable by actor, action, and target id.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - in: query
        name: actor
        schema:
          type: string
        description: Filter by actor email or system principal
      - in: query
        name: action
        schema:
          type: string
        description: Filter by action key (e.g. `user.invite`, `api_key.rotate`)
      - in: query
        name: targetId
        schema:
          type: string
        description: Filter by audited target id
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      responses:
        '200':
          description: Audit entries (most-recent first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAuditLogEntry'
  /admin/audit-log/actions:
    get:
      operationId: listAdminAuditActions
      tags:
      - admin
      summary: Distinct audit actions with counts
      description: 'Powers the action-filter dropdown in the Audit tab so users see

        only actions that have actually occurred for this tenant.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Action / count pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAuditActionCount'
  /admin/audit-log/export.csv:
    get:
      operationId: exportAdminAuditLog
      tags:
      - admin
      summary: Export filtered audit log as CSV
      description: 'Streams up to 10 000 audit rows for the active tenant matching

        the supplied filters. Used by SOC 2 reviewers and exported

        directly via a browser navigation.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: targetId
        schema:
          type: string
      responses:
        '200':
          description: CSV download
          content:
            text/csv:
              schema:
                type: string
  /admin/sso:
    get:
      operationId: getAdminSsoConfig
      tags:
      - admin
      summary: Read tenant SSO configuration
      description: 'Stored under `orgs.settings.sso`. Clerk hosts the actual SAML /

        OIDC connection; this endpoint stores only the tenant-specific

        metadata operators surface in the admin UI.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: SSO config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSsoConfig'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: saveAdminSsoConfig
      tags:
      - admin
      summary: Replace the tenant SSO configuration
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSsoConfig'
      responses:
        '200':
          description: Saved SSO config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSsoConfig'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/tenant-settings:
    get:
      operationId: getAdminTenantSettings
      tags:
      - admin
      summary: Read consolidated tenant-wide settings
      description: 'Aggregates fields from `orgs.successFeePct`, `orgs.baseCurrency`,

        and `orgs.settings` (disclosure policy, contract renewal alert,

        retention) so the Org-Admin UI can manage them in one place.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Tenant settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTenantSettings'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: saveAdminTenantSettings
      tags:
      - admin
      summary: Update consolidated tenant-wide settings
      description: 'Partial update — only fields supplied in the body are written.

        Fields stored on `orgs.settings` are merged with the existing

        JSON blob so unrelated keys are preserved.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTenantSettings'
      responses:
        '200':
          description: Updated tenant settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTenantSettings'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    OrgIdHeader:
      in: header
      name: x-org-id
      required: false
      schema:
        type: string
      description: 'Tenant ID hint. In production, requests MUST present

        `Authorization: Bearer <token>` and `x-org-id` (if supplied) must

        match the org bound to that token. In development, this header is

        accepted standalone.

        '
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 'Per-tenant API token. The plaintext token is sha256-hashed server-side

        and matched against `org_api_tokens.token_hash` to derive the active

        tenant scope. Required in production; optional in development.

        '
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthStatus:
      type: object
      required:
      - status
      - timestamp
      properties:
        status:
          type: string
          enum:
          - ok
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
        details: {}
    Org:
      type: object
      required:
      - id
      - slug
      - name
      - createdAt
      - disclosurePolicy
      - contractRenewalAlertDays
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        successFeePct:
          type: number
          description: Default contingency fee on realized savings
        disclosurePolicy:
          $ref: '#/components/schemas/DisclosurePolicy'
        contractRenewalAlertDays:
          type: integer
          minimum: 1
          description: 'Days-to-expiry threshold used by the renewal-alert worker.

            Defaults to 90 when not explicitly set in `orgs.settings`.

            '
        createdAt:
          type: string
          format: date-time
    DisclosurePolicy:
      type: string
      description: 'Per-tenant insight-citation disclosure policy. Controls which

        intelligence-source tiers are surfaced when rendering an insight

        via the disclosure-tier renderer. `conservative` only shows T1+T2

        attributions, `standard` adds T3 (class label + confidence) and

        `analyst` shows full provenance for every tier including T4.

        '
      enum:
      - conservative
      - standard
      - analyst
    MeResponse:
      type: object
      required:
      - org
      - user
      properties:
        org:
          $ref: '#/components/schemas/Org'
        actorEmail:
          type: string
        user:
          $ref: '#/components/schemas/MeUser'
    PatchMeSettingsRequest:
      type: object
      description: 'Partial update for `orgs.settings`. Every property is optional;

        unspecified keys are left untouched on the stored JSONB.

        '
      properties:
        disclosurePolicy:
          $ref: '#/components/schemas/DisclosurePolicy'
        contractRenewalAlertDays:
          type: integer
          minimum: 1
          maximum: 365
          description: 'Days-to-expiry threshold the daily renewal-alert worker uses

            to surface a contract as a renewal alert. Default 90.

            '
    OrgSettingsAuditEntry:
      type: object
      description: 'One entry in the `org_settings_audit_log` feed. Mirrors the

        per-key shape of `SupplierAuditEntry` / `ContractAuditEntry` so

        the FE can render a unified "who changed what" history.

        '
      required:
      - id
      - key
      - actorEmail
      - createdAt
      properties:
        id:
          type: string
        key:
          type: string
          description: 'Settings key that changed, e.g. `disclosurePolicy` or

            `contractRenewalAlertDays`.

            '
        actorEmail:
          type: string
        oldValue: {}
        newValue: {}
        createdAt:
          type: string
          format: date-time
    LeverId:
      type: string
      enum:
      - sku_price_benchmark
      - maverick_spend
      - contract_leakage
      - duplicate_payment
      - missed_volume_threshold
      - payment_term_extension
      - tail_spend_rationalization
      - supplier_consolidation
      - contract_renegotiation_trigger
      - spot_vs_contract
      - supplier_fx_exposure
      - material_index_arbitrage

    ReadinessBlocker:
      type: object
      required: [id, field, message, missingPct, missingCount, totalCount, fixUrl, hard]
      properties:
        id: { type: string, description: "Stable id, e.g. `suppliers.billing_currency`." }
        field: { type: string, description: "Operator-readable field name." }
        message: { type: string }
        missingPct: { type: integer, minimum: 0, maximum: 100 }
        missingCount: { type: integer, minimum: 0 }
        totalCount: { type: integer, minimum: 0 }
        fixUrl: { type: string, description: "Deep-link to the page that fixes the gap." }
        hard:
          type: boolean
          description: "True when this blocker fully prevents the lever from running."

    LeverReadiness:
      type: object
      required: [leverId, label, tier, score, blockers]
      properties:
        leverId: { $ref: "#/components/schemas/LeverId" }
        label: { type: string }
        tier: { type: integer, minimum: 1, maximum: 5 }
        score: { type: integer, minimum: 0, maximum: 100 }
        blockers:
          type: array
          items: { $ref: "#/components/schemas/ReadinessBlocker" }

    ReadinessResponse:
      type: object
      required: [overallScore, hasIngestedData, sampleDataInstalled, levers]
      properties:
        overallScore: { type: integer, minimum: 0, maximum: 100 }
        hasIngestedData:
          type: boolean
          description: "False when no contracts/POs/invoices exist yet for the tenant."
        sampleDataInstalled:
          type: boolean
          description: "True when the curated synthetic dataset is currently loaded."
        levers:
          type: array
          items: { $ref: "#/components/schemas/LeverReadiness" }

    OnboardingWizardStep:
      type: string
      enum:
        - welcome
        - bring_data
        - map_categories
        - invite_team
        - configure_settings
        - run_first_cycle
        - completed

    CompletedOnboardingStep:
      type: object
      required: [step, completedAt]
      properties:
        step: { $ref: "#/components/schemas/OnboardingWizardStep" }
        completedAt: { type: string, format: date-time }

    OnboardingState:
      type: object
      required: [currentStep, completedSteps, startedAt, updatedAt, dismissed, completed]
      properties:
        currentStep: { $ref: "#/components/schemas/OnboardingWizardStep" }
        completedSteps:
          type: array
          items: { $ref: "#/components/schemas/CompletedOnboardingStep" }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        dismissedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        dismissed: { type: boolean }
        completed: { type: boolean }

    PatchOnboardingStateRequest:
      type: object
      description: |
        Partial update for the actor's wizard row. Any subset of fields
        may be supplied. Setting `completedStep` appends an entry to the
        `completedSteps` array; setting `dismissed: true` stamps a
        `dismissedAt`. When `completedStep` is supplied together with
        `skipped: true`, the audit log records `step_skipped` instead of
        `step_completed` so CS can spot the drop-off pattern.
      properties:
        currentStep: { $ref: "#/components/schemas/OnboardingWizardStep" }
        completedStep: { $ref: "#/components/schemas/OnboardingWizardStep" }
        skipped: { type: boolean }
        dismissed: { type: boolean }
        completed: { type: boolean }

    SampleDataCounts:
      type: object
      required:
        - suppliers
        - categories
        - items
        - contracts
        - purchaseOrders
        - poLines
        - invoices
        - payments
      properties:
        suppliers: { type: integer, minimum: 0 }
        categories: { type: integer, minimum: 0 }
        items: { type: integer, minimum: 0 }
        contracts: { type: integer, minimum: 0 }
        purchaseOrders: { type: integer, minimum: 0 }
        poLines: { type: integer, minimum: 0 }
        invoices: { type: integer, minimum: 0 }
        payments: { type: integer, minimum: 0 }

    SampleDataResult:
      type: object
      required: [installed, removed, counts]
      properties:
        installed:
          type: boolean
          description: "True if this call inserted rows; false if rows already existed (idempotent)."
        removed:
          type: boolean
          description: "True if this call deleted rows; false if no sample data was present."
        counts:
          $ref: "#/components/schemas/SampleDataCounts"

    RejectionReasonCode:
      type: string
      enum:
      - supplier_strategic_do_not_consolidate
      - supplier_dei_or_diverse_program
      - compliance_or_legal_block
      - quality_risk_too_high
      - timing_blocked_by_business
      - savings_overstated
      - already_actioned
      - other
    SpendByBand:
      type: object
      description: 'Spend bucketed by routing band. Drives the "by-Band" lens on
        Spend Overview. Trailing 90 days. The six bands are the routing
        model''s shared vocabulary (`indexable`, `concentrated`,
        `fragmented`, `subscription`, `capital`, `services`); rows
        whose category has no band assigned and isn''t taxonomy-classed
        as a service fall through to `fragmented` AND are also tallied
        as the unmapped tail (`unmappedCategoryCount` /
        `unmappedSpendUsd`) so the operator can prioritise routing
        decisions without losing total reconciliation.'
      required:
      - totalSpendUsd
      - byBand
      - unmappedCategoryCount
      - unmappedSpendUsd
      properties:
        totalSpendUsd:
          type: number
        unmappedCategoryCount:
          type: integer
          description: 'Distinct categories in the 90-day window with no
            `category_bands` row and not classed as `service`. These
            rows still get counted in the `fragmented` bucket so
            totals reconcile.'
        unmappedSpendUsd:
          type: number
          description: 90-day spend attributable to unmapped categories.
        byBand:
          type: array
          items:
            type: object
            required:
            - band
            - spendUsd
            - share
            properties:
              band:
                type: string
                enum:
                - indexable
                - concentrated
                - fragmented
                - subscription
                - capital
                - services
              spendUsd:
                type: number
              share:
                type: number
                description: Fraction of total spend in this band (0–1).
              categoryCount:
                type: integer
              supplierCount:
                type: integer
              topCategories:
                type: array
                description: 'Top categories driving spend within this band, capped
                  at 5. Powers the per-band drill-down on Spend
                  Overview so operators can jump straight to the
                  rows they need to address.'
                items:
                  type: object
                  required:
                  - categoryId
                  - categoryName
                  - spendUsd
                  properties:
                    categoryId:
                      type: string
                    categoryName:
                      type: string
                    spendUsd:
                      type: number
    GoodsVsServicesBlock:
      type: object
      required:
      - goodsSpendUsd
      - servicesSpendUsd
      - goodsShare
      - servicesShare
      properties:
        goodsSpendUsd:
          type: number
        servicesSpendUsd:
          type: number
        goodsShare:
          type: number
          description: Fraction of total spend on goods (0–1).
        servicesShare:
          type: number
          description: Fraction of total spend on services (0–1).
    SpendOverview:
      type: object
      required:
      - totalSpendUsd
      - byClass
      - byCategory
      - bySupplier
      - byBusinessUnit
      - concentration
      - goodsVsServices
      properties:
        totalSpendUsd:
          type: number
        goodsVsServices:
          $ref: '#/components/schemas/GoodsVsServicesBlock'
        byClass:
          type: array
          items:
            type: object
            required:
            - spendClass
            - spendUsd
            properties:
              spendClass:
                type: string
              spendUsd:
                type: number
        byCategory:
          type: array
          items:
            type: object
            required:
            - categoryId
            - categoryName
            - categoryClass
            - spendUsd
            properties:
              categoryId:
                type: string
              categoryName:
                type: string
              categoryClass:
                type: string
              spendUsd:
                type: number
        bySupplier:
          type: array
          items:
            type: object
            required:
            - supplierId
            - supplierName
            - spendUsd
            - poCount
            properties:
              supplierId:
                type: string
              supplierName:
                type: string
              spendUsd:
                type: number
              poCount:
                type: number
        byBusinessUnit:
          type: array
          items:
            type: object
            required:
            - businessUnit
            - spendUsd
            properties:
              businessUnit:
                type: string
              spendUsd:
                type: number
        concentration:
          type: object
          required:
          - top10SupplierShare
          - activeSupplierCount
          - tailSupplierCount
          - tailSpendUsd
          properties:
            top10SupplierShare:
              type: number
            activeSupplierCount:
              type: number
            tailSupplierCount:
              type: number
            tailSpendUsd:
              type: number
    Supplier:
      type: object
      required:
      - id
      - name
      - isStrategic
      - isPreferred
      properties:
        id:
          type: string
        name:
          type: string
        countryCode:
          type: string
          nullable: true
        billingCurrency:
          type: string
          nullable: true
          description: 'ISO 4217 currency code in which this supplier bills. Null

            means "unknown / inherits the org base currency".

            '
        billingCurrencySource:
          allOf:
          - $ref: '#/components/schemas/BillingCurrencySource'
          nullable: true
          description: 'How `billingCurrency` was determined. Surfaced on the
            supplier ingest review screen so an operator can tell at a
            glance whether the value came from the upstream feed
            (`provided` / `manual_override`) or from the deterministic
            auto-detect path (`country` / `invoice_iso` / `invoice_symbol`
            / `backfill_invoice` / `country_dollarized`). Null when
            `billingCurrency` itself is null.'
        billingCurrencyConfidence:
          allOf:
          - $ref: '#/components/schemas/BillingCurrencyConfidence'
          nullable: true
          description: 'Confidence rating attached to the auto-detected
            `billingCurrency`. The supplier ingest review screen renders
            this as a chip next to the currency code and visually
            highlights `low` rows so the operator can spot ambiguous
            guesses (e.g. dollarized-country fallbacks) and override
            them inline. Null when `billingCurrency` itself is null.'
        paymentTermsDays:
          type: string
          nullable: true
        isStrategic:
          type: boolean
        isPreferred:
          type: boolean
        tags:
          type: array
          items:
            type: string
        internalNotes:
          type: string
          nullable: true
    SupplierListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Supplier'
        nextCursor:
          type: string
          nullable: true
    SupplierLinkedContract:
      type: object
      required:
      - id
      - contractNumber
      - title
      - status
      - derivedStatus
      - endDate
      properties:
        id:
          type: string
        contractNumber:
          type: string
        title:
          type: string
        status:
          type: string
        derivedStatus:
          $ref: '#/components/schemas/ContractDerivedStatus'
        endDate:
          type: string
          format: date-time
        daysToExpiry:
          type: integer
        billingCurrency:
          type: string
          nullable: true
        annualBaselineUsd:
          type: number
          nullable: true
    SupplierLinkedOpportunity:
      type: object
      required:
      - id
      - leverId
      - status
      - title
      - projectedSavingsUsd
      - createdAt
      properties:
        id:
          type: string
        leverId:
          type: string
        status:
          type: string
        title:
          type: string
        projectedSavingsUsd:
          type: number
        createdAt:
          type: string
          format: date-time
    SupplierSpendRollup:
      type: object
      description: 'Trailing-365-day spend rollup for one supplier. Numbers are in

        USD; `monthly` is ordered oldest-first so the chart can render

        a left-to-right time series without re-sorting.

        '
      required:
      - totalSpendUsd
      - poCount
      - monthly
      - topCategories
      properties:
        totalSpendUsd:
          type: number
        poCount:
          type: integer
        monthly:
          type: array
          items:
            type: object
            required:
            - month
            - spendUsd
            properties:
              month:
                type: string
                description: ISO month start, e.g. `2025-04-01`.
              spendUsd:
                type: number
        topCategories:
          type: array
          items:
            type: object
            required:
            - categoryId
            - categoryName
            - spendUsd
            properties:
              categoryId:
                type: string
              categoryName:
                type: string
              categoryCode:
                type: string
                nullable: true
                description: 'Tenant `categories.code` for this row. Used by the
                  Command Center to look up the matching CPI sub-index
                  (#68) and any other category-keyed market signals.
                  '
              cpiScopeCode:
                type: string
                nullable: true
                description: 'Canonical BLS CPI scope code (`FOOD_AT_HOME`,
                  `ENERGY`, `APPAREL`, …) when this category maps onto a
                  consumer-facing CPI sub-series. Non-null marks the
                  category as eligible for the CPI pushback trend chart
                  on Supplier 360. Null for direct-materials categories
                  whose right benchmark is PPI / spot, not CPI.
                  '
              spendUsd:
                type: number
    SupplierAuditEntry:
      type: object
      required:
      - id
      - field
      - actorEmail
      - createdAt
      properties:
        id:
          type: string
        field:
          type: string
        actorEmail:
          type: string
        oldValue: {}
        newValue: {}
        createdAt:
          type: string
          format: date-time
    SupplierServicesEngagement:
      type: object
      description: 'Services-side rollup for a single supplier — drives the
        "Services engagement" card on Supplier 360. Activity counters
        and `totalServicesSpendUsd` are trailing 365d;
        `avgBlendedRateUsd` and `offCardSpendShare` are trailing 90d;
        `changeOrderRatio` is computed across all currently active
        SOWs (not time-windowed).'
      required:
      - activeSowCount
      - openMilestoneCount
      - rateCardCount
      - totalServicesSpendUsd
      - timeAndMaterialsSpendUsd
      - fixedPriceSpendUsd
      - avgBlendedRateUsd
      - offCardSpendShare
      - changeOrderRatio
      - hasServicesActivity
      - utilizationSignalCount
      properties:
        activeSowCount:
          type: integer
        openMilestoneCount:
          type: integer
          description: SOW milestones not yet `accepted`/`invoiced`/`paid`/`cancelled`.
        rateCardCount:
          type: integer
        totalServicesSpendUsd:
          type: number
          description: Trailing-365d spend tied to services contracts only.
        timeAndMaterialsSpendUsd:
          type: number
        fixedPriceSpendUsd:
          type: number
        upcomingMilestoneDueDate:
          type: string
          format: date-time
          nullable: true
          description: Earliest non-cancelled milestone due date, if any.
        avgBlendedRateUsd:
          type: number
          nullable: true
          description: 'Trailing-90d weighted blended bill rate across all time
            entries logged for this supplier (sum(amount_usd) /
            sum(hours)). Null when no time entries exist.'
        offCardSpendShare:
          type: number
          description: 'Share of trailing-90d time-entry spend that priced
            outside any rate card line (`rate_card_line_id IS NULL`).
            0–1; 0 if there''s no time-entry activity at all.'
        changeOrderRatio:
          type: number
          description: 'Sum of committed (approved/executed) change-order value
            across the supplier''s currently active SOWs, divided by
            the total NTE of those active SOWs. 0 when there is no
            active-SOW NTE to divide by.'
        hasServicesActivity:
          type: boolean
          description: 'True when the supplier has at least one services
            contract, SOW (any status), or time entry on record. Lets
            the FE show the Services Engagement card for suppliers
            that have engagement history without recent numeric spend.'
        utilizationSignalCount:
          type: integer
          description: 'Total person-week hours-audit signals over the
            trailing 90 days — sum of `utilizationOverloadCount` and
            `utilizationUnderutilCount`. Each signal is a (resource,
            ISO-week) pair where weekly hours either exceed the
            overload threshold (>50 hrs) or fall below the
            under-utilization threshold (<10 hrs while the resource
            was otherwise active that quarter). Replaces the earlier
            opportunity-count derivation so the KPI is grounded in
            time-entry actuals.'
        utilizationOverloadCount:
          type: integer
          description: 'Person-week pairs over the trailing 90 days where
            weekly hours exceeded 50. Sustained overload is a
            burnout/quality risk and a renegotiation lever (extra
            staffing under the same NTE).'
        utilizationUnderutilCount:
          type: integer
          description: 'Person-week pairs over the trailing 90 days where
            weekly hours fell below 10 while the resource was
            otherwise active that quarter. Captures bench burn the
            client is paying for.'
    SupplierDetail:
      allOf:
      - $ref: '#/components/schemas/Supplier'
      - type: object
        required:
        - spend
        - contracts
        - opportunities
        - fxSignals
        - auditLog
        - services
        properties:
          spend:
            $ref: '#/components/schemas/SupplierSpendRollup'
          services:
            $ref: '#/components/schemas/SupplierServicesEngagement'
          contracts:
            type: array
            items:
              $ref: '#/components/schemas/SupplierLinkedContract'
          opportunities:
            type: array
            items:
              $ref: '#/components/schemas/SupplierLinkedOpportunity'
          fxSignals:
            type: array
            description: 'Most-recent FX rate observations for the supplier''s

              billing currency pair (when set). The Command Center

              renders these in the FX exposure tab.

              '
            items:
              $ref: '#/components/schemas/MarketSignal'
          auditLog:
            type: array
            items:
              $ref: '#/components/schemas/SupplierAuditEntry'
    PatchSupplierRequest:
      type: object
      description: 'Partial update for the operator-controlled fields on a supplier.

        Every property is optional. Sending `null` for a nullable field

        clears it; omitting a field leaves the stored value unchanged.

        '
      properties:
        billingCurrency:
          type: string
          nullable: true
          maxLength: 3
          description: ISO 4217 currency code, e.g. `USD`, `EUR`, `JPY`.
        isStrategic:
          type: boolean
        isPreferred:
          type: boolean
        tags:
          type: array
          items:
            type: string
            maxLength: 64
        internalNotes:
          type: string
          nullable: true
          maxLength: 5000
    SupplierIntelligenceSignalType:
      type: string
      description: 'Subset of `MarketSignal.signalType` that the supplier-intelligence

        endpoint surfaces. These are exactly the signal types emitted by

        the Phase-2 public-API collectors (sanctions, corporate filings,

        entity registry, facility emissions, natural hazard, geocoded

        events, OpenSanctions risk screening).

        '
      enum:
      - sanctions_match
      - risk_screening_match
      - corporate_filing
      - entity_registry
      - facility_emissions
      - natural_hazard
      - event_geocoded
    SupplierIntelligenceMatchKind:
      type: string
      description: 'How this signal was matched to the supplier — `entity_uid` is the

        canonical cross-collector join, `supplier_name` is the

        case-insensitive name fallback used when no resolved entity uid

        is available (or when the row predates resolution).

        '
      enum:
      - entity_uid
      - supplier_name
    SupplierIntelligenceSignal:
      type: object
      required:
      - id
      - signalType
      - observedAt
      - matchKind
      - collectorId
      - collectorName
      - sourceUrl
      - contract
      properties:
        id:
          type: string
        signalType:
          $ref: '#/components/schemas/SupplierIntelligenceSignalType'
        observedAt:
          type: string
          format: date-time
        matchKind:
          $ref: '#/components/schemas/SupplierIntelligenceMatchKind'
        collectorId:
          type: string
        collectorName:
          type: string
        sourceUrl:
          type: string
        contract:
          type: object
          required:
          - postureClass
          - disclosureTier
          - jurisdiction
          - retentionDays
          - tenantOptInDefault
          properties:
            postureClass:
              type: string
              enum:
              - public_api
              - tos_restricted
              - gray_hat
            disclosureTier:
              type: string
              enum:
              - T1
              - T2
              - T3
              - T4
            jurisdiction:
              type: string
            retentionDays:
              type: integer
            tenantOptInDefault:
              type: boolean
        scopeSupplierName:
          type: string
          nullable: true
        scopeCategoryCode:
          type: string
          nullable: true
        scopeSku:
          type: string
          nullable: true
        scopeLaneKey:
          type: string
          nullable: true
        value:
          type: number
        unit:
          type: string
        currency:
          type: string
        confidence:
          type: number
        entityUid:
          type: string
          nullable: true
        headline:
          type: string
          description: 'Short human-readable summary derived from the signal — used as

            the row title in the supplier risk timeline. The server picks

            the right field from the metadata blob per signal type so the

            client can render every row uniformly.

            '
        detail:
          type: string
          nullable: true
          description: 'Optional secondary line surfaced under the headline (e.g. the

            sanctions list name, the EDGAR form code, or the natural-hazard

            magnitude). May be null when the signal carries no useful

            sub-headline.

            '
    BillingCurrencySource:
      type: string
      enum:
      - provided
      - country
      - country_dollarized
      - invoice_iso
      - invoice_symbol
      - backfill_invoice
      - manual_override
      description: 'How `billingCurrency` was determined. `provided` = supplied

        explicitly on the supplier feed; `country` = single-currency

        country auto-detect; `country_dollarized` = de-facto dollarized

        / multi-currency country (low confidence, not auto-applied at

        ingest); `invoice_iso` / `invoice_symbol` = scanned at ingest

        from an `invoiceSample` field on the supplier row;

        `backfill_invoice` = scanned post-PO-ingest from PO line

        descriptions; `manual_override` = set by an operator via

        `POST /suppliers/{id}/billing-currency`.

        '
    BillingCurrencyConfidence:
      type: string
      enum:
      - high
      - medium
      - low
      description: 'Confidence level for the resolved billing currency. `provided`

        and `manual_override` sources are always `high`. `country` and

        `invoice_iso` resolve to `high`. `invoice_symbol` is `medium`

        (symbols like `$` are ambiguous). `country_dollarized` is

        `low` (advisory only — operator confirmation expected).

        '
    BillingCurrencyOverrideRequest:
      type: object
      required:
      - billingCurrency
      properties:
        billingCurrency:
          type: string
          minLength: 3
          maxLength: 3
          description: 'ISO 4217 currency code (3 letters, will be uppercased

            server-side). Example: `EUR`.

            '
    BillingCurrencyOverrideResponse:
      type: object
      required:
      - id
      - billingCurrency
      - billingCurrencySource
      - billingCurrencyConfidence
      properties:
        id:
          type: string
        billingCurrency:
          type: string
        billingCurrencySource:
          $ref: '#/components/schemas/BillingCurrencySource'
        billingCurrencyConfidence:
          $ref: '#/components/schemas/BillingCurrencyConfidence'
    SupplierIntelligenceResponse:
      type: object
      required:
      - supplierId
      - supplierName
      - resolvedEntityUid
      - totalCount
      - items
      properties:
        supplierId:
          type: string
        supplierName:
          type: string
        countryCode:
          type: string
          nullable: true
        billingCurrency:
          type: string
          nullable: true
          description: 'ISO 4217 billing currency for this supplier (uppercase 3

            letters). Null when no signal was strong enough to set

            one — downstream FX logic then falls back to the org base

            currency.

            '
        billingCurrencySource:
          allOf:
          - $ref: '#/components/schemas/BillingCurrencySource'
          nullable: true
        billingCurrencyConfidence:
          allOf:
          - $ref: '#/components/schemas/BillingCurrencyConfidence'
          nullable: true
        resolvedEntityUid:
          type: string
          nullable: true
          description: 'Canonical entity uid the resolver returned for this supplier —

            null when neither identifier nor BQ-name match was found, in

            which case only the `supplier_name` fallback contributed

            signals to `items`.

            '
        resolvedMatchType:
          type: string
          nullable: true
          enum:
          - identifier
          - deterministic_name
          - fuzzy_gemini
          - unresolved
        countsByType:
          type: object
          description: 'Map from `SupplierIntelligenceSignalType` to the number of

            items in this response with that type. Empty when no signals

            matched.

            '
          additionalProperties:
            type: integer
        totalCount:
          type: integer
          description: Total number of items returned (`items.length`).
        items:
          type: array
          items:
            $ref: '#/components/schemas/SupplierIntelligenceSignal'
    Opportunity:
