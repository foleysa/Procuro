    TodayFeedItem:
      type: object
      required:
        - kind
        - source
        - payload
        - occurredAt
        - severity
      properties:
        kind:
          type: string
          description: |
            Logical category of this feed item. Today aggregator emits:
            `alerts.summary`, `opportunities.proposed`, `jobs.failed`,
            `approvals.pending`, `funnel.auto_annotations` (substrate
            stage_drop/spike annotations from #185), and
            `funnel.conversion_deltas` (per-transition conversion-rate
            diff between the two most recent funnel snapshots).
        source:
          type: string
          description: Name of the underlying handler that produced this item (e.g. getAlertsSummary).
        payload:
          type: object
          additionalProperties: true
          description: |
            Source-specific payload. Shape is documented per `kind` in
            the design doc; unknown keys are tolerated.

            #209 enrichments (additive, all optional — clients capability-gate):

            * `alerts.summary` — `openTotal`, `openCriticalOrHigh`, and
              optionally `topAlert: { id, title, severity, ageMs }` when
              there is at least one open alert.
            * `opportunities.proposed` — `count`, `top` (raw rows), and
              optionally `topOpportunity: { id, title, leverId,
              projectedSavingsUsd }`.
            * `jobs.failed` — `count`, `recent` (raw rows), and
              optionally `topFailed: { kind, ageMs }` when count > 0;
              optionally `lastSuccessfulCycle: { generation,
              completedAt, ageMs }` when count == 0 (or in addition).
            * `approvals.pending` — `pending` (total backlog),
              `needsActionToday` (RT-83 primary number: proposed
              opportunities that are EITHER fresh (created in the last
              24h) OR aging past the soft deadline (still pending and
              older than 7 days) — i.e. the operator's morning queue),
              and optionally `oldestAgeMs` (oldest pending row).
        occurredAt:
          type: string
          format: date-time
          description: When the underlying event happened (or now() for synthesized rollups).
        severity:
          type: string
          enum: [info, warn, error]
          description: Display severity, normalized across sources.
    TodayFeedSourceError:
      type: object
      required:
        - source
        - error
      properties:
        source:
          type: string
        error:
          type: string
    TodayFeed:
      type: object
      required:
        - items
        - partial
        - errors
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodayFeedItem'
        partial:
          type: boolean
          description: True iff at least one underlying source failed and contributed to `errors[]`.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TodayFeedSourceError'
    OperationsHealth:
      type: object
      required:
        - items
        - partial
        - errors
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodayFeedItem'
        partial:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TodayFeedSourceError'
