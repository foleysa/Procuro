  /ingest/csv-stream:
    post:
      operationId: ingestCsvStream
      tags:
      - ingest
      summary: Stream a single-entity CSV file (bounded-memory ingest)
      description: "Streams a single-entity CSV file directly into the database without\nbuffering it in memory. Use for very large files (millions of rows)\nthat cannot fit in a JSON request body. Memory\
        \ stays bounded\nregardless of file size.\n\nThe endpoint accepts either:\n  * `multipart/form-data` with a single file part named `file`\n    (preferred — what the generated client and browser\
        \ uploads use), or\n  * `text/csv` raw body (convenient for `curl --data-binary` and back-compat).\n\nHard limit: 1 GB per upload.\n\n**Response is NDJSON streamed live as the server processes the\n\
        upload.** Once pre-flight validation passes (entity name, declared\nContent-Length under 1 GB), the response Content-Type switches to\n`application/x-ndjson` and the server writes one JSON object\
        \ per\nline, terminated by `\\n`:\n\n  * `{\"type\":\"progress\",\"rowsParsed\":N,\"rowsInserted\":M,\"bytesProcessed\":B}` —\n    emitted after batch flushes, throttled to ~4/sec server-side so\n\
        \    multi-million-row files don't flood the wire. `bytesProcessed`\n    is optional and reports how many request-body bytes the server\n    has consumed so far; the client uses it (plus the file\
        \ size) to\n    render a server-side progress bar and a rows/sec ETA.\n  * `{\"type\":\"result\",\"entity\":\"...\",\"rowsParsed\":N,\"rowsInserted\":M,\"durationMs\":D}` —\n    exactly one terminal\
        \ success event whose payload matches\n    `StreamCsvResult`.\n  * `{\"type\":\"error\",\"error\":\"...\"}` — exactly one terminal failure\n    event for errors that occurred mid-stream after headers\
        \ were\n    sent. (Pre-flight failures still surface as conventional 4xx\n    JSON responses with an `error` body.)\n\nClients should read the response body incrementally (browser XHR\n`onprogress`\
        \ + `responseText`, or fetch `body.getReader()`),\nsplit on `\\n`, and parse each non-empty line as JSON. The same\napproach used by the Data Ingest page's `uploadCsvStream` helper\nworks in any\
        \ modern browser without extra dependencies.\n"
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - in: query
        name: entity
        required: true
        description: Which entity the CSV rows describe.
        schema:
          type: string
          enum:
          - suppliers
          - categories
          - items
          - purchase_orders
          - po_lines
          - invoices
          - payments
          - shipments
          - statements_of_work
          - rate_cards
          - rate_card_lines
          - time_entries
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The CSV file to stream-ingest.
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 'NDJSON stream. Each line is a JSON object whose `type` field

            discriminates between `progress` (zero or more, throttled),

            `result` (exactly one, terminal success), or `error` (exactly

            one, terminal mid-stream failure).

            '
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/StreamCsvEvent'
        '400':
          description: Invalid entity name (pre-flight rejection, JSON body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 'Pre-flight rejection: declared Content-Length exceeds the 1 GB

            per-request size limit. Mid-stream limit hits surface as an

            in-stream `{"type":"error",...}` NDJSON event on a 200 response

            instead, since the response headers have already been sent.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
