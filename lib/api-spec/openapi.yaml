        \ — `endDate <= now`\nComputed server-side so the renewal calendar / list / colour\ncoding stays consistent across surfaces.\n"
      enum:
      - active
      - expiring
      - expired
      - pending
      - cancelled
    Contract:
      type: object
      required:
      - id
      - orgId
      - supplierId
      - contractNumber
