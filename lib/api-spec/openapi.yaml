      - title
      - status
      - amountUsd
      properties:
        id:
          type: string
        sowId:
          type: string
        sequence:
          type: integer
          description: 1-based ordering within the SOW.
        title:
          type: string
        status:
          type: string
          enum:
          - pending
          - in_progress
          - delivered
          - accepted
          - invoiced
          - paid
          - cancelled
        dueDate:
          type: string
          format: date-time
          nullable: true
        deliveredDate:
          type: string
          format: date-time
          nullable: true
        acceptedDate:
          type: string
          format: date-time
          nullable: true
        amount:
          type: number
          nullable: true
        amountUsd:
          type: number
        currency:
          type: string
          nullable: true
        acceptanceCriteria:
          type: string
          nullable: true
        isOverdue:
          type: boolean
          description: 'True when the milestone is still open (not
            accepted/invoiced/paid/cancelled) and `dueDate` is in the
            past. Drives the red highlight on the milestone row.'
    SowChangeOrder:
      type: object
      required:
      - id
      - sowId
      - changeNumber
      - title
      - status
      - amountDeltaUsd
      - createdAt
      properties:
        id:
          type: string
        sowId:
          type: string
        changeNumber:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        amountDelta:
          type: number
          nullable: true
        amountDeltaUsd:
          type: number
        currency:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
          nullable: true
          description: 'Timestamp when the change order was approved/executed
            (mirrors `executed_at` in storage). Null while the change
            order is still pending or has been rejected.'
        approver:
          type: string
          nullable: true
          description: 'Free-text identity (name / email / role) of the
            approver who signed off on this change order. Surfaces in
            the audit trail alongside delta value and approval date so
            operators can answer "who approved this scope creep?"
            without leaving the SOW detail page. Null when the source
            system does not carry approver identity, or when the row
            is still in proposed/rejected state.'
    SowLinkedOpportunity:
      type: object
      description: Open opportunity referencing this SOW.
      required:
      - id
      - leverId
      - status
      - title
      - projectedSavingsUsd
      - createdAt
      properties:
        id:
          type: string
        leverId:
          type: string
        status:
          type: string
        title:
          type: string
        projectedSavingsUsd:
          type: number
        createdAt:
          type: string
          format: date-time
    SowDetail:
      allOf:
      - $ref: '#/components/schemas/StatementOfWork'
      - type: object
        required:
        - milestones
        - changeOrders
        - burn
        - linkedOpportunities
        properties:
          description:
            type: string
            nullable: true
          scope:
            description: 'Structured scope JSON as captured on the SOW (free-form
              shape — typically a deliverables list, assumptions, and
              exclusions). Null if the SOW was loaded without a
              structured scope.'
            nullable: true
          billingModel:
            type: string
            nullable: true
            enum:
            - t_and_m
            - fixed_price
            - milestone
            - retainer
            - outcome
            - goods
            description: 'Commercial model the SOW operates under. Derived from
              the parent MSA contract''s `contract_type` so the SOW
              detail can reason about how to render rate / milestone
              widgets without re-deriving from data.'
          acceptanceCriteria:
            type: string
            nullable: true
            description: 'Plain-text acceptance criteria recorded on the SOW.
              Distinct from per-milestone acceptance criteria; this is
              the SOW-wide gate.'
          burn:
            type: object
            description: 'Snapshot of how this SOW is burning through committed
              budget plus a 26-week weekly burn series sourced from
              `time_entries`. `committedUsd` and `nteUsd` are the SOW
              ceiling (synonyms surfaced for clarity); `earnedUsd`
              sums accepted/invoiced/paid milestones; `burnedUsd` sums
              actual time-entry spend (the chart''s y-axis);
              `invoicedUsd` sums invoiced/paid milestones only.
              `runwayDays` is the NTE-anchored projection — remaining
              capacity divided by the trailing 4-week average burn
              rate, expressed in days. `weekly` is the per-week
              series the FE renders as a stacked-area chart against
              the NTE ceiling.'
            required:
            - committedUsd
            - nteUsd
            - earnedUsd
            - burnedUsd
            - burnedPct
            - invoicedUsd
            - avgWeeklyBurnUsd
            - weekly
            properties:
              committedUsd:
                type: number
              nteUsd:
                type: number
                description: Not-to-exceed ceiling (mirrors `committedUsd`).
              earnedUsd:
                type: number
              burnedUsd:
                type: number
                description: 'Total time-entry burn over the visible window
                  (sum of `weekly[].amountUsd`).'
              burnedPct:
                type: number
                description: '`burnedUsd / nteUsd`, clamped to [0,1].'
              invoicedUsd:
                type: number
              runwayDays:
                type: integer
                nullable: true
              avgWeeklyBurnUsd:
                type: number
                description: 'Trailing 4-week average burn rate. Used to size
                  the runway projection.'
              weekly:
                type: array
                description: 'Per-week time-entry burn series (last 26
                  weeks). The chart anchors every bar to ISO Monday so
                  it lines up regardless of when individual entries
                  were logged.'
                items:
                  type: object
                  required:
                  - weekStart
                  - hoursBilled
                  - amountUsd
                  - cumulativeUsd
                  properties:
                    weekStart:
                      type: string
                      format: date
                    hoursBilled:
                      type: number
                    amountUsd:
                      type: number
                    cumulativeUsd:
                      type: number
          linkedOpportunities:
            type: array
            description: |
              Open opportunities (`status='open'`) drafted by any
              lever whose `inputs.sowId` references this SOW. Empty
              list when no levers have flagged anything.
            items:
              $ref: '#/components/schemas/SowLinkedOpportunity'
          milestones:
            type: array
            items:
              $ref: '#/components/schemas/SowMilestone'
          changeOrders:
            type: array
            items:
              $ref: '#/components/schemas/SowChangeOrder'
    RateCard:
      type: object
      description: 'A negotiated rate card for a supplier. Powers the

        Services > Rate Cards tab.

        '
      required:
      - id
      - name
      - status
      - supplierId
      - supplierName
      - currency
      - lineCount
      - offCardSpendUsd
      - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - draft
          - active
          - expired
        supplierId:
          type: string
          nullable: true
        supplierName:
          type: string
          nullable: true
        msaContractId:
          type: string
          nullable: true
        currency:
          type: string
          description: ISO 4217 currency the lines are priced in.
        effectiveStart:
          type: string
          format: date-time
          nullable: true
        effectiveEnd:
          type: string
          format: date-time
          nullable: true
        lineCount:
          type: integer
        offCardSpendUsd:
          type: number
          description: 'Trailing-365d time-entry leakage: hours billed against
            this card whose `rate_card_line_id` is NULL (could not
            match any role/seniority on the card).'
        createdAt:
          type: string
          format: date-time
    RateCardListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RateCard'
        nextCursor:
          type: string
          nullable: true
    RateCardLine:
      type: object
      required:
      - id
      - role
      - unit
      - unitRate
      - unitRateUsd
      properties:
        id:
          type: string
        role:
          type: string
          description: Role / labour category (e.g. "Senior Consultant").
        seniority:
          type: string
          nullable: true
        skill:
          type: string
          nullable: true
        geography:
          type: string
          nullable: true
          description: Region / geography tag (e.g. "US", "EMEA", "India").
        billingModel:
          type: string
          nullable: true
          description: 'Commercial structure for the line: t_and_m,
            fixed, milestone, retainer, outcome.'
        unit:
          type: string
          description: Pricing unit, e.g. `hour`, `day`, `month`.
        unitRate:
          type: number
        unitRateUsd:
          type: number
        currency:
          type: string
          nullable: true
        marketBenchmark:
          type: object
          nullable: true
          description: 'Most-recent OEWS wage benchmark for this role/geography, if

            any. Drives the per-line colour band on the rate-card

            detail page (green ≤p50, yellow p50–p75, orange p75–p90,

            red >p90).

            '
          required:
          - band
          - source
          properties:
            band:
              type: string
              enum:
              - green
              - yellow
              - orange
              - red
            p50Usd:
              type: number
              nullable: true
            p75Usd:
              type: number
              nullable: true
            p90Usd:
              type: number
              nullable: true
            source:
              type: string
              description: Citation source code, e.g. `oews_wage`.
            observedAt:
              type: string
              format: date-time
              nullable: true
    RateCardOffCardEntry:
      type: object
      required:
      - id
      - workDate
      - role
      - hours
      - billedAmountUsd
      properties:
        id:
          type: string
        workDate:
          type: string
          format: date-time
        role:
          type: string
        seniority:
          type: string
          nullable: true
        hours:
          type: number
        unitRateUsd:
          type: number
          nullable: true
        billedAmount:
          type: number
          nullable: true
        billedAmountUsd:
          type: number
        currency:
          type: string
          nullable: true
        sowId:
          type: string
          nullable: true
        sowNumber:
          type: string
          nullable: true
    RateCardOffCardPoLine:
      type: object
      description: 'PO-line leakage row: a services-class purchase-order
        line booked against this card''s parent MSA contract whose
        unit price exceeds the highest hourly rate on the card (or
        any line if the card has no hourly rates). Each row carries
        source-document identifiers (PO number, supplier, category)
        the FE renders as deep links so the operator can pivot
        directly to the PO and supplier records.'
      required:
      - poLineId
      - poId
      - extendedUsd
      properties:
        poLineId:
          type: string
        poId:
          type: string
        poNumber:
          type: string
          nullable: true
        supplierId:
          type: string
          nullable: true
        supplierName:
          type: string
          nullable: true
        orderDate:
          type: string
          nullable: true
          description: ISO date (yyyy-mm-dd) of the PO line.
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        categoryName:
          type: string
          nullable: true
        unitPriceUsd:
          type: number
          nullable: true
        extendedUsd:
          type: number
        cardMaxHourlyUsd:
          type: number
          nullable: true
          description: 'Highest hourly rate on the card at query time
            (the threshold this line breached). Null when the card
            has no hourly rates — every services PO line on the
            parent contract is then flagged.'
    RateCardLineGridGroup:
      type: object
      description: 'A single role in the rate card laid out as a row of
        seniority cells. Powers the role × seniority grid on the
        rate-card detail page so an operator can sweep a full role
        ladder without scrolling a flat table.'
      required:
      - role
      - cells
      properties:
        role:
          type: string
        cells:
          type: array
          items:
            type: object
            required:
            - seniority
            - lineId
            - unitRateUsd
            - unit
            properties:
              seniority:
                type: string
                nullable: true
              geography:
                type: string
                nullable: true
              billingModel:
                type: string
                nullable: true
              lineId:
                type: string
              unitRateUsd:
                type: number
              unit:
                type: string
              band:
                type: string
                nullable: true
                enum:
                - green
                - yellow
                - orange
                - red
    RateCardLinkedOpportunity:
      type: object
      description: Open opportunity referencing this rate card.
      required:
      - id
      - leverId
      - status
      - title
      - projectedSavingsUsd
      - createdAt
      properties:
        id:
          type: string
        leverId:
          type: string
        status:
          type: string
        title:
          type: string
        projectedSavingsUsd:
          type: number
        createdAt:
          type: string
          format: date-time
    RateCardOffCardInvoice:
      type: object
      description: Invoice off-card row — a services-class invoice
        booked against this card's parent MSA contract that bypassed
        the rate-card line schedule.
      required:
      - invoiceId
      - amountUsd
      properties:
        invoiceId:
          type: string
        invoiceNumber:
          type: string
          nullable: true
        supplierId:
          type: string
          nullable: true
        supplierName:
          type: string
          nullable: true
        poId:
          type: string
          nullable: true
        poNumber:
          type: string
          nullable: true
        invoiceDate:
          type: string
          nullable: true
          description: ISO date (yyyy-mm-dd) of the invoice.
        status:
          type: string
          nullable: true
        amountUsd:
          type: number
    RateCardDetail:
      allOf:
      - $ref: '#/components/schemas/RateCard'
      - type: object
        required:
        - lines
        - linesByRole
        - recentOffCardEntries
        - recentOffCardPoLines
        - recentOffCardInvoices
        - linkedOpportunities
        - offCardPoMismatchUsd
        - offCardInvoiceUsd
        properties:
          offCardPoMismatchUsd:
            type: number
            description: 'Trailing-365d PO-line leakage: services-class PO
              lines booked against this card''s parent MSA contract
              whose `unit_price_usd` exceeds the highest hourly line
              on the card. Captures rate-card bypasses that never
              made it into a time entry. Combined with
              `offCardSpendUsd` this is the full leakage surface a
              category manager negotiates against. 0 when the card
              has no parent contract.'
          offCardInvoiceUsd:
            type: number
            description: 'Trailing-365d invoice off-card spend: invoices
              billed against POs on this card''s parent MSA contract
              over the past year. Captures direct-bill leakage that
              never went through a time entry or rate-card-aligned
              PO line. 0 when the card has no parent contract.'
          lines:
            type: array
            items:
              $ref: '#/components/schemas/RateCardLine'
          linesByRole:
            type: array
            description: 'Same lines as `lines`, but pivoted into a
              role-by-seniority grid so the FE can render a true
              ladder view without re-sorting.'
            items:
              $ref: '#/components/schemas/RateCardLineGridGroup'
          recentOffCardEntries:
            type: array
            description: Last 10 time entries that priced outside the card.
            items:
              $ref: '#/components/schemas/RateCardOffCardEntry'
          recentOffCardPoLines:
            type: array
            description: 'Per-line PO leakage rows (up to 50, ordered
              by extended USD desc). Each row carries source-document
              identifiers — PO number, supplier, category — that the
              FE renders as deep links so the operator can pivot
              into the originating PO/supplier records. Empty when
              the card has no parent contract or no breaching lines.'
            items:
              $ref: '#/components/schemas/RateCardOffCardPoLine'
          recentOffCardInvoices:
            type: array
            description: 'Per-invoice off-card listing (up to 50, ordered
              by amount desc). Surfaces invoice-level leakage so the
              operator can pivot into the source invoice. Empty when
              the card has no parent contract.'
            items:
              $ref: '#/components/schemas/RateCardOffCardInvoice'
          linkedOpportunities:
            type: array
            description: |
              Open opportunities (`status='open'`) drafted by the
              `services_rate_card_benchmark` lever (or any other
              services-side lever) whose `inputs.rateCardId` points at
              this card. Empty list when no benchmark levers have
              flagged anything.
            items:
              $ref: '#/components/schemas/RateCardLinkedOpportunity'
    ServicesSpendResponse:
