openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: 'Procurement RaaS API.


    Multi-tenant: every request is scoped to the active org via the

    `x-org-id` header. The development server defaults to the seeded

    SCIS Procurement org if the header is absent, but production callers

    must supply it. All list endpoints return only rows owned by that org.

    '
servers:
- url: /api
  description: Base API path
tags:
- name: health
  description: Health operations
- name: orgs
  description: Tenants the active user belongs to
- name: spend
  description: Aggregated spend overview
- name: suppliers
  description: Supplier directory
- name: opportunities
  description: Procurement opportunities (Tier-1+ levers)
- name: cycles
  description: OODA analysis cycles
- name: collectors
  description: External-intelligence collector registry
- name: market-signals
  description: External market signals
- name: intelligence
  description: 'Tenant-scoped Intelligence Fusion Center endpoints. All routes

    filter by the active tenant and respect the tenant''s

    `disclosurePolicy` server-side: T3/T4 signals are stripped before

    the wire for non-analyst policies.

    '
- name: jobs
  description: Async job runner
- name: ingest
  description: Ingestion endpoints (CSV / mock-ERP)
- name: integrations
  description: ERP / source-system connectors (Org-Admin gated)
- name: contracts
  description: Contracts directory + renewal calendar
- name: watched-issuers
  description: Tenant-curated list of corporate filers to poll (SEC EDGAR, UK Companies House)
- name: defense-packs
  description: 'Gemini-backed, citation-verified procurement memos for buyer

    negotiations. Every cited claim is traced back to a frozen

    `marketSignalsTable` row at generation time so the Evidence Room

    replay matches what the buyer took into the conversation.

    '
- name: trust
  description: Customer-facing trust posture (live controls, citations, compliance)
- name: alerts
  description: Alerts subsystem — inbox, channels, subscriptions, watchlists, rules, escalation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
      - health
      summary: Health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /orgs:
    get:
      operationId: listOrgs
      tags:
      - orgs
      summary: List tenants available to the active user
      responses:
        '200':
          description: Tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Org'
  /me:
    get:
      operationId: getMe
      tags:
      - orgs
      summary: Active tenant context
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Current tenant + actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
  /me/settings:
    patch:
      operationId: patchMeSettings
      tags:
      - orgs
      summary: Update tenant-wide preferences
      description: 'Update fields stored in the active tenant''s `orgs.settings` JSONB

        column. Currently exposes the disclosure policy; other keys in

        `settings` are preserved untouched. Returns the same shape as

        `GET /me` so clients can refresh their cached `MeResponse`.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMeSettingsRequest'
      responses:
        '200':
          description: Updated tenant context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
  /trust/summary:
    get:
      operationId: getTrustSummary
      tags:
      - trust
      summary: Live trust posture for the active tenant
      description: 'Returns the live data the in-app Trust Center page renders so a

        prospect''s compliance reviewer can self-serve a security review

        without a sales call. Tenant-scoped: every count, list, and

        status reflects the active org only — never cross-tenant

        aggregates. Available to every authenticated user (read).

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Trust posture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustSummary'
  /spend/overview:
    get:
      operationId: getSpendOverview
      tags:
      - spend
      summary: Spend overview (last 12 months)
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Aggregated spend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendOverview'
  /suppliers:
    get:
      operationId: listSuppliers
      tags:
      - suppliers
      summary: List suppliers
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: missing
        description: 'Filter to rows that are missing the named field. Used by the
          data-readiness card so its deep-links land on the exact gap. Unknown
          values are ignored.'
        schema:
          type: string
          enum:
          - billing_currency
          - payment_terms_days
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: query
        name: cursor
        schema:
          type: string
      responses:
        '200':
          description: Suppliers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierListResponse'
  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags:
      - suppliers
      summary: Supplier 360 detail (header + spend + contracts + opportunities + signals + audit)
      description: 'Returns a single supplier''s profile alongside the joined

        operator views the Supplier 360 page renders: trailing-365d

        spend rollup, the supplier''s active contract list, the

        opportunities whose lever stamped this supplier id, the FX

        rate history for the supplier''s billing currency (when set),

        and the inline-edit audit log.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Supplier detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchSupplier
      tags:
      - suppliers
      summary: Inline-edit supplier operator fields
      description: 'Update operator-controlled fields on a supplier:

        `billingCurrency`, `isStrategic`, `isPreferred`, `tags`, and

        `internalNotes`. Every changed field is recorded in the

        supplier audit log so reviewers can answer "who flagged this

        supplier strategic and when?". Returns the refreshed

        `SupplierDetail` so the UI re-renders in one round-trip.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSupplierRequest'
      responses:
        '200':
          description: Updated supplier detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /suppliers/{id}/intelligence:
    get:
      operationId: getSupplierIntelligence
      tags:
      - suppliers
      summary: External-intelligence signals matched to one supplier
      description: 'Returns the unified risk-and-filings timeline for a supplier — every

        market-signal row whose canonical `entity_uid` (CIK / LEI / Companies

        House / sanctions list id / ClimateTRACE owner / ...) matches the

        supplier OR whose `scope_supplier_name` matches the supplier name

        case-insensitively. Each signal is returned with its collector''s

        disclosure-tier `contract` so the Command Center can render

        attribution that respects `settings.disclosurePolicy`.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Risk & filings timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierIntelligenceResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /suppliers/{id}/billing-currency:
    post:
      operationId: overrideSupplierBillingCurrency
      tags:
      - suppliers
      summary: Manually override a supplier's billing currency
      description: 'Persists a `manual_override` for `suppliers.billing_currency`.

        Used by the Supplier 360 page when the auto-detected value is

        wrong, or to confirm a low/medium-confidence detection.


        Subsequent CSV re-uploads that omit the `billingCurrency`

        column will NOT clobber the override (the upsert uses

        `coalesce(excluded.billing_currency, ...)` to preserve it).

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingCurrencyOverrideRequest'
      responses:
        '200':
          description: Updated billing-currency state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCurrencyOverrideResponse'
        '400':
          description: Invalid billing currency
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /opportunities:
    get:
      operationId: listOpportunities
      tags:
      - opportunities
      summary: List opportunities, optionally filtered
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - in: query
        name: status
        schema:
          type: string
          enum:
          - proposed
          - approved
          - rejected
          - executing
          - realized
          - expired
      - in: query
        name: leverId
        schema:
          $ref: '#/components/schemas/LeverId'
      - in: query
        name: cycleId
        schema:
          type: string
      - in: query
        name: supplierId
        description: 'Restrict to opportunities scoped to one supplier. Matches both

          the canonical `supplier_id` column and the `inputs.supplierId`

          field that lever code stamps when a row is built without a

          normalised supplier link yet.

          '
        schema:
          type: string
      - in: query
        name: snoozed
        description: 'Filter on the snooze window. `exclude` (default) hides rows whose

          `snoozedUntil` is in the future — these are the rows that the

          Today page also hides. `only` returns just the currently-snoozed

          rows so the UI can render the "Snoozed" filter chip. `all`

          ignores the snooze column entirely.

          '
        schema:
          type: string
          enum:
          - exclude
          - only
          - all
          default: exclude
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      - in: query
        name: cursor
        schema:
          type: string
      responses:
        '200':
          description: Opportunities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityListResponse'
  /opportunities/bulk-approve:
    post:
      operationId: bulkApproveOpportunities
      tags:
      - opportunities
      summary: Approve a batch of pending opportunities in one call
      description: 'Single-shot bulk approve. The server processes every requested

        id, gates each by `opp:approve` permission, and skips rows whose

        current status is not `proposed` so the call is safe to retry.

        Each successful row writes one `decisions` audit event and the

        affected analysis cycles have their aggregates refreshed.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkApproveOpportunitiesRequest'
      responses:
        '200':
          description: Per-id outcome of the bulk approve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOpportunityActionResult'
  /opportunities/bulk-reject:
    post:
      operationId: bulkRejectOpportunities
      tags:
      - opportunities
      summary: Reject a batch of pending opportunities in one call
      description: 'Single-shot bulk reject. The structured rejection reason is

        applied to every successfully-rejected row and an audit event

        is written per row. Rows already in a non-`proposed` status are

        silently skipped via `skippedWrongStatus`.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRejectOpportunitiesRequest'
      responses:
        '200':
          description: Per-id outcome of the bulk reject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOpportunityActionResult'
  /opportunities/bulk-snooze:
    post:
      operationId: bulkSnoozeOpportunities
      tags:
      - opportunities
      summary: Snooze a batch of pending opportunities until a future date
      description: 'Snoozed rows stay in `proposed` status and remain visible on the

        snoozed-only filter, but disappear from the Today page Pending

        approvals card and from the default opportunities list view

        until `snoozedUntil` passes. Each affected row records a

        `snooze` event in the audit log.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSnoozeOpportunitiesRequest'
      responses:
        '200':
          description: Per-id outcome of the bulk snooze
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOpportunityActionResult'
  /opportunities/bulk-unsnooze:
    post:
      operationId: bulkUnsnoozeOpportunities
      tags:
      - opportunities
      summary: Clear the snooze deadline on a batch of opportunities
      description: 'Clears `snoozedUntil` so the rows become visible again on the

        Today page and the default opportunities list. Rows that have no

        snooze set (or that are not in `proposed` status) are silently

        skipped via `skippedWrongStatus`. Each affected row records an

        `unsnooze` event in the audit log.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUnsnoozeOpportunitiesRequest'
      responses:
        '200':
          description: Per-id outcome of the bulk unsnooze
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOpportunityActionResult'
  /opportunities/{id}:
    get:
      operationId: getOpportunity
      tags:
      - opportunities
      summary: Opportunity detail
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Opportunity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /opportunities/{id}/approve:
    post:
      operationId: approveOpportunity
      tags:
      - opportunities
      summary: Approve a pending opportunity
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveOpportunityRequest'
      responses:
        '200':
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
  /opportunities/{id}/reject:
    post:
      operationId: rejectOpportunity
      tags:
      - opportunities
      summary: Reject a pending opportunity (with structured reason)
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectOpportunityRequest'
      responses:
        '200':
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
  /opportunities/{id}/execute:
    post:
      operationId: executeOpportunity
      tags:
      - opportunities
      summary: Mark an approved opportunity as executing
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
  /opportunities/{id}/realize:
    post:
      operationId: realizeOpportunity
      tags:
      - opportunities
      summary: Record realized savings on an executing opportunity
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealizeOpportunityRequest'
      responses:
        '200':
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
  /cycles:
    get:
      operationId: listCycles
      tags:
      - cycles
      summary: List OODA analysis cycles (newest first)
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cycle'
  /cycles/{id}:
    get:
      operationId: getCycle
      tags:
      - cycles
      summary: Cycle detail incl. observe/orient/decide/act/learn payloads
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Cycle detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /cycles/run:
    post:
      operationId: runNextCycle
      tags:
      - cycles
      summary: Trigger the next OODA cycle
      description: 'Runs synchronously by default for the demo dataset. For F500-scale

        runs, pass `async=true` to enqueue the cycle on the background job

        queue and poll `/jobs/{id}` for progress and result.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - in: query
        name: async
        required: false
        schema:
          type: boolean
          default: false
        description: Enqueue as a background job and return a jobId.
      responses:
        '200':
          description: Synchronous cycle result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCycleResponse'
        '202':
          description: Job enqueued for async execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
  /priors:
    get:
      operationId: listLearnedPriors
      tags:
      - cycles
      summary: Learned priors per lever for the active tenant
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Priors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LearnedPrior'
  /collectors:
    get:
      operationId: listCollectors
      tags:
      - collectors
      summary: List registered intelligence collectors
      responses:
        '200':
          description: Collectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collector'
    post:
      operationId: registerCollector
      tags:
      - collectors
      summary: Register a new collector (or upsert an existing one)
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCollectorRequest'
      responses:
        '201':
          description: Collector registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorMutationResult'
  /collectors/{id}:
    patch:
      operationId: patchCollector
      tags:
      - collectors
      summary: Approve, disable, or rate-limit a collector
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCollectorRequest'
      responses:
        '200':
          description: Updated collector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorMutationResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /collectors/{id}/kill:
    post:
      operationId: killCollector
      tags:
      - collectors
      summary: Activate the kill switch for a collector
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Killed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorKillResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /collectors/{id}/unkill:
    post:
      operationId: unkillCollector
      tags:
      - collectors
      summary: Release the kill switch for a collector
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Unkilled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorKillResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /collectors/{id}/audit:
    get:
      operationId: listCollectorAudit
      tags:
      - collectors
      summary: Audit log for a collector (most-recent first, capped at 100)
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectorAuditEntry'
  /collectors/{id}/run:
    post:
      operationId: runCollector
      tags:
      - collectors
      summary: Run a collector once for the active tenant
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Collector run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorRunResult'
  /collectors/ecb-fx-rates/backfill:
    post:
      operationId: backfillEcbFxRates
      tags:
      - collectors
      summary: 'Backfill historical ECB FX reference rates (one-shot, idempotent).

        '
      description: 'Fetches the ECB historical archive (`eurofxref-hist.xml`, ~5 years

        back) and writes one `fx_rate` MarketSignal per (day × tracked

        currency × EUR/USD base). Re-running is safe: rows that already

        exist for the same `(scope_material_code, observed_at)` are skipped.

        '
      responses:
        '200':
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorBackfillResult'
        '409':
          description: Collector is killed or not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /collectors/fred-economic-index/backfill:
    post:
      operationId: backfillFredEconomicIndex
      tags:
      - collectors
      summary: 'Backfill historical FRED PPI economic-index observations

        (one-shot, idempotent).

        '
      description: 'Walks every series in the curated FRED PPI list, fetches the last

        ~5 years of observations from the FRED API, and writes one

        `economic_index` MarketSignal per (series × observed_at).

        Re-running is safe: rows that already exist for the same

        `(signal_type, scope_*, observed_at)` are skipped. The regular

        daily collector cron is unaffected — it still fetches latest only.

        '
      responses:
        '200':
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorBackfillResult'
        '409':
          description: 'Collector is killed, not approved, or the `FRED_API_KEY` env

            var is not set.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /collectors/{id}/posture:
    get:
      operationId: getCollectorPosture
      tags:
      - collectors
      summary: 'Read the posture summary for a single collector.

        '
      description: 'Returns the same shape as `patchCollectorPosture` so the

        Posture tab can prefill its form (and any other tab can

        reuse the resolution) without round-tripping through

        `/collectors`. Tenant membership is required because the

        response includes the per-tenant `tenantOptedIn` resolution;

        admin gating is not applied — analysts may read.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Posture metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorPostureResult'
        '404':
          description: Collector not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: patchCollectorPosture
      tags:
      - collectors
      summary: 'Edit operator-managed posture metadata for a collector.

        '
      description: 'Lets a platform admin (`x-platform-admin-token`) edit the

        in-database fields backing the Posture & Compliance tab —

        notes (which double as the ToS link snapshot store) and

        per-tenant opt-in for the active tenant. Static contract

        fields like `postureClass`, `disclosureTier`, `jurisdiction`,

        and `retentionDays` live in code on the collector and are

        not editable here.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCollectorPostureRequest'
      responses:
        '200':
          description: Updated posture metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorPostureResult'
        '401':
          description: Missing or invalid platform-admin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/collectors/{id}/broadcast-posture:
    post:
      operationId: broadcastCollectorPosture
      tags:
      - collectors
      summary: 'Platform admin: broadcast a per-tenant opt-in decision for a

        collector to every org in one transaction.

        '
      description: 'Used when the platform team needs to roll a posture-related

        decision (typically a forced opt-out — e.g. a collector''s

        underlying source has flipped from `public-api` to a

        `tos_restricted` posture) across the entire fleet. Writes are

        wrapped in a single DB transaction so partial broadcasts can

        never happen, and a `tenant_opt_in_broadcast` audit row is

        emitted per affected tenant for forensic reconstruction.

        Only callable by platform admins (`x-platform-admin-token`);

        no `x-org-id` is required because the action targets all orgs.

        '
      parameters:
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastCollectorPostureRequest'
      responses:
        '200':
          description: Broadcast result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastCollectorPostureResult'
        '401':
          description: Missing or invalid platform-admin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collector not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/collectors/{id}/broadcast-posture/preview:
    get:
      operationId: previewBroadcastCollectorPosture
      tags:
      - collectors
      summary: 'Platform admin: preview tenant counts before broadcasting a posture.

        '
      description: 'Read-only sibling of POST `/admin/collectors/{id}/broadcast-posture`.

        The UI calls this when the operator opens the broadcast confirmation

        dialog so the dialog can show "this will affect N tenants — M opted

        in, K opted out, T no override" *before* the irreversible click.

        '
      parameters:
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Tenant breakdown for the broadcast preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastCollectorPosturePreview'
        '401':
          description: Missing or invalid platform-admin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collector not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /collectors/workbench/catalog:
    get:
      operationId: listCollectorCatalog
      tags:
      - collectors
      summary: Operator catalog view of every registered collector.
      description: 'Drives the Catalog tab. Returns one entry per registered

        collector enriched with the workbench-only metadata (ToS URL,

        license note, logo, cadence, scope kinds, output signal types)

        on top of the live registry row. Posture/disclosure/jurisdiction

        come from the collector contract; runtime fields like

        `lastRunAt` come from the DB.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Catalog entries
          content:
            application/json:
              schema:
                type: object
                required:
                - entries
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectorCatalogEntry'
  /collectors/workbench/source-health:
    get:
      operationId: listCollectorSourceHealth
      tags:
      - collectors
      summary: Source-health roll-up across collectors.
      description: 'For each collector, computes counts of recent successful runs,

        failures, fetch errors, and schema-drift events from the audit

        log and the schema-drift registry. Used by the Source Health

        tab and the bell-on-failure indicator in the sidebar.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - in: query
        name: lookbackHours
        schema:
          type: integer
          minimum: 1
          maximum: 720
          default: 168
      responses:
        '200':
          description: Source-health entries
          content:
            application/json:
              schema:
                type: object
                required:
                - entries
                - lookbackHours
                properties:
                  lookbackHours:
                    type: integer
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectorSourceHealthEntry'
  /collectors/workbench/lineage:
    get:
      operationId: getCollectorLineage
      tags:
      - collectors
      summary: Bipartite source → consumer lineage graph.
      description: 'Returns a static lineage graph linking each collector to the

        BigQuery tables it writes, the marts that read those tables,

        and the lever / fusion-center panes that consume them. Used

        by the Lineage tab and by audit "what citing what" overlays.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Lineage graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorLineageGraph'
  /collectors/workbench/coverage:
    get:
      operationId: getCollectorCoverage
      tags:
      - collectors
      summary: 'Material × jurisdiction coverage matrix vs the tenant''s spend.

        '
      description: 'For every canonical material code in scope-taxonomy, returns

        which collectors cover it (via signal scope) and which

        jurisdictions are present in the tenant''s supplier base. Used

        by the Coverage tab to surface gaps.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Coverage matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorCoverageMatrix'
  /collectors/workbench/cost:
    get:
      operationId: getCollectorCost
      tags:
      - collectors
      summary: Per-collector cost & throughput estimate.
      description: "Returns per-collector cost & throughput for the lookback window,\nchoosing the best available source in this priority order:\n  1. `billing` — real dollars from the GCP Cloud Billing\
        \ export\n     (set `GCP_BILLING_EXPORT_TABLE` to enable). Splits BigQuery\n     query/analysis cost from Cloud Storage cost; per-collector\n     attribution by `bytes_raw` share. Daily cache.\n\
        \  2. `bigquery` — on-demand-pricing estimate from\n     `collector_runs.bytes_raw × $5/TB`. No storage cost. Daily cache.\n  3. `proxy` — audit-log throughput proxy (rows pulled, runs in\n    \
        \ window) used when GCP isn't configured or the BQ query fails.\nThe response always carries a `source` discriminator so the UI can\nbadge the row honestly.\n"
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - in: query
        name: lookbackHours
        schema:
          type: integer
          minimum: 1
          maximum: 720
          default: 168
      responses:
        '200':
          description: Cost estimates
          content:
            application/json:
              schema:
                type: object
                required:
                - source
                - lookbackHours
                - entries
                properties:
                  source:
                    type: string
                    enum:
                    - proxy
                    - bigquery
                    - billing
                  lookbackHours:
                    type: integer
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectorCostEntry'
  /collectors/workbench/runs:
    get:
      operationId: listCollectorRunsAndErrors
      tags:
      - collectors
      summary: Recent runs and errors across collectors.
      description: 'Reads the audit log for the past `lookbackHours` and returns

        a flat, paginated stream of run starts/completions and fetch

        errors. Used by the Runs & Errors tab.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - in: query
        name: lookbackHours
        schema:
          type: integer
          minimum: 1
          maximum: 720
          default: 168
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 200
      - in: query
        name: collectorId
        schema:
          type: string
      - in: query
        name: onlyErrors
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                required:
                - entries
                - lookbackHours
                properties:
                  lookbackHours:
                    type: integer
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectorAuditEntry'
  /data-sources:
    get:
      operationId: listDataSources
      tags:
      - collectors
      summary: Client-facing list of opted-in data sources.
      description: 'The read-only client view at `/data-sources`. Filters the

        collector registry to entries that are enabled for the active

        tenant (resolved opt-in matrix) and projects only the

        client-safe fields: name, logo, license note, jurisdiction,

        cadence, disclosure tier, last refresh time. No posture-class

        or kill-criteria leakage.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Client data-source cards
          content:
            application/json:
              schema:
                type: object
                required:
                - entries
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClientDataSource'
  /market-signals:
    get:
      operationId: listMarketSignals
      tags:
      - market-signals
      summary: Recent market signals
      description: 'Returns market signals scoped to the active tenant plus any

        platform-wide (orgId IS NULL) signals. Supports filtering by signal

        type and scope so callers can pull a focused time-series — e.g.

        `signalType=fx_rate&scopeMaterialCode=EUR/USD` for an FX trend chart.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 50
      - in: query
        name: signalType
        description: 'Filter by signal type (e.g. `fx_rate`, `commodity_index`,

          `economic_index`).

          '
        schema:
          type: string
      - in: query
        name: scopeMaterialCode
        description: 'Filter by scope material code. For FX rates this is the currency

          pair (e.g. `EUR/USD`, `USD/JPY`). For BLS / FRED commodity PPI

          sub-series this is the canonical material code (e.g. `STEEL`,

          `LUMBER`).

          '
        schema:
          type: string
      - in: query
        name: scopeCategoryCode
        description: 'Filter by scope category code. Used for category-scoped

          economic-index sub-series (CPI, ECI, freight PPI, etc.) — e.g.

          `FOOD_AT_HOME`, `LABOR_TOTAL_COMP`, `FREIGHT`.

          '
        schema:
          type: string
      - in: query
        name: observedAfter
        description: 'Lower bound (inclusive) on `observedAt`. ISO-8601 datetime.

          '
        schema:
          type: string
          format: date-time
      - in: query
        name: observedBefore
        description: 'Upper bound (inclusive) on `observedAt`. ISO-8601 datetime.

          '
        schema:
          type: string
          format: date-time
      - in: query
        name: order
        description: 'Sort direction on `observedAt`. Defaults to `desc` so callers

          that just want "latest 50" keep working unchanged. Use `asc`

          when fetching a chart-friendly time-series.

          '
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketSignal'
  /jobs:
    get:
      operationId: listJobs
      tags:
      - jobs
      summary: List background jobs for the active tenant
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: query
        name: status
        schema:
          type: string
          enum:
          - pending
          - running
          - succeeded
          - failed
          - cancelled
      - in: query
        name: kind
        schema:
          type: string
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
  /jobs/settings:
    get:
      operationId: listJobKindSettings
      tags:
      - jobs
      summary: List effective per-kind retry budgets
      description: 'Returns one row per configurable job kind. `maxAttempts` is the

        effective retry budget (operator override if present, otherwise the

        in-code default). `isOverride` is `true` when the value comes from

        the `job_kind_settings` table, `false` when it falls back to the

        default. The pruner is intentionally excluded — it has no upstream

        API calls and does not benefit from operator tuning.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Per-kind retry-budget settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobKindSetting'
  /jobs/settings/{kind}:
    put:
      operationId: updateJobKindSetting
      tags:
      - jobs
      summary: Override the auto-retry budget for a single job kind
      description: 'Upserts an operator override into `job_kind_settings`. Takes effect

        on the next `enqueueJob` call; in-flight jobs keep the

        `max_attempts` value they were enqueued with so a mid-flight tweak

        does not change the budget of a job that is already retrying.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - in: path
        name: kind
        required: true
        schema:
          type: string
          enum:
          - ingest_csv
          - ingest_mock_erp
          - run_analysis_cycle
          - run_collector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobKindSettingRequest'
      responses:
        '200':
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobKindSetting'
        '400':
          description: Invalid kind or maxAttempts value
    delete:
      operationId: clearJobKindSetting
      tags:
      - jobs
      summary: Clear a per-tenant retry-budget override
      description: 'Removes the `job_kind_settings` row for this `(org, kind)` so the

        next `enqueueJob` call falls back to the in-code default.

        Idempotent: deleting an already-absent override returns 200 with

        the default values.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - in: path
        name: kind
        required: true
        schema:
          type: string
          enum:
          - ingest_csv
          - ingest_mock_erp
          - run_analysis_cycle
          - run_collector
      responses:
        '200':
          description: Cleared setting (now reflects in-code default)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobKindSetting'
        '400':
          description: Invalid kind
  /jobs/{id}:
    get:
      operationId: getJob
      tags:
      - jobs
      summary: Get an async job's status + result
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /jobs/{id}/retry:
    post:
      operationId: retryJob
      tags:
      - jobs
      summary: Re-enqueue a failed job as a new pending job
      description: 'Enqueues a fresh job of the same kind and payload as the original.

        Only jobs in the `failed` state may be retried.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '202':
          description: Retry job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '404':
          description: Job not found
        '409':
          description: Job is not in a retryable state
  /jobs/{id}/cancel:
    post:
      operationId: cancelJob
      tags:
      - jobs
      summary: Cancel a pending or running job
      description: "Cancels a job that is still `pending` or `running`.\n\n- `pending` jobs are immediately marked `cancelled` with the error\n  \"Cancelled by operator\".\n- `running` jobs have a cancellation\
        \ flag set; the worker rewrites\n  the terminal state to `cancelled` once the handler returns at its\n  next safe checkpoint.\n\n`cancelled` is a distinct status from `failed` — operator-initiated\n\
        stops are not infrastructure failures, and surfacing them as a\nseparate badge keeps incident dashboards accurate.\n\nAlready-terminal jobs (`succeeded` / `failed` / `cancelled`)\nreturn 409.\n"
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCancelled'
        '404':
          description: Job not found
        '409':
          description: Job is already in a terminal state
  /integrations/adapters:
    get:
      operationId: listErpAdapters
      tags:
      - integrations
      summary: List ERP adapter catalog (static metadata)
      description: 'Returns the registered ERP/source-system adapters with their

        T-tier disclosure metadata. Org-Admin gated.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Adapter catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpAdapterListResponse'
        '403':
          description: Caller is not an Org Admin
  /integrations/connections:
    get:
      operationId: listErpConnections
      tags:
      - integrations
      summary: List ERP connections for the active tenant
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpConnectionListResponse'
        '403':
          description: Caller is not an Org Admin
    post:
      operationId: createErpConnection
      tags:
      - integrations
      summary: Create a new ERP connection
      description: 'Credentials are AES-GCM encrypted at rest using

        `ERP_CREDENTIAL_ENCRYPTION_KEY` and never round-trip back over

        the wire. The response only exposes the field names (e.g.

        `clientId`, `clientSecret`) via `credentialFields`.

        '
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateErpConnectionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpConnectionResponse'
        '400':
          description: Invalid body / unknown adapter
        '403':
          description: Caller is not an Org Admin
        '409':
          description: Duplicate label for this tenant
  /integrations/connections/{id}:
    get:
      operationId: getErpConnection
      tags:
      - integrations
      summary: Get a single ERP connection
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpConnectionResponse'
        '404':
          description: Connection not found
    patch:
      operationId: updateErpConnection
      tags:
      - integrations
      summary: Update label / status / credentials / settings
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateErpConnectionRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpConnectionResponse'
        '400':
          description: Invalid body
        '404':
          description: Connection not found
    delete:
      operationId: deleteErpConnection
      tags:
      - integrations
      summary: Delete an ERP connection
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted
        '404':
          description: Connection not found
  /integrations/connections/{id}/sync:
    post:
      operationId: syncErpConnection
      tags:
      - integrations
      summary: Trigger a `sync_erp_connection` job for this connection
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '404':
          description: Connection not found
        '409':
          description: Connection is paused
        '429':
          description: Per-org job quota exceeded
  /integrations/test:
    post:
      operationId: testErpConnection
      tags:
      - integrations
      summary: Validate adapter credentials without persisting them
      parameters:
      - $ref: '#/components/parameters/OrgIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestErpConnectionRequest'
      responses:
        '200':
          description: Connection succeeded
