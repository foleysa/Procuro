    BulkOpportunityActionResult:
      type: object
      description: 'Outcome of a bulk action. The server processes every requested

        id and bucketises each into exactly one of the four counts.

        `succeeded` rows changed state and wrote a `decisions` audit

        event. `skippedNoPermission` rows were filtered out because the

        caller lacks `opp:approve` on that row''s tenant. `skippedWrongStatus`

        rows were not in the right precondition (e.g. trying to approve

        a row that is already `executing`, or unsnoozing a row that has

        no snooze set). `failed` rows hit a server-side error and were

        rolled back. The four counts always sum to the requested batch

        size.

        '
      required:
      - requested
      - succeeded
      - skippedNoPermission
      - skippedWrongStatus
      - failed
      - succeededIds
      properties:
        requested:
          type: integer
          minimum: 0
          description: Number of ids the caller asked the server to process.
        succeeded:
          type: integer
          minimum: 0
        skippedNoPermission:
          type: integer
          minimum: 0
        skippedWrongStatus:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        succeededIds:
          type: array
          description: Ids that successfully transitioned. Useful for the UI to
            update its local cache.
          items:
            type: string
    BulkApproveOpportunitiesRequest:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
        notes:
          type: string
          description: Optional approval notes applied to every successfully-approved
            row.
    BulkRejectOpportunitiesRequest:
      type: object
      required:
      - ids
      - reasonCode
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
        reasonCode:
          $ref: '#/components/schemas/RejectionReasonCode'
        reasonText:
          type: string
          description: Optional free-text rejection note applied to every
            successfully-rejected row.
    BulkSnoozeOpportunitiesRequest:
      type: object
      required:
      - ids
      - snoozedUntil
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
        snoozedUntil:
          type: string
          format: date-time
          description: 'Wall-clock deadline at which the snooze expires. Must be

            strictly in the future. The server clamps the maximum

            allowed snooze to 365 days so dropdown UIs cannot accidentally

            hide a row forever.

            '
    BulkUnsnoozeOpportunitiesRequest:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
