          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, running, succeeded, failed, cancelled]
        - in: query
          name: kind
          schema: { type: string }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /jobs/settings:
    get:
      operationId: listJobKindSettings
      tags: [jobs]
      summary: List effective per-kind retry budgets
      description: |
        Returns one row per configurable job kind. `maxAttempts` is the
        effective retry budget (operator override if present, otherwise the
        in-code default). `isOverride` is `true` when the value comes from
        the `job_kind_settings` table, `false` when it falls back to the
        default. The pruner is intentionally excluded — it has no upstream
        API calls and does not benefit from operator tuning.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Per-kind retry-budget settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobKindSetting"

  /jobs/settings/{kind}:
    put:
      operationId: updateJobKindSetting
      tags: [jobs]
      summary: Override the auto-retry budget for a single job kind
      description: |
        Upserts an operator override into `job_kind_settings`. Takes effect
        on the next `enqueueJob` call; in-flight jobs keep the
        `max_attempts` value they were enqueued with so a mid-flight tweak
        does not change the budget of a job that is already retrying.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [ingest_csv, ingest_mock_erp, run_analysis_cycle, run_collector]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobKindSettingRequest"
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobKindSetting"
        "400":
          description: Invalid kind or maxAttempts value
    delete:
      operationId: clearJobKindSetting
      tags: [jobs]
      summary: Clear a per-tenant retry-budget override
      description: |
        Removes the `job_kind_settings` row for this `(org, kind)` so the
        next `enqueueJob` call falls back to the in-code default.
        Idempotent: deleting an already-absent override returns 200 with
        the default values.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [ingest_csv, ingest_mock_erp, run_analysis_cycle, run_collector]
      responses:
        "200":
          description: Cleared setting (now reflects in-code default)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobKindSetting"
        "400":
          description: Invalid kind

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get an async job's status + result
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}/retry:
    post:
      operationId: retryJob
      tags: [jobs]
      summary: Re-enqueue a failed job as a new pending job
      description: |
        Enqueues a fresh job of the same kind and payload as the original.
        Only jobs in the `failed` state may be retried.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "202":
          description: Retry job enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "404":
          description: Job not found
        "409":
          description: Job is not in a retryable state

  /jobs/{id}/cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a pending or running job
      description: |
        Cancels a job that is still `pending` or `running`.

        - `pending` jobs are immediately marked `cancelled` with the error
          "Cancelled by operator".
        - `running` jobs have a cancellation flag set; the worker rewrites
          the terminal state to `cancelled` once the handler returns at its
          next safe checkpoint.

        `cancelled` is a distinct status from `failed` — operator-initiated
        stops are not infrastructure failures, and surfacing them as a
        separate badge keeps incident dashboards accurate.

        Already-terminal jobs (`succeeded` / `failed` / `cancelled`)
        return 409.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCancelled"
        "404":
          description: Job not found
        "409":
          description: Job is already in a terminal state

  /integrations/adapters:
