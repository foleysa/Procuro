          - expired
          - cancelled
        contractType:
          type: string
          enum:
          - goods
          - t_and_m
          - fixed_price
          - milestone
          - retainer
          - outcome
          description: 'Commercial structure of the contract. `goods` is the legacy

            default and back-fills any pre-#214 row. Anything other than

            `goods` is a services contract and unlocks the services-side

            UI (SOW list, rate cards, services KPIs).

            '
        msaParentId:
          type: string
          nullable: true
          description: 'Self-FK to the parent MSA when this row is itself a child

            agreement under a master agreement. Null for top-level

            contracts.

            '
        serviceLevelTerms:
          nullable: true
          description: 'Free-form SLA terms. Either a structured object

            (e.g. `{ uptimePct: 99.9, mttrHours: 4 }`) emitted by

            adapters or a partner''s verbatim text payload.

            '
        acceptanceCriteria:
          type: string
          nullable: true
          description: 'Plain-text acceptance criteria. Used on services contracts

            to document what "delivered" means at MSA level.

            '
        derivedStatus:
          $ref: '#/components/schemas/ContractDerivedStatus'
        daysToExpiry:
          type: integer
          nullable: true
          description: 'Whole days from now to `endDate`. Negative if already

            expired. Null when `endDate` is somehow missing.

            '
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        paymentTermsDays:
          type: integer
          nullable: true
        referenceIndex:
          type: string
          nullable: true
        billingCurrency:
          type: string
          nullable: true
        annualBaselineUsd:
          type: number
          nullable: true
        owner:
          type: string
          nullable: true
        internalNotes:
          type: string
          nullable: true
        renewalTargetDate:
          type: string
          format: date-time
          nullable: true
        renewalTargetAction:
          type: string
          nullable: true
        renewalAlertedThresholds:
          type: array
          items:
            type: integer
        sourceSystem:
          type: string
        sourceExternalId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
