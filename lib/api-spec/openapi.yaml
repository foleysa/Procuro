            '
        createdAt:
          type: string
          format: date-time
    OpportunityDetail:
      allOf:
      - $ref: '#/components/schemas/Opportunity'
      - type: object
        required:
        - sources
        properties:
          inputs:
            type: object
            additionalProperties: true
          sources:
            type: array
            description: 'Raw signal-source descriptors that backed this opportunity.

              The Command Center calls `renderInsight()` from

              `@workspace/intelligence/tier` on these and the active

              tenant''s `disclosurePolicy` to derive a tier-appropriate

              citation list for display.

              '
            items:
              $ref: '#/components/schemas/InsightSource'
          decisions:
            type: array
            items:
              $ref: '#/components/schemas/Decision'
    InsightSource:
      type: object
      description: 'A single signal-source descriptor backing an insight. Mirrors the

        `SignalSource` shape consumed by the disclosure-tier renderer in

        `@workspace/intelligence/tier`. The `contract` block carries the

        collector''s posture + disclosure metadata so the renderer can

        decide what (if anything) to surface to the user.

        '
      required:
      - collectorId
      - collectorName
      - sourceUrl
      - observedAt
      - contract
      properties:
        collectorId:
          type: string
        collectorName:
          type: string
        sourceUrl:
          type: string
        observedAt:
          type: string
          format: date-time
        contract:
          type: object
          required:
          - postureClass
          - disclosureTier
          - jurisdiction
          - retentionDays
          - tenantOptInDefault
          properties:
            postureClass:
              type: string
              enum:
              - public_api
              - tos_restricted
              - gray_hat
            disclosureTier:
              type: string
              enum:
              - T1
              - T2
              - T3
              - T4
            jurisdiction:
              type: string
            retentionDays:
              type: integer
            tenantOptInDefault:
              type: boolean
    OpportunityListResponse:
