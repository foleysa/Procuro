        title:
          type: string
        status:
          type: string
          enum:
          - draft
          - active
          - completed
          - cancelled
        supplierId:
          type: string
          nullable: true
        supplierName:
          type: string
          nullable: true
        msaContractId:
          type: string
          nullable: true
        msaContractNumber:
          type: string
          nullable: true
        msaContractTitle:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
