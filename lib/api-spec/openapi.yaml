          type: integer
        recordsCreated:
          type: integer
        recordsUpdated:
          type: integer
        recordsDeleted:
          type: integer
        cursor:
          type: string
          nullable: true
        durationMs:
          type: integer
    StreamCsvResult:
      type: object
      required:
      - entity
      - rowsParsed
      - rowsInserted
      - durationMs
      properties:
        entity:
          type: string
          enum:
          - suppliers
          - categories
          - items
          - purchase_orders
          - po_lines
          - invoices
          - payments
          - shipments
          - statements_of_work
          - rate_cards
          - rate_card_lines
          - time_entries
        rowsParsed:
          type: integer
        rowsInserted:
          type: integer
        durationMs:
          type: integer
    StreamCsvProgressEvent:
      type: object
      description: 'Intermediate progress event emitted (throttled to ~4/sec) while the

        server is still parsing and inserting rows.


        `bytesProcessed` is the running count of bytes the server has read

        off the upload stream so far. Combined with the file''s total size

        (known to the client), it lets the UI render a server-side progress

        bar and derive an ETA from the rows-per-second rate. It is optional

        because not every transport surfaces a meaningful byte count.

        '
      required:
      - type
      - rowsParsed
      - rowsInserted
      properties:
        type:
          type: string
          enum:
          - progress
        rowsParsed:
          type: integer
        rowsInserted:
          type: integer
        bytesProcessed:
          type: integer
    StreamCsvResultEvent:
      type: object
      description: 'Terminal success event emitted exactly once at the end of a

        successful stream. Carries the rolled-up counts.

        '
      required:
      - type
      - entity
      - rowsParsed
      - rowsInserted
      - durationMs
      properties:
        type:
          type: string
          enum:
          - result
        entity:
          type: string
          enum:
          - suppliers
          - categories
          - items
          - purchase_orders
          - po_lines
          - invoices
          - payments
          - shipments
          - statements_of_work
          - rate_cards
          - rate_card_lines
          - time_entries
        rowsParsed:
          type: integer
        rowsInserted:
          type: integer
        durationMs:
          type: integer
    StreamCsvErrorEvent:
      type: object
      description: 'Terminal failure event emitted exactly once when an error occurs

        after response headers have already been flushed (so the HTTP

        status cannot change). The HTTP status is still 200 in this case.

        '
      required:
      - type
      - error
      properties:
        type:
          type: string
          enum:
          - error
        error:
          type: string
    StreamCsvCancelledEvent:
      type: object
      description: 'Terminal cancellation event emitted exactly once when the client

        cancels the upload mid-flight (typically via `xhr.abort()`). The

        server detects the abort, stops flushing further batches to the

        database, and reports the partial counts that *did* commit.

        Distinct from `error` so clients can render a "Cancelled" state

        instead of a failure. The HTTP status remains 200.

        '
      required:
      - type
      - entity
      - rowsParsed
      - rowsInserted
      properties:
        type:
          type: string
          enum:
          - cancelled
        entity:
          type: string
          enum:
          - suppliers
          - categories
          - items
          - purchase_orders
          - po_lines
          - invoices
          - payments
          - shipments
          - statements_of_work
          - rate_cards
          - rate_card_lines
          - time_entries
        rowsParsed:
          type: integer
        rowsInserted:
          type: integer
    StreamCsvEvent:
      description: 'One NDJSON line emitted by `POST /ingest/csv-stream`.

        Use the `type` field to discriminate.

        '
      oneOf:
      - $ref: '#/components/schemas/StreamCsvProgressEvent'
      - $ref: '#/components/schemas/StreamCsvResultEvent'
      - $ref: '#/components/schemas/StreamCsvErrorEvent'
      - $ref: '#/components/schemas/StreamCsvCancelledEvent'
      discriminator:
        propertyName: type
        mapping:
          progress: '#/components/schemas/StreamCsvProgressEvent'
          result: '#/components/schemas/StreamCsvResultEvent'
          error: '#/components/schemas/StreamCsvErrorEvent'
          cancelled: '#/components/schemas/StreamCsvCancelledEvent'
