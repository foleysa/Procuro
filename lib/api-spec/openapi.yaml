          - expired
        title:
          type: string
        rationale:
          type: string
        recommendedAction:
          type: string
        supplierId:
          type: string
          nullable: true
        supplierName:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        categoryName:
          type: string
          nullable: true
        rawProjectedSavingsUsd:
