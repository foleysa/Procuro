    Job:
      type: object
      required:
      - id
      - kind
      - status
      - attempts
      - maxAttempts
      - enqueuedAt
      properties:
        id:
          type: string
        orgId:
          type: string
          nullable: true
        kind:
          type: string
        status:
          type: string
          enum:
          - pending
          - running
          - succeeded
          - failed
          - cancelled
          description: '`cancelled` is a distinct terminal state from `failed` and is

            only used for operator-initiated cancellations (it never

            results from infrastructure errors or exhausted retries).

            '
        attempts:
          type: integer
        maxAttempts:
          type: integer
          description: 'Total automatic-attempt budget (initial run + auto-retries).

            When `attempts` reaches this value the worker stops retrying

            and marks the job `failed`.

            '
        progress:
          type: integer
        result:
          type: object
          additionalProperties: true
          nullable: true
        error:
          type: string
          nullable: true
        cancelRequested:
          type: boolean
          description: 'True once an operator has requested cancellation. For `running`

            jobs the worker will rewrite the terminal state to `cancelled`

            with error "Cancelled by operator" once the handler returns.

            '
        enqueuedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        scheduledFor:
          type: string
          format: date-time
          nullable: true
          description: 'Earliest time the worker is allowed to claim this job again.

            Set to a future timestamp while a job is in retry-backoff

            after a transient failure; `null` means the job is ready to

            run immediately (the common case).

            '
    JobKindSetting:
      type: object
      required:
      - kind
      - maxAttempts
      - defaultMaxAttempts
      - isOverride
      properties:
        kind:
          type: string
          enum:
          - ingest_csv
          - ingest_mock_erp
          - run_analysis_cycle
          - run_collector
        maxAttempts:
          type: integer
          minimum: 1
          description: 'Effective auto-retry budget for this kind: operator override if

            one is set, otherwise the in-code default.

            '
        defaultMaxAttempts:
          type: integer
          minimum: 1
          description: 'The in-code default for this kind. Shown in the UI so operators

            can see what value the system would fall back to if the

            override were removed.

            '
        isOverride:
          type: boolean
          description: 'True when `maxAttempts` comes from the `job_kind_settings`

            table; false when it falls back to `defaultMaxAttempts`.

            '
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the override was last written. Null when there is no override.
        lastChangedBy:
          type: string
          nullable: true
          description: 'Email/identifier of the operator who most recently wrote this

            override. Null when no override exists, or when the override

            was created before audit columns were introduced.

            '
        lastChangedAt:
          type: string
          format: date-time
          nullable: true
          description: 'Wall-clock timestamp of the most recent override write.

            Mirrors `updatedAt` for new writes but is set explicitly so

            it stays accurate across upsert paths.

            '
    UpdateJobKindSettingRequest:
      type: object
      required:
      - maxAttempts
      properties:
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 100
    JobCancelled:
      type: object
      required:
      - jobId
      - status
      - cancelRequested
      - cancelledImmediately
      properties:
        jobId:
          type: string
        status:
          type: string
          enum:
          - running
          - cancelled
          description: '`cancelled` when the job was `pending` and was transitioned

            immediately, `running` when the cancel flag was set on a

            running job (the worker will mark it cancelled when the

            handler returns).

            '
        cancelRequested:
          type: boolean
          description: Always true on a successful response.
        cancelledImmediately:
          type: boolean
          description: 'True if the job was pending and is now marked cancelled;

            false if the job was running and the cancel flag was set

            (the worker will finalize the cancellation on the next safe

            checkpoint).

            '
    SystemCleanupStatus:
      type: object
      required:
      - lastJob
      - activeJobId
      - retention
      properties:
        lastJob:
          nullable: true
          type: object
          required:
          - id
          - status
          - enqueuedAt
          properties:
            id:
              type: string
            status:
              type: string
              enum:
              - pending
              - running
              - succeeded
              - failed
              - cancelled
            enqueuedAt:
              type: string
              format: date-time
            startedAt:
              type: string
              format: date-time
              nullable: true
            completedAt:
              type: string
              format: date-time
              nullable: true
            result:
              type: object
              additionalProperties: true
              nullable: true
            error:
              type: string
              nullable: true
        activeJobId:
          type: string
          nullable: true
          description: 'ID of an in-flight `prune_jobs` row (status pending or

            running), or null when no prune is scheduled. The UI uses

            this to disable the "Run cleanup now" button while a prune

            is already queued.

            '
        retention:
          type: object
          required:
          - succeededOlderThanMs
          - failedOlderThanMs
          properties:
            succeededOlderThanMs:
              type: integer
            failedOlderThanMs:
              type: integer
              description: 'Retention window for both `failed` and `cancelled` jobs.

                Operator-cancelled jobs share the failed window because

                they''re equivalent "did not succeed" terminal rows for

                review purposes.

                '
    SystemFunnelSnapshotCleanupStatus:
      type: object
      required:
      - lastJob
      - activeJobId
      - retention
      properties:
        lastJob:
          nullable: true
          type: object
          required:
          - id
          - status
          - enqueuedAt
          properties:
            id:
              type: string
            status:
              type: string
              enum:
              - pending
              - running
              - succeeded
              - failed
              - cancelled
            enqueuedAt:
              type: string
              format: date-time
            startedAt:
              type: string
              format: date-time
              nullable: true
            completedAt:
              type: string
              format: date-time
              nullable: true
            result:
              type: object
              additionalProperties: true
              nullable: true
            error:
              type: string
              nullable: true
        activeJobId:
          type: string
          nullable: true
          description: 'ID of an in-flight `prune_funnel_snapshots` row (status

            pending or running), or null when no prune is scheduled.

            '
        retention:
          type: object
          required:
          - snapshotsOlderThanMs
          - failuresOlderThanMs
          properties:
            snapshotsOlderThanMs:
              type: integer
              description: 'Snapshots in `funnel_snapshots` (and their cascading

                `funnel_annotations`) older than this window get pruned

                on each daily run.

                '
            failuresOlderThanMs:
              type: integer
              description: 'Rows in `funnel_snapshot_failures` older than this

                window get pruned on each daily run.

                '
    SystemCleanupRunAccepted:
      type: object
      required:
      - jobId
      - status
      - reused
      properties:
        jobId:
          type: string
          nullable: true
          description: 'ID of the `prune_jobs` row that will (or already does)

            handle this request. Null only in the rare race where the

            in-flight job completed between the two queries.

            '
        status:
          type: string
          enum:
          - pending
          - running
          - succeeded
          - failed
          - cancelled
        reused:
          type: boolean
          description: 'True when an existing in-flight prune job satisfied the

            request; false when a new job was enqueued.

            '
    SyncResultResponse:
      type: object
      required:
      - recordsProcessed
      - recordsCreated
      - recordsUpdated
      - durationMs
      properties:
