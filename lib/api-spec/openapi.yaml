      description: |
        Composes collectors, jobs (last 24h), data sources, integrations, and
        funnel snapshot failures into a single fail-soft rollup. Per-source
        failures populate `errors[]` and set `partial=true` rather than failing
        the response. No persistence; per-request cache only.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Operations health rollup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsHealth"

components:
  parameters:
    OrgIdHeader:
      in: header
      name: x-org-id
      required: false
      schema:
        type: string
      description: 'Tenant ID hint. In production, requests MUST present

        `Authorization: Bearer <token>` and `x-org-id` (if supplied) must

        match the org bound to that token. In development, this header is

        accepted standalone.

        '
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 'Per-tenant API token. The plaintext token is sha256-hashed server-side

        and matched against `org_api_tokens.token_hash` to derive the active

        tenant scope. Required in production; optional in development.

        '
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthStatus:
      type: object
      required:
      - status
      - timestamp
      properties:
        status:
          type: string
          enum:
          - ok
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
        details: {}
    Org:
      type: object
      required:
      - id
      - slug
      - name
      - createdAt
      - disclosurePolicy
      - contractRenewalAlertDays
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        successFeePct:
          type: number
          description: Default contingency fee on realized savings
        disclosurePolicy:
          $ref: '#/components/schemas/DisclosurePolicy'
        contractRenewalAlertDays:
          type: integer
          minimum: 1
          description: 'Days-to-expiry threshold used by the renewal-alert worker.

            Defaults to 90 when not explicitly set in `orgs.settings`.

            '
        createdAt:
          type: string
          format: date-time
    DisclosurePolicy:
      type: string
      description: 'Per-tenant insight-citation disclosure policy. Controls which

        intelligence-source tiers are surfaced when rendering an insight

        via the disclosure-tier renderer. `conservative` only shows T1+T2

        attributions, `standard` adds T3 (class label + confidence) and

        `analyst` shows full provenance for every tier including T4.

        '
      enum:
      - conservative
      - standard
      - analyst
    MeResponse:
      type: object
      required:
      - org
      - user
      properties:
        org:
          $ref: '#/components/schemas/Org'
        actorEmail:
          type: string
        user:
          $ref: '#/components/schemas/MeUser'
    PatchMeSettingsRequest:
      type: object
      description: 'Partial update for `orgs.settings`. Every property is optional;

        unspecified keys are left untouched on the stored JSONB.

        '
      properties:
        disclosurePolicy:
          $ref: '#/components/schemas/DisclosurePolicy'
        contractRenewalAlertDays:
          type: integer
          minimum: 1
          maximum: 365
          description: 'Days-to-expiry threshold the daily renewal-alert worker uses

            to surface a contract as a renewal alert. Default 90.

            '
    LeverId:
      type: string
      enum:
      - sku_price_benchmark
      - maverick_spend
      - contract_leakage
      - duplicate_payment
      - missed_volume_threshold
      - payment_term_extension
      - tail_spend_rationalization
      - supplier_consolidation
      - contract_renegotiation_trigger
      - spot_vs_contract
      - supplier_fx_exposure
      - material_index_arbitrage

    ReadinessBlocker:
      type: object
      required: [id, field, message, missingPct, missingCount, totalCount, fixUrl, hard]
      properties:
        id: { type: string, description: "Stable id, e.g. `suppliers.billing_currency`." }
        field: { type: string, description: "Operator-readable field name." }
        message: { type: string }
        missingPct: { type: integer, minimum: 0, maximum: 100 }
        missingCount: { type: integer, minimum: 0 }
        totalCount: { type: integer, minimum: 0 }
        fixUrl: { type: string, description: "Deep-link to the page that fixes the gap." }
        hard:
          type: boolean
          description: "True when this blocker fully prevents the lever from running."

    LeverReadiness:
      type: object
      required: [leverId, label, tier, score, blockers]
      properties:
        leverId: { $ref: "#/components/schemas/LeverId" }
        label: { type: string }
        tier: { type: integer, minimum: 1, maximum: 5 }
        score: { type: integer, minimum: 0, maximum: 100 }
        blockers:
          type: array
          items: { $ref: "#/components/schemas/ReadinessBlocker" }

    ReadinessResponse:
      type: object
      required: [overallScore, hasIngestedData, sampleDataInstalled, levers]
      properties:
        overallScore: { type: integer, minimum: 0, maximum: 100 }
        hasIngestedData:
          type: boolean
          description: "False when no contracts/POs/invoices exist yet for the tenant."
        sampleDataInstalled:
          type: boolean
          description: "True when the curated synthetic dataset is currently loaded."
        levers:
          type: array
          items: { $ref: "#/components/schemas/LeverReadiness" }

    OnboardingWizardStep:
      type: string
      enum:
        - welcome
        - bring_data
        - map_categories
        - invite_team
        - configure_settings
        - run_first_cycle
        - completed

    CompletedOnboardingStep:
      type: object
      required: [step, completedAt]
      properties:
        step: { $ref: "#/components/schemas/OnboardingWizardStep" }
        completedAt: { type: string, format: date-time }

    OnboardingState:
      type: object
      required: [currentStep, completedSteps, startedAt, updatedAt, dismissed, completed]
      properties:
        currentStep: { $ref: "#/components/schemas/OnboardingWizardStep" }
        completedSteps:
          type: array
          items: { $ref: "#/components/schemas/CompletedOnboardingStep" }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        dismissedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        dismissed: { type: boolean }
        completed: { type: boolean }

    PatchOnboardingStateRequest:
      type: object
      description: |
        Partial update for the actor's wizard row. Any subset of fields
        may be supplied. Setting `completedStep` appends an entry to the
        `completedSteps` array; setting `dismissed: true` stamps a
        `dismissedAt`. When `completedStep` is supplied together with
        `skipped: true`, the audit log records `step_skipped` instead of
        `step_completed` so CS can spot the drop-off pattern.
      properties:
        currentStep: { $ref: "#/components/schemas/OnboardingWizardStep" }
        completedStep: { $ref: "#/components/schemas/OnboardingWizardStep" }
        skipped: { type: boolean }
        dismissed: { type: boolean }
        completed: { type: boolean }

    SampleDataCounts:
      type: object
      required:
        - suppliers
        - categories
        - items
        - contracts
        - purchaseOrders
        - poLines
        - invoices
        - payments
      properties:
        suppliers: { type: integer, minimum: 0 }
        categories: { type: integer, minimum: 0 }
        items: { type: integer, minimum: 0 }
        contracts: { type: integer, minimum: 0 }
        purchaseOrders: { type: integer, minimum: 0 }
        poLines: { type: integer, minimum: 0 }
        invoices: { type: integer, minimum: 0 }
        payments: { type: integer, minimum: 0 }

    SampleDataResult:
      type: object
      required: [installed, removed, counts]
      properties:
        installed:
          type: boolean
          description: "True if this call inserted rows; false if rows already existed (idempotent)."
        removed:
          type: boolean
          description: "True if this call deleted rows; false if no sample data was present."
        counts:
          $ref: "#/components/schemas/SampleDataCounts"

    RejectionReasonCode:
      type: string
      enum:
      - supplier_strategic_do_not_consolidate
      - supplier_dei_or_diverse_program
      - compliance_or_legal_block
      - quality_risk_too_high
      - timing_blocked_by_business
      - savings_overstated
      - already_actioned
      - other
    SpendOverview:
      type: object
      required:
      - totalSpendUsd
      - byClass
      - byCategory
      - bySupplier
