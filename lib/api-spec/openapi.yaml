      - status
      - runs
      - failures
      - fetchErrors
      properties:
        collectorId:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - enabled
          - disabled
          - killed
        runs:
          type: integer
        failures:
          type: integer
        fetchErrors:
          type: integer
        schemaDriftEvents:
          type: integer
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        lastFailureAt:
          type: string
          format: date-time
          nullable: true
        lastSchemaDriftAt:
          type: string
          format: date-time
          nullable: true
        lastNonEmptyRunAt:
          type: string
          format: date-time
          nullable: true
          description: 'Timestamp of the most recent successful run whose

            `metadata.inserted` was greater than zero. Null when no

            run in the lookback window landed any rows.

            '
        staleEmptyRuns:
          type: boolean
          description: 'True when the collector is still running (recent

            success_at) but has not produced any new rows for ≥ 48h.

            The Source Health tab surfaces this as a yellow chip so

            operators can investigate silent upstream stalls before

            they become outages.

            '
        rawLandingFailures:
          type: integer
          description: 'Count of `raw_landing_failed` audit events in the

            lookback window — one per failed GCS upload of a raw

            payload. The runtime catches these failures so Postgres

            and BigQuery still receive the parsed rows, but every BQ

            row from a failed-landing run carries a null

            `raw_payload_pointer`, severing the only link back to the

            upstream bytes for replay tooling and parser-fix back-tests.

            The Source Health tab badges any non-zero value in red so

            operators notice a sustained landing outage.

            '
        lastRawLandingFailedAt:
          type: string
          format: date-time
          nullable: true
          description: 'Timestamp of the most recent `raw_landing_failed`

            audit event. Null when no GCS landing has failed in the

            lookback window.

            '
        recentDrifts:
          type: array
          items:
            type: object
            required:
            - signalType
            - observedAt
            properties:
              signalType:
                type: string
              observedAt:
                type: string
                format: date-time
              addedKeysCount:
                type: integer
              removedKeysCount:
                type: integer
              changedKeys:
                type: array
                items:
                  type: string
        healthScore:
          type: integer
          description: 0-100 (100 = clean, 0 = all runs failing).
