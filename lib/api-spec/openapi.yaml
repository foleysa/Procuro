      - observedAt
      - contract
      properties:
        collectorId:
          type: string
        collectorName:
          type: string
        sourceUrl:
          type: string
        observedAt:
          type: string
          format: date-time
        contract:
          type: object
          required:
          - postureClass
          - disclosureTier
          - jurisdiction
          - retentionDays
          - tenantOptInDefault
          properties:
            postureClass:
              type: string
              enum:
              - public_api
              - tos_restricted
              - gray_hat
            disclosureTier:
              type: string
              enum:
              - T1
              - T2
              - T3
              - T4
            jurisdiction:
              type: string
            retentionDays:
              type: integer
            tenantOptInDefault:
              type: boolean
    OpportunityListResponse:
