        p50RowsPerSecond:
          type: integer
        p95RowsPerSecond:
          type: integer
        days:
          type: array
          items:
            $ref: '#/components/schemas/CsvIngestEntityDay'
    CsvJobThroughputBucket:
      type: object
      description: 'Hour-aligned rollup of `ingest_csv` job samples. Empty hours
        render as zero-sample buckets so the chart keeps a stable X
        axis.

        '
      required:
      - hour
      - sampleCount
      - totalRows
      - p50LatencyMs
      - p95LatencyMs
      - p50RowsPerSecond
      - p95RowsPerSecond
      properties:
        hour:
          type: string
          format: date-time
          description: ISO timestamp for the start of the UTC hour the bucket covers.
        sampleCount:
          type: integer
          description: Number of succeeded `ingest_csv` jobs that fell in the bucket.
        totalRows:
          type: integer
          description: Total rows processed across the bucket.
        p50LatencyMs:
          type: integer
          description: Median per-job latency in milliseconds (0 when no samples).
        p95LatencyMs:
          type: integer
          description: 95th-percentile per-job latency in milliseconds (0 when no
            samples).
        p50RowsPerSecond:
          type: integer
          description: Median rows/sec across the bucket's jobs (0 when no samples).
        p95RowsPerSecond:
          type: integer
          description: 95th-percentile rows/sec across the bucket's jobs (0 when
            no samples).
    SystemCsvThroughputHistory:
      type: object
      required:
      - windowHours
      - buckets
      - totalSampleCount
      properties:
        windowHours:
          type: integer
          description: Trailing window size, in hours, that `buckets` spans.
        buckets:
          type: array
          description: 'Hourly buckets, oldest → newest. Always `windowHours` long
            so empty hours still render as zero on the chart.

            '
          items:
            $ref: '#/components/schemas/CsvJobThroughputBucket'
        totalSampleCount:
          type: integer
          description: Sum of `sampleCount` across all buckets in the window.
    SyncResultResponse:
      type: object
      required:
      - recordsProcessed
      - recordsCreated
      - recordsUpdated
      - durationMs
      properties:
        recordsProcessed:
          type: integer
        recordsCreated:
          type: integer
        recordsUpdated:
          type: integer
        recordsDeleted:
          type: integer
        cursor:
          type: string
          nullable: true
        durationMs:
          type: integer
    StreamCsvResult:
      type: object
      required:
      - entity
      - rowsParsed
      - rowsInserted
      - durationMs
      properties:
        entity:
          type: string
          enum:
          - suppliers
          - categories
          - items
          - purchase_orders
          - po_lines
          - invoices
          - payments
          - shipments
          - statements_of_work
          - rate_cards
          - rate_card_lines
          - time_entries
        rowsParsed:
          type: integer
        rowsInserted:
          type: integer
        durationMs:
          type: integer
    StreamCsvProgressEvent:
      type: object
      description: 'Intermediate progress event emitted (throttled to ~4/sec) while the

        server is still parsing and inserting rows.


        `bytesProcessed` is the running count of bytes the server has read

        off the upload stream so far. Combined with the file''s total size

        (known to the client), it lets the UI render a server-side progress

        bar and derive an ETA from the rows-per-second rate. It is optional

        because not every transport surfaces a meaningful byte count.

        '
      required:
      - type
      - rowsParsed
      - rowsInserted
      properties:
        type:
          type: string
          enum:
          - progress
        rowsParsed:
          type: integer
        rowsInserted:
          type: integer
        bytesProcessed:
          type: integer
    StreamCsvResultEvent:
      type: object
      description: 'Terminal success event emitted exactly once at the end of a

        successful stream. Carries the rolled-up counts.

        '
      required:
      - type
      - entity
      - rowsParsed
      - rowsInserted
      - durationMs
      properties:
        type:
          type: string
          enum:
          - result
        entity:
          type: string
          enum:
          - suppliers
          - categories
          - items
          - purchase_orders
          - po_lines
          - invoices
          - payments
          - shipments
          - statements_of_work
          - rate_cards
          - rate_card_lines
          - time_entries
        rowsParsed:
          type: integer
        rowsInserted:
          type: integer
        durationMs:
          type: integer
    StreamCsvErrorEvent:
      type: object
      description: 'Terminal failure event emitted exactly once when an error occurs

        after response headers have already been flushed (so the HTTP

        status cannot change). The HTTP status is still 200 in this case.

        '
      required:
      - type
      - error
      properties:
        type:
          type: string
          enum:
          - error
        error:
          type: string
    StreamCsvCancelledEvent:
      type: object
      description: 'Terminal cancellation event emitted exactly once when the client

        cancels the upload mid-flight (typically via `xhr.abort()`). The

        server detects the abort, stops flushing further batches to the

        database, and reports the partial counts that *did* commit.

        Distinct from `error` so clients can render a "Cancelled" state

        instead of a failure. The HTTP status remains 200.

        '
      required:
      - type
      - entity
      - rowsParsed
      - rowsInserted
      properties:
        type:
          type: string
          enum:
          - cancelled
        entity:
          type: string
          enum:
          - suppliers
          - categories
          - items
          - purchase_orders
          - po_lines
          - invoices
          - payments
          - shipments
          - statements_of_work
          - rate_cards
          - rate_card_lines
          - time_entries
        rowsParsed:
          type: integer
        rowsInserted:
          type: integer
    StreamCsvEvent:
      description: 'One NDJSON line emitted by `POST /ingest/csv-stream`.

        Use the `type` field to discriminate.

        '
      oneOf:
      - $ref: '#/components/schemas/StreamCsvProgressEvent'
      - $ref: '#/components/schemas/StreamCsvResultEvent'
      - $ref: '#/components/schemas/StreamCsvErrorEvent'
      - $ref: '#/components/schemas/StreamCsvCancelledEvent'
      discriminator:
        propertyName: type
        mapping:
          progress: '#/components/schemas/StreamCsvProgressEvent'
          result: '#/components/schemas/StreamCsvResultEvent'
          error: '#/components/schemas/StreamCsvErrorEvent'
          cancelled: '#/components/schemas/StreamCsvCancelledEvent'
