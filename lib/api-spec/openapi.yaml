openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    Procurement RaaS API.

    Multi-tenant: every request is scoped to the active org via the
    `x-org-id` header. The development server defaults to the seeded
    SCIS Procurement org if the header is absent, but production callers
    must supply it. All list endpoints return only rows owned by that org.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orgs
    description: Tenants the active user belongs to
  - name: spend
    description: Aggregated spend overview
  - name: suppliers
    description: Supplier directory
  - name: opportunities
    description: Procurement opportunities (Tier-1+ levers)
  - name: cycles
    description: OODA analysis cycles
  - name: collectors
    description: External-intelligence collector registry
  - name: market-signals
    description: External market signals
  - name: intelligence
    description: |
      Tenant-scoped Intelligence Fusion Center endpoints. All routes
      filter by the active tenant and respect the tenant's
      `disclosurePolicy` server-side: T3/T4 signals are stripped before
      the wire for non-analyst policies.
  - name: jobs
    description: Async job runner
  - name: ingest
    description: Ingestion endpoints (CSV / mock-ERP)
  - name: integrations
    description: ERP / source-system connectors (Org-Admin gated)
  - name: contracts
    description: Contracts directory + renewal calendar
  - name: watched-issuers
    description: Tenant-curated list of corporate filers to poll (SEC EDGAR, UK Companies House)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /orgs:
    get:
      operationId: listOrgs
      tags: [orgs]
      summary: List tenants available to the active user
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Org"

  /me:
    get:
      operationId: getMe
      tags: [orgs]
      summary: Active tenant context
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Current tenant + actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

  /me/settings:
    patch:
      operationId: patchMeSettings
      tags: [orgs]
      summary: Update tenant-wide preferences
      description: |
        Update fields stored in the active tenant's `orgs.settings` JSONB
        column. Currently exposes the disclosure policy; other keys in
        `settings` are preserved untouched. Returns the same shape as
        `GET /me` so clients can refresh their cached `MeResponse`.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMeSettingsRequest"
      responses:
        "200":
          description: Updated tenant context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

  /spend/overview:
    get:
      operationId: getSpendOverview
      tags: [spend]
      summary: Spend overview (last 12 months)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Aggregated spend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendOverview"

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List suppliers
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Suppliers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierListResponse"

  /suppliers/{id}/intelligence:
    get:
      operationId: getSupplierIntelligence
      tags: [suppliers]
      summary: External-intelligence signals matched to one supplier
      description: |
        Returns the unified risk-and-filings timeline for a supplier — every
        market-signal row whose canonical `entity_uid` (CIK / LEI / Companies
        House / sanctions list id / ClimateTRACE owner / ...) matches the
        supplier OR whose `scope_supplier_name` matches the supplier name
        case-insensitively. Each signal is returned with its collector's
        disclosure-tier `contract` so the Command Center can render
        attribution that respects `settings.disclosurePolicy`.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Risk & filings timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierIntelligenceResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: List opportunities, optionally filtered
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: status
          schema:
            type: string
            enum:
              [proposed, approved, rejected, executing, realized, expired]
        - in: query
          name: leverId
          schema:
            $ref: "#/components/schemas/LeverId"
        - in: query
          name: cycleId
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityListResponse"

  /opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [opportunities]
      summary: Opportunity detail
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /opportunities/{id}/approve:
    post:
      operationId: approveOpportunity
      tags: [opportunities]
      summary: Approve a pending opportunity
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveOpportunityRequest"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /opportunities/{id}/reject:
    post:
      operationId: rejectOpportunity
      tags: [opportunities]
      summary: Reject a pending opportunity (with structured reason)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectOpportunityRequest"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /opportunities/{id}/execute:
    post:
      operationId: executeOpportunity
      tags: [opportunities]
      summary: Mark an approved opportunity as executing
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /opportunities/{id}/realize:
    post:
      operationId: realizeOpportunity
      tags: [opportunities]
      summary: Record realized savings on an executing opportunity
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealizeOpportunityRequest"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /cycles:
    get:
      operationId: listCycles
      tags: [cycles]
      summary: List OODA analysis cycles (newest first)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cycle"

  /cycles/{id}:
    get:
      operationId: getCycle
      tags: [cycles]
      summary: Cycle detail incl. observe/orient/decide/act/learn payloads
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Cycle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /cycles/run:
    post:
      operationId: runNextCycle
      tags: [cycles]
      summary: Trigger the next OODA cycle
      description: |
        Runs synchronously by default for the demo dataset. For F500-scale
        runs, pass `async=true` to enqueue the cycle on the background job
        queue and poll `/jobs/{id}` for progress and result.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: async
          required: false
          schema: { type: boolean, default: false }
          description: Enqueue as a background job and return a jobId.
      responses:
        "200":
          description: Synchronous cycle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCycleResponse"
        "202":
          description: Job enqueued for async execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"

  /priors:
    get:
      operationId: listLearnedPriors
      tags: [cycles]
      summary: Learned priors per lever for the active tenant
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Priors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearnedPrior"

  /collectors:
    get:
      operationId: listCollectors
      tags: [collectors]
      summary: List registered intelligence collectors
      responses:
        "200":
          description: Collectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collector"
    post:
      operationId: registerCollector
      tags: [collectors]
      summary: Register a new collector (or upsert an existing one)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCollectorRequest"
      responses:
        "201":
          description: Collector registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorMutationResult"

  /collectors/{id}:
    patch:
      operationId: patchCollector
      tags: [collectors]
      summary: Approve, disable, or rate-limit a collector
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCollectorRequest"
      responses:
        "200":
          description: Updated collector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorMutationResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /collectors/{id}/kill:
    post:
      operationId: killCollector
      tags: [collectors]
      summary: Activate the kill switch for a collector
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Killed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorKillResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /collectors/{id}/unkill:
    post:
      operationId: unkillCollector
      tags: [collectors]
      summary: Release the kill switch for a collector
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Unkilled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorKillResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /collectors/{id}/audit:
    get:
      operationId: listCollectorAudit
      tags: [collectors]
      summary: Audit log for a collector (most-recent first, capped at 100)
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectorAuditEntry"

  /collectors/{id}/run:
    post:
      operationId: runCollector
      tags: [collectors]
      summary: Run a collector once for the active tenant
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Collector run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorRunResult"

  /collectors/ecb-fx-rates/backfill:
    post:
      operationId: backfillEcbFxRates
      tags: [collectors]
      summary: |
        Backfill historical ECB FX reference rates (one-shot, idempotent).
      description: |
        Fetches the ECB historical archive (`eurofxref-hist.xml`, ~5 years
        back) and writes one `fx_rate` MarketSignal per (day × tracked
        currency × EUR/USD base). Re-running is safe: rows that already
        exist for the same `(scope_material_code, observed_at)` are skipped.
      responses:
        "200":
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorBackfillResult"
        "409":
          description: Collector is killed or not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /collectors/fred-economic-index/backfill:
    post:
      operationId: backfillFredEconomicIndex
      tags: [collectors]
      summary: |
        Backfill historical FRED PPI economic-index observations
        (one-shot, idempotent).
      description: |
        Walks every series in the curated FRED PPI list, fetches the last
        ~5 years of observations from the FRED API, and writes one
        `economic_index` MarketSignal per (series × observed_at).
        Re-running is safe: rows that already exist for the same
        `(signal_type, scope_*, observed_at)` are skipped. The regular
        daily collector cron is unaffected — it still fetches latest only.
      responses:
        "200":
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorBackfillResult"
        "409":
          description: |
            Collector is killed, not approved, or the `FRED_API_KEY` env
            var is not set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /collectors/{id}/posture:
    get:
      operationId: getCollectorPosture
      tags: [collectors]
      summary: |
        Read the posture summary for a single collector.
      description: |
        Returns the same shape as `patchCollectorPosture` so the
        Posture tab can prefill its form (and any other tab can
        reuse the resolution) without round-tripping through
        `/collectors`. Tenant membership is required because the
        response includes the per-tenant `tenantOptedIn` resolution;
        admin gating is not applied — analysts may read.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Posture metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorPostureResult"
        "404":
          description: Collector not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: patchCollectorPosture
      tags: [collectors]
      summary: |
        Edit operator-managed posture metadata for a collector.
      description: |
        Lets a platform admin (`x-platform-admin-token`) edit the
        in-database fields backing the Posture & Compliance tab —
        notes (which double as the ToS link snapshot store) and
        per-tenant opt-in for the active tenant. Static contract
        fields like `postureClass`, `disclosureTier`, `jurisdiction`,
        and `retentionDays` live in code on the collector and are
        not editable here.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCollectorPostureRequest"
      responses:
        "200":
          description: Updated posture metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorPostureResult"
        "401":
          description: Missing or invalid platform-admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/collectors/{id}/broadcast-posture:
    post:
      operationId: broadcastCollectorPosture
      tags: [collectors]
      summary: |
        Platform admin: broadcast a per-tenant opt-in decision for a
        collector to every org in one transaction.
      description: |
        Used when the platform team needs to roll a posture-related
        decision (typically a forced opt-out — e.g. a collector's
        underlying source has flipped from `public-api` to a
        `tos_restricted` posture) across the entire fleet. Writes are
        wrapped in a single DB transaction so partial broadcasts can
        never happen, and a `tenant_opt_in_broadcast` audit row is
        emitted per affected tenant for forensic reconstruction.
        Only callable by platform admins (`x-platform-admin-token`);
        no `x-org-id` is required because the action targets all orgs.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastCollectorPostureRequest"
      responses:
        "200":
          description: Broadcast result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastCollectorPostureResult"
        "401":
          description: Missing or invalid platform-admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Collector not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/collectors/{id}/broadcast-posture/preview:
    get:
      operationId: previewBroadcastCollectorPosture
      tags: [collectors]
      summary: |
        Platform admin: preview tenant counts before broadcasting a posture.
      description: |
        Read-only sibling of POST `/admin/collectors/{id}/broadcast-posture`.
        The UI calls this when the operator opens the broadcast confirmation
        dialog so the dialog can show "this will affect N tenants — M opted
        in, K opted out, T no override" *before* the irreversible click.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Tenant breakdown for the broadcast preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastCollectorPosturePreview"
        "401":
          description: Missing or invalid platform-admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Collector not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /collectors/workbench/catalog:
    get:
      operationId: listCollectorCatalog
      tags: [collectors]
      summary: Operator catalog view of every registered collector.
      description: |
        Drives the Catalog tab. Returns one entry per registered
        collector enriched with the workbench-only metadata (ToS URL,
        license note, logo, cadence, scope kinds, output signal types)
        on top of the live registry row. Posture/disclosure/jurisdiction
        come from the collector contract; runtime fields like
        `lastRunAt` come from the DB.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Catalog entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/CollectorCatalogEntry"

  /collectors/workbench/source-health:
    get:
      operationId: listCollectorSourceHealth
      tags: [collectors]
      summary: Source-health roll-up across collectors.
      description: |
        For each collector, computes counts of recent successful runs,
        failures, fetch errors, and schema-drift events from the audit
        log and the schema-drift registry. Used by the Source Health
        tab and the bell-on-failure indicator in the sidebar.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: lookbackHours
          schema: { type: integer, minimum: 1, maximum: 720, default: 168 }
      responses:
        "200":
          description: Source-health entries
          content:
            application/json:
              schema:
                type: object
                required: [entries, lookbackHours]
                properties:
                  lookbackHours: { type: integer }
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/CollectorSourceHealthEntry"

  /collectors/workbench/lineage:
    get:
      operationId: getCollectorLineage
      tags: [collectors]
      summary: Bipartite source → consumer lineage graph.
      description: |
        Returns a static lineage graph linking each collector to the
        BigQuery tables it writes, the marts that read those tables,
        and the lever / fusion-center panes that consume them. Used
        by the Lineage tab and by audit "what citing what" overlays.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Lineage graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorLineageGraph"

  /collectors/workbench/coverage:
    get:
      operationId: getCollectorCoverage
      tags: [collectors]
      summary: |
        Material × jurisdiction coverage matrix vs the tenant's spend.
      description: |
        For every canonical material code in scope-taxonomy, returns
        which collectors cover it (via signal scope) and which
        jurisdictions are present in the tenant's supplier base. Used
        by the Coverage tab to surface gaps.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Coverage matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorCoverageMatrix"

  /collectors/workbench/cost:
    get:
      operationId: getCollectorCost
      tags: [collectors]
      summary: Per-collector cost & throughput estimate.
      description: |
        Returns per-collector cost & throughput for the lookback window,
        choosing the best available source in this priority order:
          1. `billing` — real dollars from the GCP Cloud Billing export
             (set `GCP_BILLING_EXPORT_TABLE` to enable). Splits BigQuery
             query/analysis cost from Cloud Storage cost; per-collector
             attribution by `bytes_raw` share. Daily cache.
          2. `bigquery` — on-demand-pricing estimate from
             `collector_runs.bytes_raw × $5/TB`. No storage cost. Daily cache.
          3. `proxy` — audit-log throughput proxy (rows pulled, runs in
             window) used when GCP isn't configured or the BQ query fails.
        The response always carries a `source` discriminator so the UI can
        badge the row honestly.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: lookbackHours
          schema: { type: integer, minimum: 1, maximum: 720, default: 168 }
      responses:
        "200":
          description: Cost estimates
          content:
            application/json:
              schema:
                type: object
                required: [source, lookbackHours, entries]
                properties:
                  source: { type: string, enum: [proxy, bigquery, billing] }
                  lookbackHours: { type: integer }
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/CollectorCostEntry"

  /collectors/workbench/runs:
    get:
      operationId: listCollectorRunsAndErrors
      tags: [collectors]
      summary: Recent runs and errors across collectors.
      description: |
        Reads the audit log for the past `lookbackHours` and returns
        a flat, paginated stream of run starts/completions and fetch
        errors. Used by the Runs & Errors tab.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: lookbackHours
          schema: { type: integer, minimum: 1, maximum: 720, default: 168 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - in: query
          name: collectorId
          schema: { type: string }
        - in: query
          name: onlyErrors
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                required: [entries, lookbackHours]
                properties:
                  lookbackHours: { type: integer }
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/CollectorAuditEntry"

  /data-sources:
    get:
      operationId: listDataSources
      tags: [collectors]
      summary: Client-facing list of opted-in data sources.
      description: |
        The read-only client view at `/data-sources`. Filters the
        collector registry to entries that are enabled for the active
        tenant (resolved opt-in matrix) and projects only the
        client-safe fields: name, logo, license note, jurisdiction,
        cadence, disclosure tier, last refresh time. No posture-class
        or kill-criteria leakage.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Client data-source cards
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientDataSource"

  /market-signals:
    get:
      operationId: listMarketSignals
      tags: [market-signals]
      summary: Recent market signals
      description: |
        Returns market signals scoped to the active tenant plus any
        platform-wide (orgId IS NULL) signals. Supports filtering by signal
        type and scope so callers can pull a focused time-series — e.g.
        `signalType=fx_rate&scopeMaterialCode=EUR/USD` for an FX trend chart.
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000, default: 50 }
        - in: query
          name: signalType
          description: |
            Filter by signal type (e.g. `fx_rate`, `commodity_index`,
            `economic_index`).
          schema: { type: string }
        - in: query
          name: scopeMaterialCode
          description: |
            Filter by scope material code. For FX rates this is the currency
            pair (e.g. `EUR/USD`, `USD/JPY`). For BLS / FRED commodity PPI
            sub-series this is the canonical material code (e.g. `STEEL`,
            `LUMBER`).
          schema: { type: string }
        - in: query
          name: scopeCategoryCode
          description: |
            Filter by scope category code. Used for category-scoped
            economic-index sub-series (CPI, ECI, freight PPI, etc.) — e.g.
            `FOOD_AT_HOME`, `LABOR_TOTAL_COMP`, `FREIGHT`.
          schema: { type: string }
        - in: query
          name: observedAfter
          description: |
            Lower bound (inclusive) on `observedAt`. ISO-8601 datetime.
          schema: { type: string, format: date-time }
        - in: query
          name: observedBefore
          description: |
            Upper bound (inclusive) on `observedAt`. ISO-8601 datetime.
          schema: { type: string, format: date-time }
        - in: query
          name: order
          description: |
            Sort direction on `observedAt`. Defaults to `desc` so callers
            that just want "latest 50" keep working unchanged. Use `asc`
            when fetching a chart-friendly time-series.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketSignal"

